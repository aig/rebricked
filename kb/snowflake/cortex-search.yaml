id: cortex-search
name: Cortex Search
vendor: snowflake
category: AI / ML
what:
  note: Managed retrieval service for low-latency, high-quality fuzzy search over Snowflake data, typically as the retrieval half of a RAG application.
  link: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-overview#:~:text=low%2Dlatency%2C%20high%2Dquality
fact:
  - note: It is not a pure vector index - quality comes from combining vector search, keyword search and semantic reranking behind one API.
    link: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-overview#:~:text=semantic%20reranking
  - note: Its default embedding model is one Snowflake trained itself, snowflake-arctic-embed-m-v1.5.
    link: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-search/cortex-search-overview#:~:text=snowflake%2Darctic%2Dembed%2Dm%2Dv1.5
