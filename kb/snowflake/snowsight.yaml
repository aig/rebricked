what:
  note: Snowflake's web interface, giving one place to query, explore, build dashboards and administer the account in SQL or Python.
  link: https://docs.snowflake.com/en/user-guide/ui-snowsight#:~:text=Snowsight%20provides%20a%20unified%20experience%20for%20working%20with%20your%20Snowflake%20data
fact:
  - note: Snowflake spent a full year coaxing people into it - at the end of 2021 its own blog was still pitching the new UI as a New Year's resolution.
    link: https://www.snowflake.com/en/blog/new-year-new-ui-get-started-in-snowsight/#:~:text=make%20it%20your%20New%20Year%27s%20resolution
  - note: It is now the only interface Snowflake offers, Private Link and VPS accounts included, so there is no longer anything to switch back to.
    link: https://docs.snowflake.com/en/release-notes/bcr-bundles/2025_06/bcr-2080#:~:text=Snowsight%20becomes%20the%20only%20available%20interface
