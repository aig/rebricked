id: snowflake-notebooks
name: Snowflake Notebooks
vendor: snowflake
category: Developer experience
what:
  note: A cell-based development interface inside Snowsight mixing Python, SQL and Markdown in one document, running on either a warehouse or a container compute pool.
  link: https://docs.snowflake.com/en/user-guide/ui-snowsight/notebooks#:~:text=a%20unified%20development%20interface%20in%20Snowsight
fact:
  - note: Which runtime you pick changes the Python under you - the warehouse runtime runs one version, the container runtime another, in the same notebook UI.
    link: https://docs.snowflake.com/en/user-guide/ui-snowsight/notebooks#:~:text=a%20unified%20development%20interface%20in%20Snowsight
  - note: 'SQL cells are not emulated in Python: they run on the warehouse as real queries, alongside the Python cells in the same session.'
    link: https://docs.snowflake.com/en/user-guide/ui-snowsight/notebooks#:~:text=Python%2C%20SQL%2C%20and%20Markdown
