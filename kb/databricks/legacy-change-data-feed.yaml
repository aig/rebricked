    kind: official
    label: 'Databricks release notes: Automatic change data feed GA, the note that made this one legacy (September 2026)'
  - url: https://learn.microsoft.com/en-us/azure/databricks/tables/features/change-data-feed
    kind: official
    label: 'Microsoft Learn: Use change data feed on Azure Databricks'
