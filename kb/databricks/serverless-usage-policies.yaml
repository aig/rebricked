what:
  note: Admin-defined tag sets applied automatically to a user's serverless compute usage, so serverless spend in notebooks, jobs and pipelines is attributed to a team or project instead of one undifferentiated bill.
  link: https://docs.databricks.com/aws/en/admin/usage/budget-policies#:~:text=Serverless%20usage%20policies%20consist%20of%20tags
fact:
  - note: Nothing announced this name. No release note on any cloud mentions it, and the docs simply switched over at some point between March and June 2026.
    link: https://web.archive.org/web/20260615202245/https://docs.databricks.com/aws/en/admin/usage/budget-policies
  - note: The page still lives at an address ending in /budget-policies, a phrase that now appears nowhere in its own title.
    link: https://docs.databricks.com/aws/en/admin/usage/budget-policies
  - note: It has carried a Public Preview banner continuously since October 2024, outlasting two of its own names without ever reaching general availability.
    link: https://docs.databricks.com/aws/en/admin/usage/budget-policies#:~:text=This%20feature%20is%20in%20Public%20Preview
