id: genie-one-mcp-server
name: Genie One MCP server
aliases:
  - Genie One Managed MCP Server
  - Genie MCP server
category: AI / BI
what:
  note: Databricks managed MCP server that exposes Genie as a conversational tool, so any MCP client can ask a natural-language question of workspace data and get an answer grounded in Genie Ontology with deep links back to the cited sources.
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=exposes%20Genie%20as%20a%20conversational%20tool
fact:
  - note: It can answer with more than text - on clients that support MCP Apps it returns an interactive View that renders Genie's progress, visualizations, and Ontology citations inside the client.
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=render%20an%20interactive%20View
  - note: 'Because a whole agent runs behind the question, answers are asynchronous: the client calls genie_ask, then keeps polling genie_poll_response until Genie has finished thinking.'
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=The%20agent%20polls%20genie_poll_response%20until%20the%20response%20completes
  - note: Its URL, /api/2.0/mcp/genie, is the prefix of the per-agent Genie server's own address, and it answers across the whole workspace - so the docs stop to point you at the Genie Agent MCP server when you want one curated agent instead.
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=To%20scope%20analytics%20to%20one%20curated%20Genie%20Agent%2C%20use%20the%20Genie%20Agent%20MCP%20server
status:
  value: active
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=is%20a%20Databricks%20managed%20MCP%20server
  date: '2026-08-20'
releases:
  - type: beta
    date: 2026-05
    link: https://docs.databricks.com/aws/en/ai-bi/release-notes/2026#:~:text=Genie%20One%20now%20has%20a%20Managed%20MCP%20Server
introducedAt:
