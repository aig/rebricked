  link: https://docs.databricks.com/aws/en/ai-bi/release-notes/2026#:~:text=The%20Genie%20One%20MCP%20App%20adds%20rich%20UI%20interactions
  note: Genie One MCP App shipped in Beta, July 2026
limitations:
  note: Requires the Managed MCP Servers workspace preview and on-behalf-of user authentication, since service principals are not supported. Query results come back truncated to protect the model context window, so an agent needs genie_get_query_result for the full set, and it must wait for one poll call to finish before polling again.
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=return%20truncated%20query%20results
  date: '2026-08-20'
