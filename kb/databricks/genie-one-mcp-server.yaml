limitations:
  note: Query results come back truncated to protect the model context window, so an agent needs genie_get_query_result for the full set, and very large results are still capped. The Beta endpoint /api/2.0/mcp/genie is deprecated and will be sunset on October 31, 2026.
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=return%20truncated%20query%20results
