id: genie-one-mcp-server
name: Genie One MCP server
aliases:
  - Genie One Managed MCP Server
  - Genie MCP server
  - system.ai.genie_one_mcp
category: AI / BI
what:
  note: Databricks-provided MCP Service in Unity Gateway that exposes Genie as a conversational tool, so any MCP client can ask a natural-language question of workspace data and get an answer grounded in Genie Ontology with deep links back to the cited sources.
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=exposes%20Genie%20as%20a%20conversational%20tool
fact:
  - note: It can answer with more than text - on clients that support MCP Apps it returns an interactive View that shows Genie's progress, visualizations, and final answer inside the client.
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=render%20an%20interactive%20View
  - note: 'Because a whole agent runs behind the question, answers are asynchronous: the client calls genie_ask, then keeps polling genie_poll_response until Genie has finished thinking.'
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=The%20agent%20polls%20genie_poll_response%20until%20the%20response%20completes
  - note: It moved house on its way to GA - the Beta lived at /api/2.0/mcp/genie, the GA version is the MCP Service system.ai.genie_one_mcp, and the old address is deprecated and set to go dark on October 31, 2026.
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/genie-mcp#:~:text=is%20deprecated%20and%20will%20be%20sunset%20on%20October%2031%2C%202026
