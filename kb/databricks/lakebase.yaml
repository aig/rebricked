id: lakebase
name: Lakebase
aliases:
  - Lakebase Postgres
  - OLTP Database
  - Databricks Postgres
category: Data engineering
what:
  note: A fully managed, serverless Postgres (OLTP) database integrated into the Databricks platform, for building real-time transactional apps alongside lakehouse data.
  link: https://docs.databricks.com/aws/en/oltp/#:~:text=a%20fully%20managed%20Postgres%20database%20integrated%20into%20the%20Databricks%20platform
fact:
  - note: It's a managed serverless Postgres for transactional apps - with instant database branching, so you can fork a whole database's worth of state in seconds.
    link: https://docs.databricks.com/aws/en/oltp/#:~:text=Create%20a%20new%20branch%20from%20any%20point%20in%20time
  - note: In August 2025 the Compute section's 'OLTP Database' tab was quietly renamed 'Lakebase Postgres.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/august#:~:text=renamed%20to%20Lakebase%20Postgres
  - note: You can debug it by talking to it - database issues and early warnings surface as Insights and you investigate them conversationally with Genie, all fed by database telemetry captured into Unity Catalog.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=Both%20draw%20on%20database%20telemetry%20captured%20to%20Unity%20Catalog
