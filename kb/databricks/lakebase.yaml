  note: GA announcement blog, February 2026
limitations:
  note: 'Lakebase Postgres enforces per-project limits: a default of 20 concurrently active computes (the default branch is exempt, and Support can raise the limit), up to 500 branches per project, 500 Postgres roles and 500 databases per branch, 6 read replicas per branch, a 16 TB storage quota per branch that Support can also raise, up to 1000 projects per workspace, and a history retention window of at most 30 days.'
  link: https://learn.microsoft.com/en-us/azure/databricks/oltp/projects/manage-projects#:~:text=The%20default%20limit%20is%2020%20concurrently%20active%20computes%20per%20project
  date: '2026-08-20'
