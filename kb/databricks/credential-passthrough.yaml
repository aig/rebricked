id: credential-passthrough
name: Credential passthrough
aliases:
  - IAM credential passthrough
  - ADLS credential passthrough
  - passthrough clusters
category: Data governance
what:
  note: Cluster-level authentication that let a notebook reach cloud storage as the person running it, using the identity they logged into Databricks with instead of a shared workspace role.
  link: https://docs.databricks.com/aws/en/archive/credential-passthrough/#:~:text=using%20the%20identity%20that%20you%20use%20to%20log%20in
fact:
  - note: It worked by having the cluster borrow your login identity, so the same notebook reached different buckets depending on who pressed run.
    link: https://docs.databricks.com/aws/en/archive/credential-passthrough/#:~:text=using%20the%20identity%20that%20you%20use%20to%20log%20in
  - note: It could not coexist with Unity Catalog - ticking the passthrough checkbox switched Unity Catalog off on that cluster, which is a fairly loud hint about which one had a future.
    link: https://learn.microsoft.com/en-us/azure/databricks/archive/compute/cluster-ui-preview#:~:text=disable%20Unity%20Catalog%20on%20the%20cluster
  - note: 'Its deprecation is pinned to a runtime version rather than a calendar date: from Databricks Runtime 15.0 on it is deprecated, with removal promised in some future version.'
    link: https://docs.databricks.com/aws/en/archive/credential-passthrough/#:~:text=deprecated%20starting%20with%20Databricks%20Runtime%2015.0
status:
  value: deprecated
  link: https://docs.databricks.com/aws/en/archive/credential-passthrough/#:~:text=deprecated%20starting%20with%20Databricks%20Runtime%2015.0
  date: '2026-08-20'
deprecatedAt:
  date: 2024-05
  link: https://docs.databricks.com/aws/en/release-notes/product/2024/may#:~:text=are%20deprecated%20on%20Databricks%20Runtime%2015.0
successorId: unity-catalog
replacement: Unity Catalog
links:
  - url: https://docs.databricks.com/aws/en/release-notes/product/2024/may
    kind: official
    label: 'Databricks release notes: credential passthrough and table ACLs deprecated (May 2024)'
source: https://docs.databricks.com/aws/en/archive/credential-passthrough/
verified: '2026-08-20'
