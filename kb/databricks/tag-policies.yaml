id: tag-policies
name: Tag policies
category: Data governance
what:
  note: The first name for account-level rules that define which tag keys and values are allowed on Unity Catalog assets and who is permitted to assign them.
  link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Tag%20policies%20define%20allowed%20tag%20keys%20and%20values
fact:
  - note: The release note announcing it already gave the game away, sending readers to a documentation page titled Governed tags for more information.
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Tag%20policies%20are%20managed%20at%20the%20account%20level
  - note: It shipped as a governance feature with a name that described the rule rather than the thing being ruled, which is presumably why the thing being ruled won.
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=enforce%20consistent%20tagging%20across%20data%20assets
status:
