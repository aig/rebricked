limitations:
  note: Shared tabular data must be Delta or managed Iceberg; providers can't share tables using liquid clustering with partition filtering, collations, row filters, column masks, or SHALLOW CLONE; notebooks, volumes, and AI models can only be shared Databricks-to-Databricks; and shareable views must be defined on Delta tables or other shareable views.
  link: https://docs.databricks.com/aws/en/delta-sharing/#:~:text=must%20be%20in%20Delta%20or%20managed%20Iceberg%20table%20format
  date: '2026-07-23'
