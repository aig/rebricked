id: opensharing
name: OpenSharing
aliases:
  - Delta Sharing
  - Open Sharing
category: Data governance
what:
  note: Open protocol and Databricks service for securely sharing data and AI assets across organizations and platforms, with or without Databricks.
  link: https://docs.databricks.com/aws/en/opensharing/#:~:text=share%20non%2DDatabricks%20data%20with%20recipients%20on%20any%20data%20platform
fact:
  - note: It's an open protocol, so you can share a live table with someone who's never touched Databricks - and in 2026 the standard itself was open-sourced as OpenSharing at opensharing.io.
    link: https://docs.databricks.com/aws/en/opensharing/#:~:text=available%20as%20an%20open%2Dsource%20project
  - note: Its scope grew beyond data sharing to cover the full AI stack, with the standard handed to the Linux Foundation.
    link: https://www.databricks.com/blog/introducing-opensharing-next-evolution-delta-sharing-agentic-era#:~:text=now%20hosted%20by%20the%20Linux%20Foundation
  - note: Streaming reads used to quietly downgrade a catch-up-on-everything trigger into a run-once one, so a job that promised to process all available data handled a single micro-batch per run.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=which%20processed%20a%20single%20micro%2Dbatch%20per%20run
