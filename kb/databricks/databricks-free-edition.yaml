limitations:
  note: 'Serverless-only and heavily capped: one 2X-Small SQL warehouse, at most 5 concurrent job tasks, up to 3 apps (auto-stopped after 24 hours), no GPUs or provisioned throughput by default, no R or Scala, no SSO/SCIM, a single workspace/metastore per account, and non-commercial use only; exceeding a quota shuts the workspace for the rest of the day.'
  link: https://docs.databricks.com/aws/en/getting-started/free-edition-limitations#:~:text=Free%20Edition%20users%20only%20have%20access%20to%20serverless%20compute%20resources
