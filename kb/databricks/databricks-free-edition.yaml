id: databricks-free-edition
name: Databricks Free Edition
aliases:
  - Free Edition
category: Developer experience
what:
  note: A no-cost, serverless-only edition of the Databricks platform for students, educators, and hobbyists to learn and experiment - notebooks, SQL, dashboards, ML models, and AI apps in a single quota-limited workspace.
  link: https://docs.databricks.com/aws/en/getting-started/free-edition#:~:text=no%2Dcost%20version%20of%20Databricks
fact:
  - note: It runs serverless-only with hard quotas - blow past them and the whole workspace shuts down for the rest of the day (or month, in extreme cases), though your data survives the timeout.
    link: https://docs.databricks.com/aws/en/getting-started/free-edition-limitations#:~:text=unavailable%20for%20the%20rest%20of%20the%20day%20%28and%20in%20extreme%20cases%2C%20the%20rest%20of%20the%20month%29
  - note: Verifying your identity through LinkedIn unlocks perks the base tier withholds - limited GPU compute and outbound internet access.
    link: https://docs.databricks.com/aws/en/getting-started/free-edition-limitations#:~:text=LinkedIn
status:
