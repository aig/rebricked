id: unity-catalog-managed-iceberg-tables
name: Unity Catalog managed Iceberg tables
aliases:
  - managed Iceberg tables
  - Iceberg managed tables
  - UC Iceberg
category: Data engineering
what:
  note: Apache Iceberg tables created and fully managed by Unity Catalog, readable and writable by external Iceberg engines through the Unity Catalog Iceberg REST Catalog API.
  link: https://docs.databricks.com/aws/en/iceberg/#:~:text=Iceberg%20tables%20that%20you%20create%20in%20Unity%20Catalog%20are%20managed%20Iceberg%20tables
fact:
  - note: These Iceberg tables are managed by Unity Catalog yet fully read/write to outside engines like Trino and Flink - through a REST catalog that even hands out temporary storage credentials.
    link: https://docs.databricks.com/aws/en/iceberg/#:~:text=delivers%20temporary%20credentials%20to%20external%20engines
  - note: The managed Iceberg tables still get Databricks perks like liquid clustering, predictive optimization, and materialized views.
    link: https://docs.databricks.com/aws/en/iceberg/#:~:text=Predictive%20optimization
status:
  value: active
  link: https://docs.databricks.com/aws/en/iceberg/#:~:text=you%20create%20in%20Unity%20Catalog%20are%20managed%20Iceberg%20tables
