limitations:
  note: Path-based access isn't supported except in Compatibility Mode (which bypasses Unity Catalog access controls), managed Iceberg tables support only deep cloning (not shallow clone), and transactions that write to managed Iceberg tables are in Private Preview.
  link: https://docs.databricks.com/aws/en/tables/managed#:~:text=support%20only%20deep%20cloning
