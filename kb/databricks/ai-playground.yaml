id: ai-playground
name: AI Playground
aliases:
  - Playground
  - Databricks AI Playground
  - LLM playground
category: AI / ML
what:
  note: A no-code chat environment in the Databricks workspace for interactively testing, prompting, and comparing LLMs side by side, and for prototyping tool-calling agents and question-answering bots that can then be exported to code.
  link: https://docs.databricks.com/aws/en/large-language-models/ai-playground#:~:text=The%20AI%20Playground%20is%20a%20chat%20environment%20for%20Large%20Language%20Models
fact:
  - note: It has moved house in the sidebar - in December 2023 you found the Playground item under Machine Learning, and today the docs send you to Playground under AI/ML.
    link: https://docs.databricks.com/aws/en/large-language-models/ai-playground#:~:text=Select%20Playground%20from%20the%20left%20navigation%20pane%20under%20AI%2FML
  - note: Pressing the + adds another endpoint to the same chat, so several models answer the same prompt at once and you can compare their responses next to each other.
    link: https://docs.databricks.com/aws/en/large-language-models/ai-playground#:~:text=compare%20multiple%20model%20responses
  - note: It learned to prototype and export tool-calling agents in September 2024, and two years later that is the part the docs call legacy - chatting with models is still fine, but agents now go to the Agent Bricks CLI.
    link: https://docs.databricks.com/aws/en/large-language-models/ai-playground#:~:text=Building%20agents%20in%20AI%20Playground%20is%20a%20legacy%20approach
