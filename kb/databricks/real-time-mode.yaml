id: real-time-mode
name: Real-Time Mode
aliases:
  - RTM
  - Real-time mode in Structured Streaming
  - Spark real-time mode
  - real-time trigger
category: Data engineering
what:
  note: A trigger type for Apache Spark Structured Streaming that swaps periodic micro-batches for long-running batches processed as data arrives, up to 100x faster than micro-batch mode, for operational workloads such as fraud detection on the same Spark APIs.
  link: https://docs.databricks.com/aws/en/structured-streaming/real-time/concepts#:~:text=is%20a%20trigger%20type%20for%20Structured%20Streaming%20that%20is%20up%20to%20100x%20faster%20than%20micro%2Dbatch%20mode
fact:
  - note: 'Its route to millisecond latency is, paradoxically, longer batches: each one runs for five minutes by default, processing data the moment it lands instead of waiting for the next micro-batch.'
    link: https://docs.databricks.com/aws/en/structured-streaming/real-time/concepts#:~:text=Executing%20long%2Drunning%20batches%20%28the%20default%20is%20five%20minutes%29
  - note: The fastest streaming mode on Databricks asks you to switch off Databricks' own fast engine - the setup checklist says to turn off Photon (and autoscaling, and spot instances).
    link: https://docs.databricks.com/aws/en/structured-streaming/real-time/setup#:~:text=Turn%20off%20Photon
  - note: It did not stay proprietary - the stateless half of it ships in open-source Apache Spark 4.1.
    link: https://www.databricks.com/blog/announcing-general-availability-real-time-mode-apache-spark-structured-streaming-databricks#:~:text=RTM%20for%20stateless%20transformations%20is%20now%20available%20in%20open%2Dsource%20Apache%20Spark%204.1
status:
