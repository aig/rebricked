occasion:
  date: 2026-03
  link: https://www.databricks.com/blog/announcing-general-availability-real-time-mode-apache-spark-structured-streaming-databricks#:~:text=Real%2DTime%20Mode%20%28RTM%29%20in%20Apache%20Spark%20Structured%20Streaming%20is%20now%20Generally%20Available
  note: GA announced March 19, 2026
limitations:
  note: Direct Structured Streaming queries need classic compute on Databricks Runtime 16.4 LTS and above (dedicated access mode, or standard access mode for Python only) with autoscaling, Photon, and spot instances turned off; serverless notebooks and jobs can't run them, so serverless real-time processing goes through Lakeflow pipelines instead. Update output mode only. Sources are Kafka, Event Hubs (Kafka connector), Kinesis, and AWS MSK; Delta is supported as neither a source nor a sink. Stream-to-stream outer joins aren't supported, and stream-to-table joins need a broadcast table of 10 MB or less.
  link: https://docs.databricks.com/aws/en/structured-streaming/real-time/setup#:~:text=For%20serverless%20real%2Dtime%20processing%2C%20use%20real%2Dtime%20mode%20in%20Lakeflow%20pipelines
  date: '2026-10-30'
