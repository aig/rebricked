  link: https://docs.databricks.com/aws/en/structured-streaming/real-time/concepts#:~:text=Use%20real%2Dtime%20mode%20for%20operational%20workloads%20that%20require%20immediate%20response%20to%20streaming%20data
  date: '2026-09-27'
