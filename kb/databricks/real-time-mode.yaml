occasion:
  date: 2026-03
  link: https://www.databricks.com/blog/announcing-general-availability-real-time-mode-apache-spark-structured-streaming-databricks#:~:text=Real%2DTime%20Mode%20%28RTM%29%20in%20Apache%20Spark%20Structured%20Streaming%20is%20now%20Generally%20Available
  note: GA announced March 19, 2026
limitations:
  note: Classic compute only on Databricks Runtime 16.4 LTS and above (dedicated access mode, or standard access mode for Python only) - serverless and Lakeflow pipelines can't run it as Structured Streaming - with autoscaling, Photon, and spot instances turned off, and enough task slots to schedule every stage at once. Update output mode only. Sources are Kafka, Event Hubs (Kafka connector), Kinesis, and AWS MSK; sinks are Kafka, Event Hubs, and forEach writers, so Delta is supported as neither. No session windows, forEachBatch, (flat)MapGroupsWithState, transformWithStateInPandas, Python UDTFs, or stream-to-stream outer joins; stream-to-table joins need a broadcast table of 10 MB or less.
  link: https://docs.databricks.com/aws/en/structured-streaming/real-time/setup#:~:text=Lakeflow%20pipelines%20and%20serverless%20clusters%20are%20not%20supported
  date: '2026-09-27'
