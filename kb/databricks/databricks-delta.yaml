id: databricks-delta
name: Databricks Delta
category: Data engineering
what:
  note: The proprietary Databricks table format that adds ACID transactions, schema enforcement, and time travel to data lakes.
  link: https://www.databricks.com/blog/2019/04/24/open-sourcing-delta-lake.html#:~:text=brings%20reliability%20to%20your%20data%20lakes
fact:
  - note: Unveiled at Spark Summit Europe 2017 as a single system fusing a data lake's scale, a warehouse's query speed and a streaming pipe's low latency, storing everything as plain Parquet on S3 while promising up to 100x faster queries.
    link: https://www.databricks.com/blog/2017/10/25/databricks-delta-a-unified-management-system-for-real-time-big-data.html#:~:text=combines%20the%20best%20of%20data%20warehouses%2C%20data%20lakes%2C%20and%20streaming
