limitations:
  note: Only built-in contextual policies are supported, not custom policy functions running arbitrary code; there is no native Windows support (WSL2 is required); Databricks Sandbox hosts cannot use custom model API keys because all model access routes through AI Gateway; and it does not work with serverless egress control.
  link: https://docs.databricks.com/aws/en/omnigent/#:~:text=custom%20policy%20functions
  date: '2026-08-12'
