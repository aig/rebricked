id: omnigent
name: Omnigent
aliases:
  - Omnigent on Databricks
  - coding agent meta-harness
category: AI / ML
what:
  note: A coding agent meta-harness that wraps agents such as Claude Code, Codex, Cursor and Pi in one platform, adding a web UI, shareable persistent sessions, contextual policies and deployment infrastructure.
  link: https://docs.databricks.com/aws/en/omnigent/#:~:text=provides%20a%20common%20layer%20over
fact:
  - note: 'It is a harness for harnesses: rather than shipping its own coding agent, it provides a common layer over Claude Code, Codex, Cursor, Pi and whatever you wrote yourself.'
    link: https://docs.databricks.com/aws/en/omnigent/#:~:text=provides%20a%20common%20layer%20over
  - note: Switching which agent runs your work is a one-line change - swap a line of configuration and your tools, policies and prompts carry over to the new runtime unchanged.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Swap%20one%20line%20of%20configuration%20to%20switch%20runtimes
  - note: 'Databricks gave a coding-agent platform the least coding-adjacent name available: Omnigent shipped in Beta in June 2026 with mobile access as a listed feature.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=mobile%20access
status:
