  note: Launch blog as Unity Catalog Pages, September 22, 2026
limitations:
  note: No customer-managed key encryption, and Page data may be replicated globally, so PII and regulated data must stay out of it. On workspaces with the compliance security profile, Pages work only when the profile uses the HIPAA, PCI-DSS, C5, TISAX, or HITRUST standard, and they are not available in AWS GovCloud. Every Page hangs off a domain, so at least one domain must exist first, and access is inherited from that domain rather than granted per Page.
  link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=customer%2Dmanaged%20key%20%28CMK%29%20encryption
  date: '2026-11-13'
