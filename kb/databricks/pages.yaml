id: pages
name: Pages
aliases:
  - Unity Catalog Pages
category: Data governance
what:
  note: Governed, authoritative definitions of business concepts - a critical term, entity, or acronym - authored in Unity Catalog semantics, organized by domain on the Discover page, and read by Genie One as trusted context.
  link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=governed%2C%20authoritative%20definition%20of%20a%20business%20concept
fact:
  - note: The canonical home for a company's business definitions is explicitly not the place for anything sensitive - Pages are account-level, so the docs warn that Page data may be replicated globally and tell you to keep PII and regulated data out of names, descriptions, synonyms, and body text.
    link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=Page%20data%20may%20be%20replicated%20globally
  - note: Suggested edits arrive in batches, and accepting one batch clears every other pending batch on the Page - including other people's - with no undo.
    link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=clears%20every%20other%20pending%20batch
  - note: When a human-written Page and Genie's own learned knowledge disagree, the human wins - Genie One prioritizes the Page and cites it in the answer.
    link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=prioritizes%20the%20modeled%20knowledge%20in%20your%20Pages%20over%20learned%20knowledge
