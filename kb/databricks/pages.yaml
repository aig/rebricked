id: pages
name: Pages
category: Data governance
what:
  note: Governed, authoritative definitions of business concepts - a term, acronym, or KPI - authored in Unity Catalog semantics, organized by domain, and read by Genie One as trusted context.
  link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=governed%2C%20authoritative%20definition%20of%20a%20business%20concept
fact:
  - note: The canonical home for a company's business definitions is explicitly not the place for anything sensitive - the docs warn that Page data has no customer-managed key encryption and is 'stored in plain text that may be replicated globally'.
    link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=stored%20in%20plain%20text%20that%20may%20be%20replicated%20globally
  - note: Suggested edits arrive in batches, and accepting one batch clears every other pending batch on the Page - including other people's - with no undo.
    link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=clears%20every%20other%20pending%20batch
  - note: When a human-written Page and Genie's own inferred context disagree, the human wins - Genie One prefers the Page and cites it in the answer.
    link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=over%20context%20it%20infers%20automatically
status:
  value: active
  link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=A%20Page%20is%20a%20governed%2C%20authoritative%20definition
  date: '2026-08-20'
releases:
  - type: beta
    date: 2026-08
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=Define%20business%20concepts%20with%20Pages
introducedAt:
  date: 2026-08
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=You%20can%20now%20use%20Pages%20to%20give%20business%20terms
limitations:
  note: Beta, gated on the account console Previews page. Page data has no customer-managed key encryption and is stored in plain text that may be replicated globally, so PII and regulated data must stay out of it. Every Page hangs off a domain, so at least one domain must exist first, and permissions are inherited from that domain rather than granted per Page.
  link: https://docs.databricks.com/aws/en/uc-semantics/pages#:~:text=does%20not%20support%20customer%2Dmanaged%20key%20%28CMK%29%20encryption
  date: '2026-08-20'
