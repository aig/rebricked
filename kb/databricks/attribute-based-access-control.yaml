  link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Attribute%2Dbased%20access%20control%20%28ABAC%29%20in%20Unity%20Catalog%20is%20in%20Beta
occasion:
  date: 2026-05
  link: https://www.databricks.com/blog/abac-row-filtering-and-column-masking-policies-governed-tags-and-data-classification-are-now#:~:text=announce%20the%20General%20Availability%20of%20three%20complementary%20capabilities
  note: GA announcement blog, May 2026
limitations:
  note: Needs serverless compute or Databricks Runtime 16.4 and above, and only governed tags count; policies can't be applied directly to views, though they are still enforced when a view reads a protected table; quotas apply (10,000 policies per metastore, 100 per catalog or schema, 50 per table, 20 principals per policy); time travel queries and deep or shallow clones fail on policy-protected tables unless the principal is exempted; and AI Search indexes don't enforce row filters or column masks.
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/requirements#:~:text=You%20can%27t%20apply%20ABAC%20policies%20directly%20to%20views
  date: '2026-08-20'
