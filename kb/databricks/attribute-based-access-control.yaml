id: attribute-based-access-control
name: Attribute-based access control (ABAC)
aliases:
  - ABAC
  - attribute-based access control
category: Data governance
what:
  note: Unity Catalog access-control model that grants or restricts access by evaluating governed tags (attributes) on securables, so one policy on a catalog or schema applies to everything beneath it.
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/#:~:text=access%20is%20determined%20by%20evaluating%20attributes
fact:
  - note: Tag a column 'pii' once and a single catalog-level policy masks it everywhere beneath - no more re-granting access table by table.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/#:~:text=attached%20at%20a%20level%20in%20the%20Unity%20Catalog%20hierarchy
  - note: The same tag-driven policies do both row filtering and column masking, on tables, materialized views, and streaming tables alike.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/#:~:text=supports%20row%20and%20column%2Dlevel%20security%20through
  - note: Its GRANT policies hand out privileges to whatever matches a tag condition instead of object by object - generally available for models, model services, MCP services, and agent services since August 31, 2026 - and a week later got a DENY twin in Beta that beats any grant, including the object owner's.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=They%20always%20take%20precedence%20over%20any%20grant
status:
  value: active
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/#:~:text=Attribute%2Dbased%20access%20control%20%28ABAC%29
