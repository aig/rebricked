id: ai-runtime
name: AI Runtime (GPU serverless)
aliases:
  - AI Runtime
  - Serverless GPU compute
category: Compute / BI
what:
  note: GPU support for Databricks serverless compute - on-demand accelerators for deep-learning training and fine-tuning, single-node and multi-node, with no clusters to provision.
  link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/#:~:text=brings%20GPU%20support%20for%20Databricks%20Serverless
fact:
  - note: It puts on-demand H100s behind serverless compute, so a deep-learning job spins up GPUs without anyone sizing a cluster - single-node tasks are in Public Preview while the distributed multi-GPU training API is still catching up in Beta.
    link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/#:~:text=AI%20Runtime%20provides%20on%2Ddemand%20access%20to%20GPU%20resources.
  - note: It first showed up in June 2025 under the plainer name 'Serverless GPU compute.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Serverless%20GPU%20compute%20is%20in%20Beta
status:
  value: active
  link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/#:~:text=AI%20Runtime%20is%20a%20compute%20offering%20at%20Databricks
  date: '2026-07-23'
