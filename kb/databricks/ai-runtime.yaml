  note: Debuted as Serverless GPU compute (Beta), Data + AI Summit June 2025
limitations:
  note: Only A10 and H100 accelerators; the maximum workload runtime is seven days; no FedRAMP High or DoD IL5 compliance. For scheduled jobs, Environments-panel dependencies and auto-recovery for incompatible packages aren't supported, and cross-region GPUs during peak demand can incur egress costs.
  link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/#:~:text=The%20maximum%20runtime%20for%20a%20workload%20is%20seven%20days.
  date: '2026-07-23'
