id: ai-runtime
name: AI Runtime (GPU serverless)
aliases:
  - AI Runtime
  - Serverless GPU compute
category: Compute / BI
what:
  note: GPU support for Databricks serverless compute - on-demand A10, H100, and B300 accelerators for deep-learning training and fine-tuning, with no clusters to provision.
  link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/overview#:~:text=AI%20Runtime%20is%20serverless%20GPU%20compute%20on%20Databricks%20for%20deep%20learning%20workloads
fact:
  - note: It puts on-demand GPUs behind serverless compute, so a deep-learning job gets accelerators without anyone sizing a cluster - the catch the docs admit is that on-demand also means periods where GPU capacity in your region is constrained or unavailable.
    link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/overview#:~:text=AI%20Runtime%20provides%20on%2Ddemand%20access%20to%20GPU%20resources.
  - note: It first showed up in June 2025 under the plainer name 'Serverless GPU compute.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Serverless%20GPU%20compute%20is%20in%20Beta
  - note: 'The old name outlived the rebrand in code: the Python package was still called serverless_gpu until the AI Runtime SDK (databricks-sdk-air) replaced it in GPU environment version 6, with support ending in version 7.'
    link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/distributed-training#:~:text=The%20serverless_gpu%20package%20is%20deprecated
status:
  value: active
