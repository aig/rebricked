limitations:
  note: Only A10, H100, and B300 accelerators; no compliance security profile support for FedRAMP High or DoD IL5. Connection attempts time out after 15 minutes for interactive notebooks and 24 hours for jobs; connected notebook sessions and notebook jobs run for up to two days and CLI jobs for up to 14 days, so long training needs checkpointing. For scheduled jobs, Environments-panel dependencies and auto-recovery for incompatible packages aren't supported; GPU capacity can be constrained, and cross-region GPUs during peak demand can incur egress costs.
  link: https://docs.databricks.com/aws/en/machine-learning/ai-runtime/overview#:~:text=CLI%20jobs%20can%20run%20for%20up%20to%2014%20days
  date: '2026-10-22'
