category: Data governance
what:
  note: In-workspace UI for browsing and managing Unity Catalog securables - schemas, tables, models, functions, and other assets.
  link: https://docs.databricks.com/aws/en/catalog-explorer/#:~:text=schemas%20%28databases%29%2C%20tables%2C%20models%2C%20functions
fact:
  - note: It got promoted from 'Data Explorer' once it started managing models, functions, and volumes too - not just tables - though the sidebar still just calls it 'Catalog.'
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2023/september#:~:text=work%20with%20all%20securable%20objects%20in%20Unity%20Catalog%2C%20not%20just%20data%20objects
  - note: Despite the promotion it still shows up as plain 'Catalog' in the sidebar, and it now governs every Unity Catalog securable, not just tables.
    link: https://docs.databricks.com/aws/en/catalog-explorer/#:~:text=tables%2C%20models%2C%20functions%2C%20and%20other%20AI%20assets
