id: unity-catalog-wikis
name: Unity Catalog wikis
aliases:
  - wikis
  - table wiki
  - Catalog Explorer wiki
category: Data governance
what:
  note: A Catalog Explorer feature that documents one table's meaning, intended use, and sources as a rich-text wiki the team can comment on, suggest edits to, and upvote or downvote - stored as metadata on the table, so the table's own Unity Catalog privileges decide who can read or manage it.
  link: https://docs.databricks.com/aws/en/uc-semantics/wikis#:~:text=A%20wiki%20lets%20your%20team%20document%20a%20table%27s%20meaning%2C%20intended%20use%2C%20and%20sources
fact:
  - note: A wiki isn't a securable object - it hangs off its table as metadata, so there is no GRANT for it; whoever can MANAGE the table manages its wiki.
    link: https://docs.databricks.com/aws/en/uc-semantics/wikis#:~:text=A%20wiki%20isn%27t%20a%20securable%20object
  - note: Create a wiki and the table's old comment is quietly copied in as the first draft - after that the two never speak again, so editing one leaves the other exactly where it was.
    link: https://docs.databricks.com/aws/en/uc-semantics/wikis#:~:text=After%20that%2C%20the%20wiki%20and%20the%20comment%20are%20independent
  - note: The team wiki about your data is the one place Databricks asks you to keep data out of - no PII, no regulated data, and no customer-managed keys either.
    link: https://docs.databricks.com/aws/en/uc-semantics/wikis#:~:text=Do%20not%20include%20PII%2C%20regulated%20data%2C%20or%20other%20sensitive%20information
status:
