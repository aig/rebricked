  link: https://docs.databricks.com/aws/en/release-notes/product/2026/november#:~:text=Unity%20Catalog%20wikis%20are%20in%20Beta
limitations:
  note: Beta, enabled by account admins from the account console Previews page. Tables only - no wikis on columns, schemas, catalogs, or other securable objects - and one wiki per table. Not available in GovCloud regions, no customer-managed key encryption, and Databricks says not to put PII or regulated data in a wiki.
  link: https://docs.databricks.com/aws/en/uc-semantics/wikis#:~:text=Wikis%20are%20available%20only%20on%20tables
  date: '2026-11-09'
