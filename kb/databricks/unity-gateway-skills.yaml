limitations:
  note: Beta, and an account admin has to enable the Unity AI preview from the account console Previews page before anyone can create or use a skill. The schema must sit in a standard Unity Catalog catalog and resolve to a managed storage location or skill creation fails, and workspaces enforcing the Compliance Security Profile can read existing skills but cannot create, update, or delete them.
  link: https://docs.databricks.com/aws/en/ai-gateway/govern-skills#:~:text=creating%2C%20updating%2C%20and%20deleting%20skills%20is%20blocked
  date: '2026-11-09'
