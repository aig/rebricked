id: unity-gateway-skills
name: Unity Gateway Skills
aliases:
  - Skills
  - agent skills
  - Databricks skill registry
  - databricks-skill-registry
category: Data governance
what:
  note: A central place in Unity Gateway to discover, publish, and govern agent skills across an organization, each skill stored as a Unity Catalog securable so the same grants, tags, and audit that protect tables decide who can use it.
  link: https://docs.databricks.com/aws/en/agents/uc-skills/#:~:text=Unity%20Gateway%20Skills%20give%20you%20a%20central%20location%20to%20discover%2C%20publish%2C%20and%20govern%20agent%20skills%20across%20your%20organization
fact:
  - note: Your coding agent reaches the registry through an MCP server literally named databricks-skill-registry, which the Unity Gateway CLI registers for you when it signs you in.
    link: https://docs.databricks.com/aws/en/agents/uc-skills/create-share-uc-skills#:~:text=registers%20the%20Databricks%20Skills%20MCP%20server
  - note: Since November 2026 a GitHub Action publishes skills on merge - the folder name, not the name field in SKILL.md, decides the Unity Catalog identifier, and the docs' own examples reference the action at main so they pick up its latest updates, pinned to nothing.
    link: https://docs.databricks.com/aws/en/agents/uc-skills/create-share-uc-skills#:~:text=so%20they%20pick%20up%20its%20latest%20updates
  - note: For all the new branding underneath it is still a Unity Catalog object - the docs call a skill a first-class Unity Catalog securable.
    link: https://docs.databricks.com/aws/en/agents/uc-skills/#:~:text=a%20skill%20is%20a%20first%2Dclass%20Unity%20Catalog%20securable
