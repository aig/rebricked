limitations:
  note: Needs serverless or Databricks Runtime 17.0 ML and above plus databricks-feature-engineering 0.16.0 or later; entity columns cannot be DATE or TIMESTAMP, only a limited set of aggregation functions is supported, RequestSource takes scalar types only and no aggregations or time windows, and entity, timeseries, and request feature column names must be globally unique across all sources in a training set or serving endpoint.
  link: https://docs.databricks.com/aws/en/machine-learning/feature-store/feature-views#:~:text=Entity%20columns%20cannot%20be%20of%20type%20DATE%20or%20TIMESTAMP
  date: '2026-08-20'
