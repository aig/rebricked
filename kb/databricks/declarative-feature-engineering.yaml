id: declarative-feature-engineering
name: Declarative Feature Engineering
aliases:
  - Declarative Feature Engineering APIs
  - Feature Views
category: AI / ML
what:
  note: APIs to define features declaratively from Delta tables, Kafka streams, and request-time data, with time-windowed aggregations that Databricks computes, materializes, and serves for training and online inference.
  link: https://docs.databricks.com/aws/en/machine-learning/feature-store/feature-views#:~:text=Features%20can%20be%20defined%20using%20a%20variety%20of%20sources
fact:
  - note: You declare a time-windowed aggregation once and it computes the feature for you - materializing to Delta or Lakebase and wiring into online model serving - the feature-engineering echo of the declarative-pipelines idea.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/march#:~:text=Serve%20Unity%20Catalog%20models%20using%20online%20model%20serving
  - note: It launched in Beta in March 2026, initially only in the AWS us-east-1 and us-west-2 regions.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/march#:~:text=now%20available%20in%20Beta%20in%20the%20AWS
  - note: Graduating to Public Preview left the Beta-era definitions behind, so the client ships an is_beta_feature_view() check and a Feature.clone() to drag them across.
    link: https://docs.databricks.com/aws/en/release-notes/feature-store/databricks-feature-store#:~:text=need%20migration%20to%20the%20Public%20Preview%20representation
status:
  value: active
