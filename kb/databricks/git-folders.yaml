limitations:
  note: Working branches are capped at 1 GB, files over 10 MB can't be viewed in the UI, each Git operation supports up to 2 GB memory and 4 GB disk, and Databricks recommends under 20000 files; GPG commit signing and SSH aren't supported, and Git operations that alter notebook source lose cell outputs and state.
  link: https://docs.databricks.com/aws/en/repos/limits#:~:text=Working%20branches%20are%20limited%20to%201%20GB
  date: '2026-07-23'
