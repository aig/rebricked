id: git-folders
name: Git folders
aliases:
  - Databricks Repos
  - Repos
category: Developer experience
what:
  note: In-workspace Git client for version-controlling notebooks and files.
  link: https://learn.microsoft.com/en-us/azure/databricks/repos/what-happened-repos#:~:text=sync%20workspace%20folders%20with%20remote%20Git%20repositories%20for%20version%20control
fact:
  - note: It's a full Git client living inside the workspace - branch, commit, pull - and it was renamed 'Git folders' once it grew to version arbitrary files, not just notebooks.
    link: https://learn.microsoft.com/en-us/azure/databricks/repos/what-happened-repos#:~:text=Repos%20are%20now%20called%20Git%20folders
  - note: It can version arbitrary file types, not just notebooks, but it refuses to work without a remote repo URL.
    link: https://learn.microsoft.com/en-us/azure/databricks/repos/what-happened-repos#:~:text=Git%20folders%20require%20a%20remote%20repository%20URL
  - note: The switch to the 'Git folders' name landed in the March 21, 2024 platform release notes.
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2024/march#:~:text=Databricks%20Repos%20changed%20to%20Git%20folders
status:
  value: active
  link: https://learn.microsoft.com/en-us/azure/databricks/repos/what-happened-repos#:~:text=Databricks%20recommends%20creating%20new%20Git%20folders%20instead%20of%20Repos.
  date: '2026-07-18'
releases:
