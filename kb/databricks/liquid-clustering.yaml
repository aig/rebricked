  link: https://www.databricks.com/blog/announcing-delta-lake-30-new-universal-format-and-liquid-clustering#:~:text=Liquid%20Clustering%20%28coming%20soon%29
  note: Announced as coming soon in Delta Lake 3.0, June 2023
limitations:
  note: Clustering-on-write doesn't support source queries with filters, joins, or aggregations (DBR 15.1 and below); you can't create a liquid-clustered table via Structured Streaming write (DBR 15.4 LTS and below); automatic liquid clustering isn't available for managed Apache Iceberg v2 tables, and needs DBR 18.0 or above on the v3 tables where it is supported; and row-level concurrency isn't supported on managed Apache Iceberg v2 tables, which lack the deletion vectors and row tracking the v3 spec added.
  link: https://docs.databricks.com/aws/en/delta/clustering#:~:text=source%20queries%20that%20include%20filters%2C%20joins%2C%20or%20aggregations
