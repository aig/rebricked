id: liquid-clustering
name: Liquid Clustering
aliases:
  - CLUSTER BY
  - liquid
  - automatic liquid clustering
category: Data engineering
what:
  note: Delta Lake data-layout optimization that supersedes Z-ordering and Hive-style partitioning; clustering keys can evolve without rewriting existing data.
  link: https://docs.databricks.com/aws/en/delta/clustering#:~:text=redefine%20clustering%20keys%20without%20rewriting%20existing%20data
fact:
  - note: It replaces both partitioning and Z-ordering, and unlike either you can change the clustering keys later without rewriting a single existing file - old ZORDER columns can even be reused as-is.
    link: https://docs.databricks.com/aws/en/delta/clustering#:~:text=ZORDER%20BY%20columns%20as%20clustering%20keys
  - note: Databricks now recommends it for all new tables, over both partitioning and Z-ordering.
    link: https://docs.databricks.com/aws/en/delta/clustering#:~:text=Databricks%20recommends%20liquid%20clustering%20for%20all%20new%20tables
  - note: 'Since June 2025 it can even choose its own keys: automatic liquid clustering, GA on Unity Catalog managed tables, picks clustering keys to suit your queries.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Automatic%20liquid%20clustering%20intelligently%20selects%20clustering%20keys
