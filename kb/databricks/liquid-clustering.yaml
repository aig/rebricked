  link: https://www.databricks.com/blog/announcing-general-availability-liquid-clustering#:~:text=General%20Availability%20of%20Delta%20Lake%20Liquid%20Clustering
occasion:
  date: 2025-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Automatic%20liquid%20clustering%20is%20now%20GA
  note: GA on Databricks Runtime 15.4 LTS and above
limitations:
  note: Clustering-on-write doesn't support source queries with filters, joins, or aggregations (DBR 15.1 and below); you can't create a liquid-clustered table via Structured Streaming write (DBR 15.4 LTS and below); and automatic liquid clustering and row-level concurrency aren't available for managed Apache Iceberg v2 tables.
  link: https://docs.databricks.com/aws/en/delta/clustering#:~:text=source%20queries%20that%20include%20filters%2C%20joins%2C%20or%20aggregations
