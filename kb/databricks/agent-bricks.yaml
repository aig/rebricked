id: agent-bricks
name: Agent Bricks
aliases:
  - AgentBricks
category: AI / ML
what:
  note: 'Databricks'' automated, declarative way to build production AI agents: you describe the task in natural language and connect your data, and it auto-generates evaluations and auto-optimizes the agent.'
  link: https://www.databricks.com/blog/introducing-agent-bricks#:~:text=define%20in%20natural%20language%20a%20high%2Dlevel%20description
fact:
  - note: Instead of hand-tuning prompts, it automatically builds evaluation benchmarks specific to your task - sometimes synthetically generating new data or custom LLM judges - then searches across optimization techniques like prompt engineering and fine-tuning to auto-optimize the agent.
    link: https://www.databricks.com/blog/introducing-agent-bricks#:~:text=automatically%20create%20evaluation%20benchmarks%20specific%20to%20your%20task
  - note: There was never a single 'Agent Bricks GA' day - individual capabilities reach general availability on their own schedules (Document Intelligence, for instance, went GA at Data + AI Summit 2026), by which point Databricks says 100k+ agents had been built on it, together processing over a quadrillion tokens a year.
    link: https://www.databricks.com/blog/agent-bricks-dais-2026#:~:text=over%20100k%2B%20agents%20have%20been%20built
