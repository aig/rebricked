limitations:
  note: Beta only in selected AWS and Azure regions, and it needs partner-powered AI features on. Apps built in App Spaces have no general public internet egress - outbound access is limited to the workspace and Databricks-managed npm/PyPI proxies, custom package repositories are not supported, and workspace Secure Egress Gateway and serverless Private Link configurations do not apply.
  link: https://docs.databricks.com/aws/en/dev-tools/databricks-apps/genie-app-builder#:~:text=Apps%20built%20in%20App%20Spaces%20have%20no%20general%20public%20internet%20egress
  date: '2026-09-27'
