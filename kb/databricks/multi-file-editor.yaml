id: multi-file-editor
name: multi-file editor
category: Data engineering
what:
  note: The IDE for developing Lakeflow (Spark Declarative) pipelines - code-first, folder-based, with selective execution, data previews, and pipeline graphs on one surface.
  link: https://docs.databricks.com/aws/en/ldp/multi-file-editor#:~:text=combines%20all%20pipeline%20development%20tasks%20on%20a%20single%20surface
fact:
  - note: A folder-based IDE that breaks pipeline logic out of single notebooks into modular Python and SQL files, complete with tabs, a dependency graph, per-table run buttons, and a cross-file issues panel.
    link: https://docs.databricks.com/aws/en/ldp/multi-file-editor#:~:text=reference%20a%20table%20or%20view%20defined%20in%20another%20file
