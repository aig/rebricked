limitations:
  note: Account admin only, set up in the account console with no API, and every source in an account shares one geo (changing it means removing and reconnecting them all). Content is used by Genie One only, not Genie Code, and isn't available in AWS GovCloud regions. Nothing can be excluded from a source, Google Drive files over 100 MB are skipped and over 10 MB keep metadata only, PDFs are indexed without OCR, and only Jira Cloud and Confluence Cloud are supported, not on-premises.
  link: https://docs.databricks.com/aws/en/genie/genie-ontology/search-index#:~:text=Genie%20Search%20isn%27t%20available%20in%20AWS%20GovCloud%20regions
  date: '2026-11-10'
