id: databricks-clean-rooms
name: Databricks Clean Rooms
aliases:
  - Clean Rooms
  - clean room
category: Data governance
what:
  note: A secure, privacy-protecting environment where multiple parties collaborate on sensitive data - sharing tables, volumes, and views and running approved notebook code - without direct access to each other's data.
  link: https://docs.databricks.com/aws/en/clean-rooms/#:~:text=a%20secure%20and%20privacy%2Dprotecting%20environment%20where%20multiple%20parties
fact:
  - note: Two companies can run joint analysis on each other's data without either one seeing the other's raw rows - a 'no-trust' model where all parties get exactly equal privileges.
    link: https://docs.databricks.com/aws/en/clean-rooms/#:~:text=no%2Dtrust%20clean%20room%20have%20equal%20privileges
  - note: It reached GA on AWS and Azure in February 2025, with GCP following later that year.
    link: https://www.databricks.com/blog/databricks-clean-rooms-now-generally-available-aws-and-azure#:~:text=now%20generally%20available%20on%20AWS%20and%20Azure
