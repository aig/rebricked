limitations:
  note: Assets can't be backed by Cloudflare R2; volumes, notebooks, AI models, and Iceberg tables are unsupported across all sharing protocols; it isn't available on AWS GovCloud; and AWS PrivateLink to S3 isn't compatible with the FIPS endpoints Databricks uses by default in US regions. mTLS is supported only for Databricks recipients on serverless compute, and provider support on GCP is still Private Preview.
  link: https://docs.databricks.com/aws/en/opensharing/secureconnect-provider#:~:text=can%27t%20be%20backed%20by%20Cloudflare%20R2%20storage
  date: '2026-08-20'
