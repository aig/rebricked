limitations:
  note: Assets can't be backed by Cloudflare R2 storage; it can't be used with recipients that read shared data through SAP HANA, which does not support the pre-signed URLs SecureConnect delivers data with; it is not available on AWS GovCloud; AWS PrivateLink to S3 is not compatible with the FIPS endpoints Databricks uses by default in all US regions; and mTLS is supported only for Databricks recipients on serverless compute.
  link: https://docs.databricks.com/aws/en/opensharing/secureconnect-provider#:~:text=can%27t%20be%20backed%20by%20Cloudflare%20R2%20storage
