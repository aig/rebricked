limitations:
  note: Assets can't be backed by Cloudflare R2; not available on AWS GovCloud; and AWS PrivateLink to S3 isn't compatible with the FIPS endpoints Databricks uses by default in US regions. Recipient-side limits (such as mTLS support) also apply.
  link: https://docs.databricks.com/aws/en/opensharing/secureconnect-provider#:~:text=can%27t%20be%20backed%20by%20Cloudflare%20R2%20storage
  date: '2026-07-23'
