id: secureconnect
name: SecureConnect
aliases:
  - OpenSharing SecureConnect
category: Data governance
what:
  note: An OpenSharing option that lets a provider share data from cloud storage behind a firewall or private endpoint without allowlisting each recipient's network.
  link: https://docs.databricks.com/aws/en/opensharing/secureconnect-provider#:~:text=storage%20behind%20a%20firewall%20or%20private%20endpoint
fact:
  - note: It lets a provider share data from storage behind a firewall or private endpoint without adding each collaborator's network to an allowlist, and it works for clean rooms too - Databricks brokers the connection through a managed proxy.
    link: https://docs.databricks.com/aws/en/clean-rooms/manage-clean-room#:~:text=storage%20behind%20a%20firewall%20or%20private%20endpoint
  - note: It debuted as 'OpenSharing SecureConnect' in June 2026.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=use%20OpenSharing%20SecureConnect%20to%20share%20data
  - note: It is generally available and still Private Preview at the same time - which one you get depends on the cloud you share from, because provider support on GCP has not caught up.
    link: https://docs.databricks.com/aws/en/opensharing/secureconnect-provider#:~:text=Support%20for%20providers%20on%20GCP%20is%20in
