id: delta-sharing
name: Delta Sharing
category: Data governance
what:
  note: Open protocol and Databricks service for securely sharing live data across organizations and platforms, with or without Databricks.
  link: https://docs.databricks.com/aws/en/opensharing/#:~:text=an%20open%20protocol%20developed%20by%20Databricks%20for%20secure%20data%20sharing
fact:
  - note: Launched as an open protocol that enabled secure data sharing across products for the first time, it lets a recipient pull Delta Lake or Parquet data straight into pandas or Tableau without first adopting the provider's platform.
    link: https://www.databricks.com/blog/2021/05/26/introducing-delta-sharing-an-open-protocol-for-secure-data-sharing.html#:~:text=the%20shared%20data%20through%20pandas%2C%20Tableau
