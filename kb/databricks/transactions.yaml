limitations:
  note: Writes to Unity Catalog managed Iceberg tables are still Private Preview. Every table written to must be a Unity Catalog managed table with catalog commits enabled; non-interactive transactions need a SQL warehouse, serverless, or Databricks Runtime 18.0+, interactive transactions need a SQL warehouse, and transactions over OpenSharing shared assets need Databricks Runtime 18.1+.
  link: https://docs.databricks.com/aws/en/transactions/#:~:text=Transactions%20that%20write%20to%20Unity%20Catalog%20managed%20Iceberg%20tables%20are%20in
