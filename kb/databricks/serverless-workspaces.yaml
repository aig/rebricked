  note: GA January 29, 2026
limitations:
  note: A serverless workspace must be in a region that supports serverless compute, and because serverless compute and default storage aren't deployed in your own cloud account, cloud-provider credits or discounts don't apply to that usage.
  link: https://docs.databricks.com/aws/en/admin/workspace/serverless-workspaces#:~:text=deployed%20in%20a%20region%20that%20supports%20serverless%20compute
