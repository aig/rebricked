limitations:
  note: Beta, and an account admin must enable it from the account console Previews page; data might take up to a day to load afterwards. It adds no permissions of its own, each page is scoped to your admin role, and Data page visualizations only ever show what your existing Unity Catalog privileges already allow.
  link: https://docs.databricks.com/aws/en/admin/governance-hub/#:~:text=Data%20might%20take%20up%20to%20a%20day%20to%20load%20after%20you%20enable%20the%20preview
