  link: https://docs.databricks.com/aws/en/release-notes/product/2023/august#:~:text=Feature%20Engineering%20in%20Unity%20Catalog%20is%20Public%20Preview
limitations:
  note: A FeatureSpec can contain at most 1000 features, at most 50 tables can train a model, and at most 100 on-demand features can be used in a model; Databricks Runtime ML clusters can't be used with Lakeflow pipelines (standard access mode clusters are required).
  link: https://docs.databricks.com/aws/en/machine-learning/feature-store/troubleshooting-and-limitations#:~:text=A%20FeatureSpec%20can%20contain%20a%20maximum%20of%201000%20features
  date: '2026-07-23'
