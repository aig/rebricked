id: feature-engineering-in-unity-catalog
name: Feature Engineering in Unity Catalog
aliases:
  - Feature Engineering
  - databricks-feature-engineering
category: AI / ML
what:
  note: Feature management built on Unity Catalog - any Delta table with a primary key can serve as a feature table, with UC lineage and governance.
  link: https://docs.databricks.com/aws/en/machine-learning/feature-store/#:~:text=built%2Din%20governance%2C%20lineage%2C%20point%2Din%2Dtime%20joins
fact:
  - note: A feature table is nothing more than a Delta table with a primary key constraint in Unity Catalog - updated, browsed, and governed through Unity Catalog like any other table.
    link: https://docs.databricks.com/aws/en/machine-learning/feature-store/uc/feature-tables-uc#:~:text=any%20Delta%20table%20with%20a%20primary%20key%20constraint
  - note: Its Python package is databricks-feature-engineering, renamed from the older databricks-feature-store.
    link: https://docs.databricks.com/aws/en/machine-learning/feature-store/python-api#:~:text=have%20been%20moved%20to%20databricks%2Dfeature%2Dengineering
status:
  value: active
