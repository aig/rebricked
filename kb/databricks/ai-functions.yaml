id: ai-functions
name: AI Functions
aliases:
  - ai_query
  - ai_extract
  - ai_search
  - ai_transcribe
  - ai_classify
  - ai_parse_document
  - ai_generate_text
  - AI Functions REST API
category: AI / ML
what:
  note: Built-in Databricks SQL functions that apply LLMs or state-of-the-art research techniques to data stored on Databricks for transformation and analysis, callable from Databricks SQL, notebooks, Lakeflow pipelines, and Workflows - the general-purpose ai_query plus a growing family of task-specific functions like ai_extract, ai_classify, ai_parse_document, ai_search, and ai_transcribe.
  link: https://docs.databricks.com/aws/en/large-language-models/ai-functions#:~:text=AI%20Functions%20are%20built-in%20functions%20that%20you%20can%20use%20to%20apply%20LLMs%20or%20state-of-the-art%20research%20techniques
fact:
  - note: The function the 2023 preview shipped with, ai_generate_text, is now marked deprecated in favour of ai_query - yet its doc page still wears a Public Preview badge, so it managed to be deprecated without ever leaving preview.
    link: https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_generate_text#:~:text=The%20AI%20function%2C%20ai_generate_text%28%29%20is%20deprecated
  - note: 'Maturity is a spectrum, not a badge: ai_query reached GA in June 2026 after three years in preview, while sibling ai_analyze_sentiment still tells you it is in Public Preview and HIPAA compliant in the same breath.'
    link: https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_analyze_sentiment#:~:text=This%20functionality%20is%20in%20Public%20Preview%20and%20HIPAA%20compliant
  - note: 'The newest members are SQL functions with no SQL in sight: the AI Functions REST API went GA in August 2026 so applications can call ai_parse_document, ai_extract, and ai_classify without a warehouse, and ai_transcribe (Beta) will eat an hour of audio per call but politely refuses video.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=You%20can%20now%20call%20ai_parse_document%2C%20ai_extract%2C%20and%20ai_classify%20through%20the%20AI%20Functions%20REST%20API
status:
