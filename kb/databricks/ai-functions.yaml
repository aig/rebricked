  link: https://www.databricks.com/blog/2023/04/18/introducing-ai-functions-integrating-large-language-models-databricks-sql.html#:~:text=announce%20the%20public%20preview%20of%20AI%20Functions
limitations:
  note: Not available on Classic SQL warehouses; Databricks Runtime 15.4 LTS or above is required (18.2 or above recommended). Beta members carry their own hard caps - ai_transcribe accepts at most 1 hour of audio and a 512 MB file per call and does not transcribe video; ai_search takes up to 10 knowledge sources per call and a 4,000-character instructions argument.
  link: https://docs.databricks.com/aws/en/large-language-models/ai-functions#:~:text=AI%20Functions%20are%20not%20available%20on%20Classic%20SQL%20warehouses
  date: '2026-09-20'
