id: external-models
name: External models
aliases:
  - External models through Model Serving
  - External model endpoints
category: AI / ML
what:
  note: Third-party models hosted outside Databricks, such as OpenAI and Anthropic, served through a Model Serving endpoint so an organization can manage many LLM providers behind one unified interface.
  link: https://docs.databricks.com/aws/en/machine-learning/foundation-models/external-models/#:~:text=External%20models%20are%20third-party%20models%20hosted%20outside%20of%20Databricks
fact:
  - note: Its security pitch is a single place to keep secrets - API keys live in one secure location, so nobody has to paste them into code or look after them on their own.
    link: https://docs.databricks.com/aws/en/machine-learning/foundation-models/external-models/#:~:text=By%20storing%20API%20keys%20in%20one%20secure%20location
  - note: If your provider is not on the list, a custom provider option takes any model behind a proxy, as long as it speaks the OpenAI API.
    link: https://docs.databricks.com/aws/en/machine-learning/foundation-models/external-models/#:~:text=models%20behind%20custom%20proxies%20that%20are%20OpenAI%20API%20compatible
  - note: The docs sidebar now files it under Legacy endpoints, while the page itself points newcomers to registering providers as governed Unity Catalog objects instead.
    link: https://docs.databricks.com/aws/en/machine-learning/foundation-models/external-models/#:~:text=To%20register%20external%20model%20providers%20as%20governed%20Unity%20Catalog%20objects
status:
