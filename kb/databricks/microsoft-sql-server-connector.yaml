id: microsoft-sql-server-connector
name: Microsoft SQL Server connector
aliases:
  - SQL Server connector
  - Microsoft SQL Server ingestion connector
  - Lakeflow Connect SQL Server
category: Data engineering
what:
  note: 'A managed Lakeflow Connect database connector that incrementally ingests SQL Server tables (Azure SQL, Amazon RDS, VMs, on-premises) into Databricks using Microsoft change tracking or change data capture.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-overview#:~:text=Microsoft%20SQL%20Server%20ingestion%20connector
fact:
  - note: It was in the very first batch of Lakeflow Connect sources in July 2024, next to Salesforce and Workday.
    link: https://docs.databricks.com/aws/en/release-notes/product/2024/july#:~:text=Salesforce%2C%20Microsoft%20Azure%20SQL%20Database%2C%20Amazon%20RDS%20for%20SQL%20Server
  - note: It comes in two shapes - the standard gateway-based setup with two pipelines, or integrated CDC that folds extraction into one pipeline.
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-overview#:~:text=SQL%20Server%20supports%20two%20ingestion%20architectures
  - note: Using Microsoft CDC needs SQL Server 2012 SP1 CU3 or later, because that patch added the command id column the gateway uses to tell an UPDATE from a DELETE-INSERT pair.
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-limits#:~:text=SQL%20Server%202012%20service%20pack%201%20%28SP1%29%20cumulative%20update%20package%203
status:
  value: active
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-overview#:~:text=Microsoft%20SQL%20Server%20ingestion%20connector
  date: '2026-10-20'
releases:
