limitations:
  note: Primary instances only (change tracking and CDC do not work on read replicas), the gateway must run continuously on classic compute and must not be stopped manually, 250 or fewer tables per pipeline is recommended, source names are case-sensitive, and column renames or type changes need a full refresh.
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-limits#:~:text=Support%20is%20limited%20to%20primary%20SQL%20Server%20instances
  date: '2026-10-20'
