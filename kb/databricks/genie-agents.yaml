category: AI / BI
what:
  note: Governed, curated conversational agents that give business users a natural-language chat interface to ask questions of their data in Databricks.
  link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=natural%2Dlanguage%20chat%20interface%20where%20business%20users%20ask%20questions%20of%20their%20data%20in%20Databricks
fact:
  - note: 'There''s real compute behind the chat box: every Genie Agent runs on a pro or serverless SQL warehouse and can only reach data you''ve registered in Unity Catalog.'
    link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=Genie%20Agents%20require%20a%20pro%20or%20serverless%20SQL%20warehouse
  - note: Databricks shipped a Genie app for Microsoft Teams, so the people who never open a workspace can still ask data questions and get answers without leaving the chat window.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=so%20users%20can%20ask%20data%20questions%20and%20get%20answers%20without%20leaving%20Microsoft%20Teams
