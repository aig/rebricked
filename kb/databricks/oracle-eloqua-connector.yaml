  link: https://docs.databricks.com/aws/en/release-notes/product/2026/october#:~:text=Oracle%20Eloqua%20connector%20is%20available%20in%20Beta
limitations:
  note: 'Beta, enabled by a workspace admin from the Previews page. OAuth U2M only, tables with VARIANT columns do not support SCD type 2, and a column rename requires a full refresh.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/oracle-eloqua#:~:text=To%20use%20it%2C%20a%20workspace%20admin%20must%20turn%20on%20Lakeflow%20Connect%20for%20Oracle%20Eloqua
  date: '2026-10-20'
links:
