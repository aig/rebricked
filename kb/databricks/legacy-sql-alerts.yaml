id: legacy-sql-alerts
name: Legacy SQL alerts
aliases:
  - legacy alerts
  - SQL alerts v1
category: BI / Dashboards
what:
  note: The original Databricks SQL alerts that notified when a scheduled query crossed a threshold.
  link: https://docs.databricks.com/aws/en/sql/user/alerts/legacy#:~:text=Legacy%20alerts%20are%20the%20first%20version%20of%20Databricks%20SQL%20alerts
fact:
  - note: These original SQL alerts fired when a scheduled query crossed a threshold - and each alert leaned on a separately saved query to do it.
    link: https://docs.databricks.com/aws/en/sql/user/alerts/legacy#:~:text=executes%20its%20underlying%20query%20and%20checks%20the%20alert%20criteria
  - note: Even its CLI command group is now marked deprecated.
    link: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/reference/alerts-legacy-commands#:~:text=These%20commands%20are%20deprecated
status:
  value: deprecated
