  - Mosaic AI Model Serving
  - Model Serving
category: AI / ML
what:
  note: Highly available, low-latency service for deploying ML and GenAI models behind autoscaling REST endpoints.
  link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2023/march#:~:text=a%20highly%20available%20and%20low%2Dlatency%20service%20for%20deploying%20models
fact:
  - note: It shed the tongue-twister name 'Serverless Real-Time Inference' when it reached general availability in March 2023.
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2023/march#:~:text=Model%20Serving%2C%20formerly%20Serverless%20Real%2DTime%20Inference%2C%20is%20now%20generally%20available
  - note: Some surfaces later slapped a 'Mosaic AI' prefix on it.
    link: https://community.databricks.com/t5/announcements/databricks-genai-amp-ml-announcements-november-2024/td-p/101272#:~:text=Mosaic%20AI%20Model%20Serving%20is%20available
  - note: 'Custom endpoints can accept protobuf instead of JSON, but only if they were created after the option shipped: it is only available on endpoints deployed after July 9, 2026.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=is%20only%20available%20on%20endpoints%20deployed%20after%20July%209%2C%202026
