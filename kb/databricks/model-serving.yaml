limitations:
  note: Documented limits include up to 1000 endpoints per workspace (raisable on request), a 16 MB request payload (4 MB for AI agent endpoints), a 597-second model execution duration per request, 50 create/update operations per 5-minute window, provisioned concurrency of up to 1024 per model and 4096 per workspace (raisable on request), a queries-per-second cap of 300,000 with route optimization (200 without, recommended only for small dev use), and no logging for requests or responses over 1 MB.
  link: https://docs.databricks.com/aws/en/machine-learning/model-serving/model-serving-limits#:~:text=Any%20request%2Fresponse%20over%201%20MB%20will%20not%20be%20logged
