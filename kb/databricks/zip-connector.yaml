id: zip-connector
name: Zip connector
aliases:
  - Zip
  - Zip procurement
  - Lakeflow Connect for Zip
category: Data engineering
what:
  note: 'A managed Lakeflow Connect connector that ingests procurement data from Zip - requests, approvals, purchase orders, invoices, vendors and audit-trail event logs - into Databricks.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip#:~:text=ingests%20procurement%20data%20such%20as%20requests%2C%20approvals%2C%20purchase%20orders%2C%20invoices%2C%20vendors
fact:
  - note: 'Not the file format: this Zip is the procurement platform, and the connector brings its approvals and purchase orders into Databricks.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip#:~:text=The%20managed%20Zip%20connector%20in%20Lakeflow%20Connect%20ingests%20procurement%20data
  - note: 'Five tables are incremental - event_logs, invoices, requests, purchase_orders and vendors - and every other table is refreshed in full on each pipeline update.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip#:~:text=refreshes%20all%20other%20tables%20on%20each%20pipeline%20update
  - note: 'Authentication is old school: a Zip API key, the only supported method.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip#:~:text=Basic%20authentication%20%28API%20key%29%20Supported%20Zip%20API%20key
status:
  value: active
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip#:~:text=This%20feature%20is%20in%20Beta
  date: '2026-10-20'
releases:
  - type: beta
    date: 2026-06
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Lakeflow%20Connect%20now%20supports%20a%20managed%20connector%20for%20ingestion%20from%20Zip
introducedAt:
  date: 2026-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Lakeflow%20Connect%20now%20supports%20a%20managed%20connector%20for%20ingestion%20from%20Zip
limitations:
  note: 'Beta, enabled by a workspace admin from the Previews page. Only five tables ingest incrementally; the rest refresh in full on every update. No API-based row filtering, no SCD Type 2, no schema evolution for data type changes, and column renames require a full refresh. A Zip API key is the only supported authentication.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip#:~:text=a%20workspace%20admin%20must%20turn%20on%20Lakeflow%20Connect%20for%20Zip
  date: '2026-10-20'
links:
  - url: https://docs.databricks.com/aws/en/release-notes/product/2026/june
    kind: official
    label: 'Databricks release notes: Zip connector (Beta), June 10, 2026'
source: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zip
