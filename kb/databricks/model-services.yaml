limitations:
  note: Provisioned throughput models are not supported as destinations, model services cannot be created or managed with SQL, they cannot be discovered with only the BROWSE privilege, and global search does not cover them.
  link: https://docs.databricks.com/aws/en/ai-gateway/model-services#:~:text=Provisioned%20throughput%20models%20as%20destinations
  date: '2026-08-20'
