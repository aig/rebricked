limitations:
  note: 'Beta, turned on from the Previews page. OAuth M2M (Microsoft Entra ID app) only; no SCD Type 2, no API-based row filtering, no schema evolution for data type changes, and a column rename lands as a new column plus a deleted one.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/microsoft-graph-logs
  date: '2026-10-30'
