id: genie-one-desktop-app
name: Genie One desktop app
aliases:
  - Genie One for macOS
  - Genie One for Windows
  - Genie desktop app
  - Genie One on desktop
category: AI / BI
what:
  note: A native app for macOS and Windows that opens Genie One in its own window instead of a browser tab, with the same capabilities as the web experience plus window navigation controls, automatic updates and, on macOS, a dock badge for unread activity.
  link: https://docs.databricks.com/aws/en/genie-one/desktop#:~:text=native%20app%20for%20macOS%20and%20Windows
fact:
  - note: There is no admin switch for it - Databricks provides no control to enable, disable, or restrict the app, so an organization that wants a say takes it up with its mobile device management.
    link: https://docs.databricks.com/aws/en/genie-one/desktop#:~:text=does%20not%20provide%20an%20admin%20control%20to%20enable%2C%20disable%2C%20or%20restrict%20the%20desktop%20app
  - note: It keeps only Genie One for itself - links to the rest of the workspace, such as settings, SQL, jobs, or compute, are shown the door and open in your default browser.
    link: https://docs.databricks.com/aws/en/genie-one/desktop#:~:text=open%20in%20your%20default%20browser
  - note: Signing out is partly ceremonial - it clears your session in the app, but the workspace session stays valid until it expires.
    link: https://docs.databricks.com/aws/en/genie-one/desktop#:~:text=your%20workspace%20session%20remains%20valid%20until%20it%20expires
