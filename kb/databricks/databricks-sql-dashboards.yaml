id: databricks-sql-dashboards
name: Databricks SQL dashboards
aliases:
  - DBSQL dashboards
  - Redash dashboards
category: BI / Dashboards
what:
  note: Databricks SQL's original built-in dashboards for pinning query visualizations onto a shared, drag-and-drop canvas.
  link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2020/november#:~:text=rich%20visualizations%20and%20drag%2Dand%2Ddrop%20dashboards
fact:
  - note: Databricks' dashboards trace back to Redash, the popular open-source visualization and dashboarding tool it acquired in June 2020.
    link: https://www.databricks.com/blog/2020/06/24/welcoming-redash-to-databricks.html#:~:text=Databricks%20has%20acquired%20Redash
  - note: They shipped as part of SQL Analytics, which Databricks unveiled in November 2020, letting analysts build shareable dashboards straight from their query visualizations.
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-sql-analytics-to-enable-cloud-data-warehousing-on-data-lakes#:~:text=build%20dashboards%20and%20reports%20that%20can%20be%20easily%20shared
