  note: Private Databricks Workspaces With AWS PrivateLink launch blog (Public Preview)
limitations:
  note: Requires the Enterprise tier on AWS (Premium on Azure). Classic compute plane (back-end) Private Link, and inbound Private Link on a workspace with a classic compute plane, need a customer-managed VPC (VNet injection on Azure) and secure cluster connectivity; outbound (serverless) and serverless-only workspaces do not. On AWS, VPC endpoint registrations and network configurations cannot be updated after creation, and an account holds at most 110 VPC endpoint registrations and 55 private access settings objects (fixed limits).
  link: https://docs.databricks.com/aws/en/security/network/classic/privatelink#:~:text=Your%20Databricks%20workspace%20must%20use%20a%20customer%2Dmanaged%20VPC%20for%20classic%20compute%20plane%20%28back%2Dend%29%20Private%20Link
  date: '2026-09-27'
