category: Compute / BI
what:
  note: 'Private connectivity to and from Databricks over the cloud provider''s private endpoint service (AWS PrivateLink or Azure Private Link), in three independently enabled flavours: inbound (front-end) from users to workspaces and account-level resources, classic compute plane (back-end) from clusters to the control plane, and outbound (serverless) from serverless compute to your own resources.'
  link: https://docs.databricks.com/aws/en/security/network/concepts/privatelink-concepts#:~:text=You%20can%20enable%20inbound%20%28front%2Dend%29%2C%20outbound%20%28serverless%29%2C%20or%20classic%20compute%20%28back%2Dend%29%20Private%20Link%20connections%20independently
fact:
  - note: For its first year and a half on AWS, turning it on started with asking - only in August 2022 did Databricks announce you no longer need to contact them to enable PrivateLink on your account.
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/august#:~:text=You%20no%20longer%20need%20to%20contact%20Databricks%20to%20enable%20PrivateLink%20on%20your%20account
  - note: The original default was maximally trusting - the private access level started out as ANY, which filtered nothing about which VPC endpoints could reach your workspace, until Databricks deprecated it in 2022.
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/august#:~:text=Historically%2C%20the%20private%20access%20level%20default%20was
  - note: Since October 2022 IP access lists no longer block PrivateLink traffic - they only police requests arriving over the public internet, so a private IP you had blocked could suddenly be let in.
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/october#:~:text=IP%20access%20lists%20no%20longer%20block%20PrivateLink%20traffic
