id: lakebase-autoscaling
name: Lakebase Autoscaling
aliases:
  - Lakebase (Autoscaling Beta)
  - Lakebase (Beta)
  - Lakebase projects
  - postgres_projects
category: Data engineering
what:
  note: The second version of Lakebase, organising Postgres into projects and branches on elastic compute with autoscaling, scale-to-zero, branching, and instant restore, shipped alongside the original provisioned product as a separate app.
  link: https://docs.databricks.com/aws/en/release-notes/lakebase/#:~:text=This%20new%20version%20introduces%20autoscaling%2C%20scale%2Dto%2Dzero%2C%20database%20branching%2C%20instant%20restore%2C%20and%20project%2Dbased%20organization%20with%20a%20redesigned%20UI
fact:
  - note: 'Compute comes in CUs of 2 GB each, and the spread itself is capped: the maximum minus the minimum cannot exceed 16 CU, so you can autoscale wide but not infinitely wide.'
    link: https://docs.databricks.com/aws/en/oltp/projects/autoscaling#:~:text=The%20difference%20between%20your%20maximum%20and%20minimum%20cannot%20exceed%2016%20CU
  - note: Its own release notes no longer contain its name - the October 30, 2025 entry that launched it now reads 'Lakebase (Beta)', arriving as a new app 'separate from the existing Lakebase Public Preview'.
    link: https://docs.databricks.com/aws/en/release-notes/lakebase/#:~:text=separate%20from%20the%20existing%20Lakebase%20Public%20Preview
  - note: New projects arrive with native Postgres password authentication switched off, so the classic password-in-the-connection-string has to be deliberately opted back into.
    link: https://docs.databricks.com/aws/en/release-notes/lakebase/#:~:text=New%20Lakebase%20projects%20now%20have%20native%20Postgres%20password%20authentication%20disabled%20by%20default
