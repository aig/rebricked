id: lakebase-autoscaling
name: Lakebase Autoscaling
aliases:
  - Lakebase (Autoscaling Beta)
  - Lakebase projects
  - postgres_projects
category: Data engineering
what:
  note: The latest version of Lakebase, organising Postgres into projects and branches on elastic compute with autoscaling, scale-to-zero, branching, and instant restore.
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/march#:~:text=Lakebase%20Autoscaling%20is%20the%20latest%20version%20of%20Lakebase%2C%20with%20autoscaling%20compute%2C%20scale-to-zero%2C%20branching%2C%20and%20instant%20restore
fact:
  - note: 'Compute comes in CUs of 2 GB each, and the spread itself is capped: the maximum minus the minimum cannot exceed 16 CU, so you can autoscale wide but not infinitely wide.'
    link: https://docs.databricks.com/aws/en/oltp/projects/autoscaling#:~:text=The%20difference%20between%20your%20maximum%20and%20minimum%20cannot%20exceed%2016%20CU
  - note: Scaling decisions rest on three signals, one of which is openly an estimate - CPU load, memory usage, and a guess at how much of your data you actually keep touching.
    link: https://docs.databricks.com/aws/en/oltp/projects/autoscaling#:~:text=Working%20set%20size%3A%20Estimates%20your%20frequently%20accessed%20data
  - note: New projects arrive with native Postgres password authentication switched off, so the classic password-in-the-connection-string has to be deliberately opted back into.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/may#:~:text=New%20Lakebase%20Autoscaling%20projects%20now%20have%20native%20Postgres%20password%20authentication%20disabled%20by%20default
status:
