limitations:
  note: 'Autoscaling compute has bounds: computes autoscale only up to 64 CU (128 GB), the gap between the configured minimum and maximum cannot exceed 16 CU, and changing that minimum or maximum can briefly interrupt active connections.'
  link: https://docs.databricks.com/aws/en/oltp/projects/autoscaling#:~:text=Autoscaling%20is%20available%20for%20computes%20up%20to%2064%20CU%20%28128%20GB%29
  date: '2026-08-20'
