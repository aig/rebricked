id: zerobus-ingest
name: Zerobus Ingest
aliases:
  - Zerobus
  - Zerobus Ingest connector
category: Data engineering
what:
  note: Push-based, serverless streaming API in Lakeflow Connect that writes records straight into Unity Catalog Delta tables over gRPC, REST, or OpenTelemetry, with no message bus to run.
  link: https://docs.databricks.com/aws/en/ingestion/zerobus-overview#:~:text=push%2Dbased%20streaming%20API%20that%20writes%20data%20straight%20into%20Unity%20Catalog%20Delta%20tables
fact:
  - note: 'The name is the whole pitch: there is no bus. The docs sell it as creating a table and pushing data to it, with no brokers, partitions, or pipelines to manage.'
    link: https://docs.databricks.com/aws/en/ingestion/zerobus-overview#:~:text=there%20are%20no%20brokers%2C%20partitions%2C%20or%20pipelines%20to%20manage
  - note: Ordering is guaranteed per stream and not globally across streams, so the obvious trick of spraying messages over several streams to go faster is also the way to lose your ordering.
    link: https://docs.databricks.com/aws/en/ingestion/zerobus-concepts#:~:text=If%20you%20spread%20records%20across%20multiple%20streams%20%28for%20example%2C%20round%2Drobin%29%2C%20there%20is%20no%20ordering%20guarantee%20across%20those%20streams
  - note: If it cannot flush buffered records into your table it holds them in durable storage for 28 days, then deletes them and emits a discard event logging exactly how many records and bytes it just dropped.
    link: https://docs.databricks.com/aws/en/ingestion/zerobus-limits#:~:text=the%20service%20deletes%20the%20buffered%20data%20and%20emits%20a%20per%2Dstream%20discard%20event
