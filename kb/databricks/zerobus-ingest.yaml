limitations:
  note: Available only in select regions, with the workspace and target table both in a supported region. Delivery is at-least-once, it writes only to managed Delta tables and streaming tables, it does not auto-evolve your target table (evolve the table first, then send records against the new schema), it does not support recreating a target table, and partitioned tables allow at most 100 partitions in any 5-second interval. Records cap at 10,485,760 bytes. The default quotas (100 MB/s and 100,000 records/s per stream, 10 GB/s per target table, 10,000 REST requests/s) are adjustable through your Databricks account representative.
  link: https://docs.databricks.com/aws/en/ingestion/zerobus-limits#:~:text=does%20not%20support%20recreating%20a%20target%20table
  date: '2026-09-01'
