limitations:
  note: Region-limited, and the workspace and target table must sit in the same region. Delivery is at-least-once, it writes only to managed Delta tables, it never auto-evolves your schema, and it does not support catalog commits or recreating a target table. Records cap at 10 MB and protobuf schemas at 2000 columns; partitioned tables allow at most 100 partitions per 5-second window. The throughput defaults (100 MB/s per stream, 10 GB/s per table, 10000 REST requests/s) are raisable through your Databricks account representative.
  link: https://docs.databricks.com/aws/en/ingestion/zerobus-limits#:~:text=Zerobus%20Ingest%20does%20not%20support%20catalog%20commits
  date: '2026-08-03'
