id: ssh-tunnel
name: SSH tunnel
aliases:
  - Databricks Remote Development
  - Remote Development
  - databricks ssh connect
category: Developer experience
what:
  note: A Databricks-provided SSH tunnel that attaches VS Code, Cursor, or a plain terminal to serverless, AI Runtime, or dedicated compute, so the whole development environment runs on Databricks instead of your laptop.
  link: https://docs.databricks.com/aws/en/dev-tools/ssh-tunnel#:~:text=Connect%20directly%20to%20serverless%20compute%2C%20or%20set%20up%20a%20reusable%20SSH%20connection%20to%20a%20dedicated%20classic%20cluster
fact:
  - note: The SSH tunnel does not use port 22 - it smuggles every byte over the same HTTPS endpoint the rest of the Databricks CLI already talks to, so the thing that has to survive your corporate firewall is a WebSocket upgrade, not an open SSH port.
    link: https://docs.databricks.com/aws/en/dev-tools/ssh-tunnel#:~:text=The%20SSH%20tunnel%20does%20not%20use%20port%2022
  - note: IntelliJ users are told to pass --auto-start-cluster=false, because JetBrains IDEs helpfully start every configured cluster the moment you launch the IDE.
    link: https://docs.databricks.com/aws/en/dev-tools/ssh-tunnel#:~:text=JetBrains%20IDEs%20start%20all%20configured%20clusters%20on%20launch
  - note: Since November 2026 Claude Code and Codex run inside the tunnel too, routing model calls through Unity Gateway and signing in with nothing more than the credentials of your SSH session - so the coding agent now lives on the cluster, not on your laptop.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/november#:~:text=Claude%20Code%20and%20Codex%20are%20now%20available%20in%20SSH%20tunnel%20sessions
