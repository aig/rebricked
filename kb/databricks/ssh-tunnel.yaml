limitations:
  note: Shared clusters aren't supported and the tunnel can't be launched from another remote environment or a Docker container; files edited outside /Workspace, /Volumes, and /dbfs are lost on cluster restart; at most 10 SSH connections per cluster; inactive sessions might drop after 1 hour; and three or more open Jupyter notebooks can cause performance or connection issues. Coding agents need Databricks CLI 1.23.0 or above, and on serverless compute their home directory (settings and history included) is lost when the compute shuts down.
  link: https://docs.databricks.com/aws/en/dev-tools/ssh-tunnel#:~:text=A%20maximum%20of%2010%20SSH%20connections%20are%20allowed%20per%20cluster
  date: '2026-11-09'
