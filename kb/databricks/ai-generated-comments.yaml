  link: https://docs.databricks.com/aws/en/release-notes/product/2023/october#:~:text=AI-generated%20table%20comments%20%28Public%20Preview%29
limitations:
  note: Comments are generated per object on request in Catalog Explorer, with no workspace-level or catalog-level toggle; suggestions must be reviewed before saving and are not suitable for data classification such as PII detection.
  link: https://docs.databricks.com/aws/en/comments/ai-comments#:~:text=There%20is%20no%20workspace-level%20or%20catalog-level%20toggle
  date: '2026-09-27'
