id: ai-generated-comments
name: AI-generated comments
aliases:
  - AI-generated documentation
  - AI-generated table comments
  - AI comments
category: Data governance
what:
  note: LLM-suggested descriptions for Unity Catalog objects and table columns - catalogs, schemas, tables, views, functions, models, volumes - generated from object metadata in Catalog Explorer, reviewed and edited by a person before saving.
  link: https://docs.databricks.com/aws/en/comments/ai-comments#:~:text=Comments%20are%20powered%20by%20a%20large%20language%20model%20%28LLM%29%20that%20takes%20into%20account%20object%20metadata
fact:
  - note: The docs openly admit its other name - the page introduces AI-generated comments "also known as AI-generated documentation", which is what the October 2023 launch blog called it.
    link: https://docs.databricks.com/aws/en/comments/ai-comments#:~:text=also%20known%20as%20AI-generated%20documentation
  - note: Clicking save on a friendly suggested sentence runs an ALTER SQL command under the hood, which the docs warn can disrupt pipelines and jobs.
    link: https://docs.databricks.com/aws/en/comments/ai-comments#:~:text=Saving%20comments%20triggers%20an%20ALTER%20SQL%20command
  - note: It will happily describe your columns but should not be trusted to spot PII - the docs say not to rely on it for data classification tasks.
    link: https://docs.databricks.com/aws/en/comments/ai-comments#:~:text=should%20not%20be%20relied%20on%20for%20data%20classification%20tasks%20such%20as%20detecting%20columns%20with%20PII
