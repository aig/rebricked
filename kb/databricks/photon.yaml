id: photon
name: Photon
aliases:
  - Photon engine
  - Photon acceleration
category: Compute / BI
what:
  note: The Databricks-native vectorized query engine that accelerates SQL workloads, DataFrame API calls, ETL pipelines and stateless streaming, written to be drop-in compatible with existing Apache Spark code.
  link: https://docs.databricks.com/aws/en/compute/photon#:~:text=the%20Databricks%2Dnative%20vectorized%20query%20engine
fact:
  - note: The engine under your Spark code is not Spark - Photon is written in C++ and processes data in columnar batches rather than row by row, while still answering to the same Spark APIs.
    link: https://docs.databricks.com/aws/en/compute/photon#:~:text=processes%20data%20in%20columnar%20batches
  - note: You can spot it working by colour in the query plan, where Photon operators and stages render peach against the blue of everything still running on Spark.
    link: https://learn.microsoft.com/en-us/azure/databricks/archive/compute/configure#:~:text=Photon%20operators%20and%20stages%20are%20colored%20peach
  - note: When it meets something it cannot do it does not fail, it silently hands the work back to Spark - which is why an unsupported UDF just makes your query mysteriously ordinary again.
    link: https://docs.databricks.com/aws/en/compute/photon#:~:text=falls%20back
status:
  value: active
  link: https://docs.databricks.com/aws/en/compute/photon#:~:text=the%20Databricks%2Dnative%20vectorized%20query%20engine
  date: '2026-08-12'
releases:
