    date: 2021-06
    link: https://docs.databricks.com/aws/en/release-notes/product/2021/june#:~:text=the%20new%20native%20vectorized%20engine%20on%20Databricks
  - type: ga
    date: 2022-07
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/july#:~:text=Photon%20is%20now%20generally%20available%2C%20beginning%20with%20Databricks%20Runtime%2011.1
introducedAt:
  date: 2021-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2021/june#:~:text=the%20new%20native%20vectorized%20engine%20on%20Databricks
limitations:
  note: No support for UDFs, RDD APIs or Dataset APIs, and only stateless streaming - stateful streaming is unsupported. Queries that already finish in under two seconds see little benefit.
  link: https://docs.databricks.com/aws/en/compute/photon#:~:text=Photon%20supports%20stateless%20streaming%20only
  date: '2026-08-12'
