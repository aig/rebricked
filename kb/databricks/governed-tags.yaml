id: governed-tags
name: Governed tags
aliases:
  - Governed tag
  - Tag governance
category: Data governance
what:
  note: Account-level tags with built-in rules for consistency and control - admins define the allowed keys and values and control which users and groups can assign them to Unity Catalog objects.
  link: https://docs.databricks.com/aws/en/admin/governed-tags/#:~:text=Governed%20tags%20are%20account%2Dlevel%20tags%20with%20built%2Din%20rules
fact:
  - note: 'Each governed tag has a policy attached to it, which is a neat inversion of how it started: the policy used to be the product and the tag was the detail.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/august#:~:text=admins%20define%20the%20allowed%20keys%20and%20values
  - note: They took roughly ten months to go from Public Preview to generally available, arriving in April 2026 after being announced in August 2025.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/april#:~:text=Governed%20tags%20are%20generally%20available
  - note: As of August 2026 they can also assign themselves - a tag automation applies or removes governed tags on whatever matches your conditions, and you can describe the rule to Genie in plain language.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=by%20describing%20your%20rule%20to%20Genie%20in%20natural%20language
status:
