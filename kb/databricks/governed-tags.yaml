limitations:
  note: Hard caps of 1,000 governed tags per account and 500 allowed values per tag, with keys and values limited to 256 characters; control characters and the characters * . / < > % & ? \ = are disallowed.
  link: https://docs.databricks.com/aws/en/admin/governed-tags/#:~:text=1%2C000
  date: '2026-08-12'
