id: meta-ads-connector
name: Meta Ads connector
aliases:
  - Meta Ads
  - Facebook Ads
category: Data engineering
what:
  note: 'The managed Lakeflow Connect connector that ingests advertising data from Meta Ads into Databricks.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/meta-ads#:~:text=allows%20you%20to%20ingest%20advertising%20data%20from%20Meta%20Ads%20into%20Databricks
fact:
  - note: 'Meta Ads here means Facebook Ads - Instagram Ads are not supported during Beta.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/meta-ads-limits#:~:text=The%20connector%20only%20supports%20Facebook%20Ads
  - note: 'No hourly reports, because the Insights API itself does not do hourly time increments.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/meta-ads-limits#:~:text=The%20Insights%20API%20doesn%27t%20support%20hourly%20time%20increments
  - note: 'ad_insights skips SCD type 2 because Meta keeps refining the numbers inside the attribution lookback window.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/meta-ads#:~:text=whose%20values%20Meta%20continuously%20refines%20within%20the%20attribution%20lookback%20window
status:
  value: active
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/meta-ads#:~:text=This%20feature%20is%20in%20Beta
  date: '2026-10-20'
releases:
  - type: beta
    date: 2025-12
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/december#:~:text=You%20can%20now%20ingest%20data%20from%20Meta%20Ads
introducedAt:
  date: 2025-12
  link: https://docs.databricks.com/aws/en/release-notes/product/2025/december#:~:text=You%20can%20now%20ingest%20data%20from%20Meta%20Ads
limitations:
  note: 'Beta: API-only (no UI), Facebook Ads only (no Instagram), no hourly or real-time ingestion and no column-level filtering. Meta Marketing API rate limits apply, so schedules more often than hourly are discouraged; deletes are not detected, history is bounded by Meta retention, ad_insights uses a 3-day attribution window by default, prebuilt reports are fixed, and a pipeline holds up to 250 objects.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/meta-ads-limits#:~:text=Instagram%20Ads%20not%20supported
  date: '2026-10-20'
