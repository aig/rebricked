limitations:
  note: 'Up to 250 tables per pipeline. No automated schema evolution for data type changes, and column renames arrive as a new column plus a deleted one. OAuth U2M is the only supported authentication (no OAuth M2M, manual refresh token or basic authentication).'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zendesk-support-overview#:~:text=Maximum%20number%20of%20tables%20per%20pipeline%20250
  date: '2026-10-20'
