id: zendesk-support-connector
name: Zendesk Support connector
aliases:
  - Zendesk Support
  - Zendesk
  - Zendesk connector
category: Data engineering
what:
  note: 'A managed Lakeflow Connect connector that ingests Zendesk Support ticket data, knowledge base content and community forum data into Databricks.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zendesk-support-overview#:~:text=including%20ticket%20data%2C%20knowledge%20base%20content%2C%20and%20community%20forum%20data
fact:
  - note: 'The Beta announcement promised help center content; by GA the docs call the same thing knowledge base content.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/february#:~:text=ticket%20data%2C%20help%20center%20content%2C%20and%20community%20forum%20data
  - note: 'It went from Beta in February 2026 to generally available in April 2026 - under three months.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/april#:~:text=The%20Zendesk%20Support%20connector%20in%20Lakeflow%20Connect%20is%20now%20generally%20available
  - note: 'Rename a column in Zendesk and the connector books it as a brand-new column plus a deleted one.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/zendesk-support-overview#:~:text=Treated%20as%20a%20new%20column%20%28new%20name%29%20and%20deleted%20column%20%28old%20name%29
status:
  value: active
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/april#:~:text=The%20Zendesk%20Support%20connector%20in%20Lakeflow%20Connect%20is%20now%20generally%20available
  date: '2026-10-20'
releases:
