category: Compute / BI
what:
  note: The original Databricks SQL query editor UI.
  link: https://docs.databricks.com/aws/en/sql/user/sql-editor/legacy#:~:text=the%20query%20tabs%20at%20the%20top%20of%20the%20text%20editor
fact:
  - note: The original Databricks SQL query editor ran one statement per tab - and it's scheduled to retire entirely in late July 2026.
    link: https://docs.databricks.com/aws/en/sql/user/sql-editor/legacy#:~:text=retired%20in%20late%20July%202026
  - note: From late May 2026 the new editor became the default and the opt-out vanished - you can only switch back until the July retirement.
    link: https://docs.databricks.com/aws/en/sql/user/sql-editor/legacy#:~:text=the%20workspace%2Dlevel%20opt%2Dout%20will%20be%20removed
