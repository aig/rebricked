category: AI / BI
what:
  note: Business-user-facing UI giving non-technical users a single conversational entry point to data and AI.
  link: https://docs.databricks.com/aws/en/genie-one/genie#:~:text=single%20entry%20point%20for%20interacting%20with%20data%20and%20AI
fact:
  - note: A deliberately no-notebooks front door for business users - executives and marketers who never open a notebook - that launched as Databricks One, spent a few weeks as plain 'Genie', and settled on Genie One in June 2026.
    link: https://docs.databricks.com/aws/en/ai-bi/release-notes/2026#:~:text=has%20been%20renamed%20to%20Genie%20One
  - note: 'On top of the original no-notebooks experience it went mobile: Databricks launched native iOS and Android apps that, in its words, ''put Genie in your pocket.'''
    link: https://www.databricks.com/blog/introducing-genie-one-genie-ontology-and-genie-agents#:~:text=apps%20that%20put%20Genie%20in%20your%20pocket
