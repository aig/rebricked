id: delta-lake
name: Delta Lake
aliases:
  - Databricks Delta
  - Delta
category: Data engineering
what:
  note: The open table format that adds ACID transactions, schema enforcement, and time travel to data lakes.
  link: https://www.databricks.com/blog/2019/04/24/open-sourcing-delta-lake.html#:~:text=ACID%20transactions%20between%20multiple%20writes
fact:
  - note: It lets you 'time travel' - query a table exactly as it looked versions ago - and the format went from proprietary 'Databricks Delta' to open source in April 2019.
    link: https://www.databricks.com/blog/2019/04/24/open-sourcing-delta-lake.html#:~:text=open%20sourcing%20of%20the%20Delta%20Lake%20project
  - note: Later in 2019 the format was donated to the Linux Foundation, which now hosts it under an open-governance model as an open standard for data lakes.
    link: https://www.databricks.com/blog/2019/10/16/delta-lake-now-hosted-by-the-linux-foundation-to-become-the-open-standard-for-data-lakes.html#:~:text=open%2Dgovernance%20model%20to%20encourage%20participation%20and%20technical%20contributions
