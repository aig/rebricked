id: databricks-community-edition
name: Databricks Community Edition
aliases:
  - Community Edition
  - DCE
category: Developer experience
what:
  note: 'The original free tier of Databricks (2016-2025): a single micro-cluster plus a cluster manager and notebook environment, aimed at learning Apache Spark at no cost with limited resources.'
  link: https://www.databricks.com/blog/2016/02/17/introducing-databricks-community-edition-apache-spark-for-all.html#:~:text=Community%20Edition
fact:
  - note: It debuted at Spark Summit East in February 2016 under the banner 'Apache Spark for all,' handing anyone a free micro-cluster and notebook to start learning Spark.
    link: https://www.databricks.com/blog/2016/02/17/introducing-databricks-community-edition-apache-spark-for-all.html#:~:text=Apache%20Spark%20for%20all
  - note: It caught on fast - Databricks counted thousands of registered users and tens of thousands of notebooks within months of the beta - and reached general availability on June 7, 2016.
    link: https://www.databricks.com/blog/2016/06/07/dce-ga.html#:~:text=generally%20available
status:
