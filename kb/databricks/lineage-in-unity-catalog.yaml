    date: 2022-09
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/september#:~:text=Capture%20and%20view%20lineage%20data%20with%20Unity%20Catalog%20%28Public%20Preview%29
  - type: ga
    date: 2022-12
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/december#:~:text=Databricks%20is%20pleased%20to%20announce%20the%20general%20availability%20of%20Unity%20Catalog%20support%20for%20capturing%20and%20viewing%20lineage%20data
introducedAt:
  date: 2022-09
  link: https://docs.databricks.com/aws/en/release-notes/product/2022/september#:~:text=Capture%20and%20view%20lineage%20data%20with%20Unity%20Catalog%20%28Public%20Preview%29
limitations:
  note: Lineage captured before September 1, 2024 is not available, and the lineage system tables keep only a rolling 1-year window. Lineage is not preserved across renames, and is not captured for RDDs, global temp views, Spark SQL dataset checkpointing, or system.information_schema tables. Jobs submitted via runs submit or spark submit lose the link to the job run, column lineage is lost when a source or target is referenced by path, and UDF lineage is table-level only.
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage#:~:text=Lineage%20data%20captured%20before%20September%201%2C%202024%20is%20not%20available
  date: '2026-09-27'
