id: lineage-in-unity-catalog
name: Lineage in Unity Catalog
aliases:
  - Unity Catalog data lineage
  - data lineage
  - column lineage
  - table lineage
  - system.access.table_lineage
category: Data governance
what:
  note: Unity Catalog automatically captures lineage for queries run on Databricks down to the column level, aggregated across every workspace on the metastore, viewable in Catalog Explorer and queryable through the lineage system tables.
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage#:~:text=Unity%20Catalog%20captures%20lineage%20automatically%20for%20queries%20run%20on%20Databricks
fact:
  - note: The Public Preview announcement promised lineage across every language and then spelled it "Lingeage" in the very next breath.
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/september#:~:text=Lingeage%20data%20is%20captured%20across%20all%20languages
  - note: A feature for a site about renames - lineage is not preserved for renamed catalogs, schemas, tables, views, or columns.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage#:~:text=Lineage%20is%20not%20preserved%20for%20renamed%20catalogs%2C%20schemas%2C%20tables%2C%20views%2C%20or%20columns
  - note: It remembers what you tried to undo - transactions emit lineage as each read and write occurs, and those events persist even if the transaction is rolled back.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage#:~:text=Lineage%20events%20persist%20even%20if%20the%20transaction%20is%20rolled%20back
status:
  value: active
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage#:~:text=Unity%20Catalog%20captures%20lineage%20automatically%20for%20queries%20run%20on%20Databricks
  date: '2026-09-27'
