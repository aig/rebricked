limitations:
  note: Requires Postgres 16 or later. Enabling it on a project is irreversible and restarts all computes in the project, dropping active connections. BM25 indexes compute corpus statistics at build time rather than incrementally, so build them after loading data, and embeddings must be generated outside Lakebase (for example with Model Serving) before they are stored.
  link: https://docs.databricks.com/aws/en/oltp/projects/lakebase-search#:~:text=Enabling%20Lakebase%20Search%20on%20a%20project%20is%20irreversible
  date: '2026-09-27'
