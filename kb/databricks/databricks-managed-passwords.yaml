id: databricks-managed-passwords
name: Databricks-managed passwords
aliases:
  - basic authentication
  - basic auth
  - username and password login
category: Developer experience
what:
  note: The original way in - a username and password held by Databricks, used to sign into the workspace UI and to authenticate API calls and BI tools as HTTP basic auth.
  link: https://docs.databricks.com/aws/en/release-notes/product/2024/july#:~:text=you%20can%20no%20longer%20use%20Databricks%2Dmanaged%20passwords
fact:
  - note: What replaced it for anyone without single sign-on is email. You ask to log in, then wait for a one-time code to arrive in your inbox.
    link: https://docs.databricks.com/aws/en/release-notes/product/2024/july#:~:text=users%20now%20receive%20a%20unique%20code%20via%20email%20to%20log%20in
  - note: Every script still sending a username and password broke on the same day, and the guidance for automation was simply to move to OAuth.
    link: https://docs.databricks.com/aws/en/release-notes/product/2024/july#:~:text=For%20automation%2C%20Databricks%20recommends%20using%20OAuth%20authentication
  - note: Passwords did not entirely die. Emergency access still lets a small number of named users sign in with a password and multi-factor authentication, so the retired mechanism survives precisely for the day everything else is broken.
    link: https://docs.databricks.com/aws/en/admin/account-settings-e2/single-sign-on/emergency-access
status:
