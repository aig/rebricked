  - note: For a few weeks the AI/BI release notes literally said the simplified interface 'has been renamed to Genie. The feature and its capabilities are unchanged.'
    link: https://docs.databricks.com/aws/en/ai-bi/release-notes/2026#databricks-one-renamed-to-genie#:~:text=The%20feature%20and%20its%20capabilities%20are%20unchanged
