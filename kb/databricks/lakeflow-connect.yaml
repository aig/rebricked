id: lakeflow-connect
name: Lakeflow Connect
aliases:
  - Lakeflow ingestion
  - managed connectors
category: Data engineering
what:
  note: 'The managed data-ingestion component of Lakeflow: point-and-click connectors that pull data from SaaS apps and databases (Salesforce, Workday, ServiceNow, SQL Server, PostgreSQL and more) into Unity Catalog on serverless compute, with incremental reads via change data capture.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/#:~:text=ingesting%20data%20from%20SaaS%20applications%20and%20databases
fact:
  - note: Its database connectors do change data capture - reading only the rows that changed - so a full table isn't re-copied on every sync.
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/#:~:text=change%20data%20capture
  - note: It was unveiled alongside the rest of Lakeflow at the 2024 Data + AI Summit, but the first connectors (Salesforce Platform and Workday Reports) didn't reach GA until April 2, 2025.
    link: https://www.databricks.com/blog/announcing-general-availability-lakeflow-connect#:~:text=General%20Availability%20of%20Lakeflow%20Connect%20for%20Salesforce%20Platform%20and%20Workday%20Reports
  - note: 'Some of its muscle came from acquisition: Databricks agreed to buy real-time replication startup Arcion in 2023 to help power native database ingestion.'
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-agrees-acquire-arcion-leading-provider-real-time#:~:text=Arcion
