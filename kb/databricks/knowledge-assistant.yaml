id: knowledge-assistant
name: Knowledge Assistant
aliases:
  - Knowledge Assistant Agent
category: AI / ML
what:
  note: 'Agent Bricks capability: a managed, document-grounded Q&A chatbot that answers questions over your uploaded documents with citations.'
  link: https://docs.databricks.com/aws/en/agents/agent-bricks/knowledge-assistant#:~:text=Use%20Knowledge%20Assistant%20to%20create%20a%20chatbot
fact:
  - note: Rather than plain similarity search it uses an "Instructed Retriever" that learns how each knowledge source is organized - Databricks claims up to 70% higher answer quality than simplistic RAG, with page-level citations on every response.
    link: https://www.databricks.com/blog/agent-bricks-knowledge-assistant-now-generally-available-turning-enterprise-knowledge-answers#:~:text=up%20to%2070%25%20higher%20answer%20quality%20than%20simplistic%20RAG%20approaches
  - note: Its January 2026 general availability came with an asterisk - select US regions only, and only for workspaces without the Enhanced Security and Compliance add-on; HIPAA workspaces had to wait until March 2026 to get it by default.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/march#:~:text=Knowledge%20Assistant%20is%20now%20available%20by%20default%20for%20workspaces%20with%20the
  - note: It spent nine months as a GA product before the October 2026 release notes moved it to the legacy shelf, with the same notice as its sibling Supervisor Agent.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/october#:~:text=Knowledge%20Assistant%20and%20Supervisor%20Agent%20are%20now%20legacy
status:
  value: legacy
