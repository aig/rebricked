limitations:
  note: Files larger than 100 MB and documents over 500 pages (except text and markdown) are skipped during ingestion, as are files whose names start with an underscore or period. For table sources only the selected content column is processed, and AI Search indexes must use a supported embedding model (databricks-gte-large-en, databricks-bge-large-en, or databricks-qwen3-embedding-0-6b).
  link: https://docs.databricks.com/aws/en/generative-ai/agent-bricks/knowledge-assistant#:~:text=Files%20larger%20than%20100%20MB%20are%20automatically%20skipped
