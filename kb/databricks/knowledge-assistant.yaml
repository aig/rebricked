successorId: genie-agents
replacement: Genie Agents for low-code agents over your documents and data; the Agent Bricks CLI for new agents written in code
occasion:
  date: 2025-06
  link: https://www.databricks.com/blog/introducing-agent-bricks#:~:text=Agent%20Bricks%20is%20now%20available%20in%20beta.
  note: Data + AI Summit, June 2025 (beta); GA January 2026.
limitations:
  note: Files larger than 100 MB are skipped during ingestion, as are PDF, DOC, DOCX, PPT and PPTX files with more than 500 pages and any file whose name starts with an underscore or a period. For Unity Catalog table sources only the selected content column is ingested, and AI Search indexes must use one of three supported embedding models (databricks-gte-large-en, databricks-bge-large-en, or databricks-qwen3-embedding-0-6b).
  link: https://docs.databricks.com/aws/en/agents/agent-bricks/knowledge-assistant#:~:text=Files%20larger%20than%20100%20MB%20are%20automatically%20skipped
  date: '2026-10-14'
