id: agentic-code-converter
name: Agentic code converter
aliases:
  - agentic converter
  - migration project
category: Developer experience
what:
  note: Beta migration tool that uses Genie Code subagents to convert existing SQL from legacy dialects - T-SQL, Snowflake, Redshift, Oracle, BigQuery, Teradata - into ANSI SQL that runs on Databricks, tracked file by file in a migration project.
  link: https://docs.databricks.com/aws/en/migration/agentic-code-converter#:~:text=dialects%20such%20as%20T%2DSQL%2C%20Snowflake%2C%20Redshift%2C%20Oracle%2C%20BigQuery%2C%20and%20Teradata
fact:
  - note: 'It does not convert your scripts one at a time: Genie Code deploys a swarm of subagents that translate files concurrently, each validating its own output and retrying the sections it got wrong.'
    link: https://docs.databricks.com/aws/en/migration/agentic-code-converter#:~:text=deploys%20subagents%20that%20convert%20files%20concurrently
  - note: 'You can teach it your house style: a custom skill encodes business rules - proprietary data types, preferred target patterns, corrections you keep making - that get applied automatically on every conversion.'
    link: https://docs.databricks.com/aws/en/migration/agentic-code-converter#:~:text=Custom%20skills%20let%20you%20encode%20business%20rules%20that%20Genie%20Code%20applies%20automatically%20during%20every%20conversion
  - note: 'For a one-off file there is a shortcut out of all the project ceremony: a plain /migrate command typed into a Genie Code conversation.'
    link: https://docs.databricks.com/aws/en/migration/agentic-code-converter#:~:text=You%20can%20also%20convert%20a%20single%20file%20or%20folder%20without%20a%20project%20by%20using%20the
