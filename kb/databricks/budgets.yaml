id: budgets
name: Budgets
aliases:
  - account budgets
  - budget alerts
category: Data governance
what:
  note: Account-level spending thresholds in USD at list price, account-wide or filtered by workspace, team, or custom tags, with email alerts and - for Unity Gateway requests, including Genie - per-user limits that can block usage.
  link: https://docs.databricks.com/aws/en/admin/account-settings/budgets
fact:
  - note: A budget does not know your discount - it tracks list prices and ignores billing credits and negotiated rates, so the number it alarms on is the one before your deal.
    link: https://docs.databricks.com/aws/en/admin/account-settings/budgets
  - note: The alarm can run late - there can be up to a 24-hour delay between the usage and the email telling you about it.
    link: https://docs.databricks.com/aws/en/admin/account-settings/budgets
  - note: It spent two years in Public Preview, from June 2024 to its GA in July 2026.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=Budgets%2C%20including%20budgets%20for%20Unity%20Gateway%2C%20are%20now%20generally%20available
