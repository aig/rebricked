limitations:
  note: Account admins create and manage budgets (workspace admins can manage workspace-scoped ones through Governance Hub); up to 1,000 budgets per account and four alerts per budget, each with a unique monthly threshold; email alerts can lag usage by up to 24 hours; block thresholds are enforced approximately; list prices only, with no credits or negotiated discounts.
