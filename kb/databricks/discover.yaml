what:
  note: A centralized Unity Catalog interface for searching, browsing, and previewing governed data assets, organized into business domains.
  link: https://docs.databricks.com/aws/en/discover/discover-page#:~:text=Databricks%20Discover%20is%20a%20centralized%20discovery%20page
fact:
  - note: 'It''s an internal data-marketplace front door to Unity Catalog: search, browse, and preview governed assets grouped into business domains, so consumers find data without spelunking the catalog tree.'
    link: https://docs.databricks.com/aws/en/discover/discover-page#:~:text=a%20business%2Daligned%20organization%20layer%20where%20curators%20organize%20data%20assets
  - note: It entered Beta on February 18, 2026.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/february#:~:text=searching%2C%20browsing%2C%20and%20previewing%20data%20assets
