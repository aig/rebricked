  link: https://docs.databricks.com/aws/en/release-notes/product/2023/april#:~:text=Beginning%20with%20Databricks%20Runtime%2013.0
limitations:
  note: Doesn't support the display() API, Databricks Utilities (credentials, library, notebook workflow, widgets), SparkContext and RDDs, distributed ML training, or CREATE TABLE AS SELECT, with version-specific restrictions such as no streaming foreachBatch and no queries over 3600 seconds on Runtime 13.3 LTS and below.
  link: https://docs.databricks.com/aws/en/dev-tools/databricks-connect/python/limitations#:~:text=Distributed%20ML%20training%20is%20not%20supported
  date: '2026-07-23'
