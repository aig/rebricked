id: databricks-connect
name: Databricks Connect (13.3 LTS+)
aliases:
  - Databricks Connect
  - databricks-connect
category: Developer experience
what:
  note: The client library for running local DataFrame and Python code against a remote Databricks cluster, rebuilt on Spark Connect.
  link: https://docs.databricks.com/aws/en/dev-tools/databricks-connect/#:~:text=Databricks%20Connect%20is%20a%20client%20library%20for%20the%20Databricks%20Runtime
fact:
  - note: It's built on Spark Connect's gRPC client/server split, so ordinary PySpark DataFrame code on your laptop runs on a remote cluster with no code changes between local and remote.
    link: https://docs.databricks.com/aws/en/dev-tools/databricks-connect/#:~:text=gRPC%2Dbased%20protocol%20within%20Apache%20Spark%20that%20allows%20remote%20execution
  - note: It requires Databricks Runtime 13.3 LTS or above.
    link: https://docs.databricks.com/aws/en/dev-tools/databricks-connect/#:~:text=Databricks%20Connect%20for%20Databricks%20Runtime%2013.3%20LTS%20and%20above
status:
  value: active
  link: https://docs.databricks.com/aws/en/dev-tools/databricks-connect/#:~:text=Databricks%20Connect%20for%20Databricks%20Runtime%2013.3%20LTS%20and%20above
  date: '2026-07-18'
releases:
