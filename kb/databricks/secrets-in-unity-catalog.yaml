id: secrets-in-unity-catalog
name: Secrets in Unity Catalog
aliases:
  - Unity Catalog secrets
  - UC secrets
category: Data governance
what:
  note: Secrets stored and governed as securable objects in Unity Catalog, using the three-level namespace (catalog.schema.secret) and the same privileges and auditing as any other data asset.
  link: https://docs.databricks.com/aws/en/security/secrets/unity-catalog-secrets#:~:text=Unity%20Catalog%20secrets%20use%20the%20three%2Dlevel%20namespace
fact:
  - note: 'Your API keys finally get the same treatment as your tables: a secret becomes a first-class Unity Catalog securable at catalog.schema.secret, so the GRANTs and audit logs you already use for data now cover credentials - no more workspace-scoped secret scopes off to the side.'
    link: https://docs.databricks.com/aws/en/security/secrets/unity-catalog-secrets#:~:text=the%20same%20access%20model%20and%20auditing
  - note: It entered Public Preview on July 10, 2026, replacing off-to-the-side workspace secret scopes with a first-class governed securable.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=store%2C%20govern%2C%20and%20access%20secrets%20as%20securable%20objects%20in%20Unity%20Catalog
status:
  value: active
  link: https://docs.databricks.com/aws/en/security/secrets/unity-catalog-secrets#:~:text=A%20Unity%20Catalog%20secret%20is%20a%20securable%20object%20that%20stores%20sensitive%20material
  date: '2026-07-23'
releases:
  - type: public-preview
    date: 2026-07
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=Secrets%20in%20Unity%20Catalog%20%28Public%20Preview%29
introducedAt:
  date: 2026-07
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=Secrets%20in%20Unity%20Catalog%20%28Public%20Preview%29
limitations:
  note: Not supported on SQL warehouses or in global/cluster init scripts; retrieval needs Databricks Runtime-backed notebooks and jobs. They don't appear in global search, BROWSE on a catalog doesn't apply, and there's no information schema yet; the API needs the unity-catalog OAuth scope. Capped at 100 secrets per schema and 1,000 per metastore.
  link: https://docs.databricks.com/aws/en/security/secrets/unity-catalog-secrets#:~:text=not%20supported%20on%20SQL%20warehouses
  date: '2026-07-23'
links:
  - url: https://docs.databricks.com/aws/en/release-notes/product/2026/july
    kind: official
    label: 'Databricks release notes: Secrets in Unity Catalog Public Preview (July 2026)'
