id: lakeview-dashboards
name: Lakeview dashboards
category: BI / Dashboards
what:
  note: AI-assisted dashboards for visualizing and sharing query results.
  link: https://www.databricks.com/blog/announcing-public-preview-lakeview-dashboards#:~:text=delivers%20beautiful%2C%20interactive%20charts
fact:
  - note: Entered public preview on September 28, 2023 (AWS and Azure first, GCP in the first half of 2024), pairing a new visualization engine that rendered charts up to 10x faster with draft/publish editing and Unity Catalog lineage.
    link: https://www.databricks.com/blog/announcing-public-preview-lakeview-dashboards#:~:text=renders%20them%20up%20to%2010x%20faster
  - note: It launched as 'Lakeview dashboards,' and the REST API still answers to that name - endpoints live under /api/2.0/lakeview - long after the marketing stopped using it.
    link: https://docs.databricks.com/aws/en/dashboards/tutorials/dashboard-crud-api#:~:text=The%20Lakeview%20API%20still%20retains%20that%20name
