  - note: The November 2020 SQL Analytics launch press release still signs off with thousands of data teams that leverage its Unified Data Analytics Platform.
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-sql-analytics-to-enable-cloud-data-warehousing-on-data-lakes#:~:text=leverage%20its%20Unified%20Data%20Analytics%20Platform
