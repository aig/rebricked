what:
  note: The 2019-2020 name for the platform, the same unified analytics pitch with Data added, for data science, data engineering and business teams building data products.
  link: https://www.databricks.com/company/newsroom/press-releases/databricks-partners-tableau-enabling-business-intelligence-on-data-lakes#:~:text=Databricks%20provides%20a%20Unified%20Data%20Analytics%20Platform%20for%20data%20science%20teams
fact:
  - note: A 2020 Forrester Total Economic Impact study credited it with a 417 percent return on investment over three years, a number that fit neatly in a headline.
