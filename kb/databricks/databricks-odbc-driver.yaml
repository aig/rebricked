limitations:
  note: Cloud Fetch applies only to query results larger than 1 MB, requires an E2 workspace and an S3 bucket without versioning, and needs ODBC driver 2.6.17 or above; with bucket versioning enabled, Databricks can't garbage-collect older result files after the 24-hour retention, which can grow storage.
  link: https://docs.databricks.com/aws/en/integrations/odbc/capability#:~:text=Cloud%20Fetch%20only%20applies%20to%20query%20results%20larger%20than%201%20MB
