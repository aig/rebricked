id: databricks-odbc-driver
name: Databricks ODBC Driver
aliases:
  - Simba Spark ODBC Driver
  - Simba ODBC
  - Spark ODBC Driver
category: Developer experience
what:
  note: The ODBC driver for connecting BI tools and applications to Databricks SQL warehouses and clusters.
  link: https://docs.databricks.com/aws/en/integrations/odbc/migration
fact:
  - note: For years this was the third-party 'Simba Spark' driver in disguise - Databricks finally put its own name on it in 2026, and existing DSNs never noticed the change.
    link: https://docs.databricks.com/aws/en/integrations/odbc/migration#:~:text=Databricks%20renamed%20the%20ODBC%20driver%20in%20February%202026
  - note: Databricks stopped shipping new Simba-branded versions but promised to support existing ones for two more years.
    link: https://docs.databricks.com/aws/en/integrations/odbc/migration#:~:text=existing%20versions%20remain%20supported%20for%20two%20years
