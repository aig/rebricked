what:
  note: Databricks Labs CLI that templated and deployed jobs via the Jobs API.
  link: https://learn.microsoft.com/en-us/azure/databricks/archive/dev-tools/dbx/dbx#:~:text=works%20with%20the%20Jobs%20API
fact:
  - note: A Databricks Labs side project - the name is short for 'Databricks CLI eXtensions' - that templated and deployed jobs to the Jobs API straight from your terminal.
    link: https://dbx.readthedocs.io/en/latest/#:~:text=Databricks%20CLI%20eXtensions
  - note: Its config lived in a .dbx/project.json file, a different format entirely, which is why moving off it is a migration rather than a flip of a switch.
    link: https://learn.microsoft.com/en-us/azure/databricks/archive/dev-tools/dbx/dbx#:~:text=.dbx%2Fproject.json
