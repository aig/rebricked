id: agent-bricks-cli
name: Agent Bricks CLI
aliases:
  - databricks-agentbricks
  - agentbricks
category: AI / ML
what:
  note: A command-line tool for developers who build custom agents in code - scaffold a project from a framework template, run it locally against Databricks model serving, and deploy it to the Databricks agent runtime.
  link: https://docs.databricks.com/aws/en/agents/custom-agents/agent-bricks-cli
fact:
  - note: The whole lifecycle is three verbs - agentbricks init, agentbricks dev, agentbricks deploy - with an agent.toml file as the declarative source of truth for every Databricks resource the agent needs.
    link: https://docs.databricks.com/aws/en/agents/custom-agents/agent-bricks-cli
  - note: It ships with exactly two framework templates, LangGraph and the OpenAI Agents SDK, and switches MLflow tracing on by default so every run lands in a per-project experiment.
    link: https://docs.databricks.com/aws/en/agents/custom-agents/agent-bricks-cli
  - note: It is a CLI that needs another CLI - the Databricks CLI has to be installed and on your path before pip install databricks-agentbricks is any use.
    link: https://docs.databricks.com/aws/en/agents/custom-agents/agent-bricks-cli
