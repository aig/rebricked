id: lakebase-change-data-feed
name: Lakebase Change Data Feed
aliases:
  - Lakebase CDF
category: Data engineering
what:
  note: Captures every insert, update, and delete on a Lakebase Postgres table from the write-ahead log and stores each as a new row in a Unity Catalog managed Delta table (one lb_<table>_history table per source), flushed about every 15 seconds, for downstream pipelines and audit.
  link: https://docs.databricks.com/aws/en/oltp/projects/lakebase-cdf#:~:text=is%20captured%20from%20the%20write%2Dahead%20log
fact:
  - note: It runs on a Postgres extension called wal2delta, a name that doubles as the entire job description - read the WAL, write Delta.
    link: https://docs.databricks.com/aws/en/oltp/projects/lakebase-cdf#:~:text=Lakebase%20CDF%20is%20powered%20by%20the%20wal2delta%20Postgres%20extension
  - note: Do not turn on Delta Lake's own change data feed on its destination tables - a change feed of the change feed breaks the re-snapshot it runs when the source schema changes.
    link: https://docs.databricks.com/aws/en/oltp/projects/lakebase-cdf#:~:text=Do%20not%20enable%20Delta%20Lake%20change%20data%20feed%20on%20a%20destination%20table
  - note: An empty table stays out of the feed entirely until it holds at least one row, on the reasonable grounds that nothing has changed yet.
    link: https://docs.databricks.com/aws/en/oltp/projects/lakebase-cdf#:~:text=A%20table%20is%20only%20synced%20if%20it%20contains%20data
status:
  value: active
