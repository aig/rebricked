limitations:
  note: Source tables need REPLICA IDENTITY FULL, partitioned tables are not supported, empty tables are skipped until they hold a row, destination history tables must not get row filters, column masks, or Delta change data feed, and it does not work when the destination catalog's managed storage is reachable only through a private endpoint.
  link: https://docs.databricks.com/aws/en/oltp/projects/lakebase-cdf#:~:text=Lakebase%20partitioned%20tables%20are%20not%20supported
  date: '2026-10-14'
prediction:
