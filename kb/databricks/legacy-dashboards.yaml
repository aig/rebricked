id: legacy-dashboards
name: Legacy dashboards
category: BI / Dashboards
what:
  note: The deprecation-era name for the original Redash-based Databricks SQL dashboards.
  link: https://learn.microsoft.com/en-us/azure/databricks/archive/legacy/legacy-dashboards#:~:text=You%20can%20no%20longer%20create%20new%20legacy%20dashboards
fact:
  - note: Databricks switched these off for good - any that were not converted first were permanently deleted on March 2, 2026.
    link: https://docs.databricks.com/aws/en/dashboards/clone-legacy-to-aibi#:~:text=Legacy%20dashboards%20will%20be%20deleted%20on
  - note: Databricks had already stopped letting anyone create or clone them through the UI or API back on April 10, 2025.
    link: https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2025#:~:text=no%20longer%20create%20or%20clone%20legacy%20dashboards%20using%20the%20UI%20or%20API
