id: external-secrets-in-unity-catalog
name: External secrets in Unity Catalog
aliases:
  - External secrets
  - Externally backed secrets
  - AWS Secrets Manager in Unity Catalog
category: Data governance
what:
  note: Unity Catalog schemas backed by a cloud secret manager, so the values stay in AWS Secrets Manager or Azure Key Vault and only appear in Unity Catalog as read-only securables governed by Unity Catalog privileges.
  link: https://docs.databricks.com/aws/en/security/secrets/external-secrets#:~:text=External%20secrets%20connect%20a%20Unity%20Catalog%20schema%20to%20an%20external%20secret%20manager
fact:
  - note: 'Databricks never keeps the value: every single read goes back out to your cloud secret manager, so the latency and the cloud provider''s per-call bill are part of the design rather than a bug.'
    link: https://docs.databricks.com/aws/en/security/secrets/external-secrets#:~:text=Each%20retrieval%20reads%20the%20current%20value%20directly%20from%20the%20external%20secret%20manager
  - note: A secret manager that allows dots and slashes meets a catalog that does not, and the catalog wins - Unity Catalog quietly rewrites the characters it cannot support on import.
    link: https://docs.databricks.com/aws/en/security/secrets/external-secrets#:~:text=Unity%20Catalog%20substitutes%20characters%20it%20does%20not%20support
  - note: Point it at more secrets than the schema's quota allows and nothing errors - Databricks imports the oldest ones by creation date until the quota is full and leaves the rest behind.
    link: https://docs.databricks.com/aws/en/security/secrets/external-secrets#:~:text=Databricks%20imports%20the%20oldest%20secrets%20first%20by%20creation%20date
status:
  value: active
  link: https://docs.databricks.com/aws/en/security/secrets/external-secrets#:~:text=External%20secrets%20connect%20a%20Unity%20Catalog%20schema%20to%20an%20external%20secret%20manager
  date: '2026-09-15'
releases:
