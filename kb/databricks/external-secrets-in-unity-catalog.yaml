    date: 2026-09
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=External%20secrets%20in%20Unity%20Catalog%20%28Beta%29
introducedAt:
  date: 2026-09
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=External%20secrets%20connect%20a%20Unity%20Catalog%20schema%20to%20AWS%20Secrets%20Manager
limitations:
  note: Read-only from Databricks - CREATE SECRET, WRITE SECRET and deletes are rejected, so the secrets are managed in the external secret manager. A schema cannot mix Databricks-managed and externally backed secrets, switching a schema's backend drops the imported secrets along with their permissions and tags, cross-cloud backing is unsupported, listing is eventually consistent (a few minutes on large stores), and tag filtering applies only to AWS Secrets Manager connections. The Unity Catalog secret quotas still apply - 100 per schema and 1,000 per metastore by default, both raisable on request.
  link: https://docs.databricks.com/aws/en/security/secrets/external-secrets#:~:text=You%20cannot%20create%2C%20update%2C%20rename%2C%20or%20delete%20secrets%20in%20an%20externally%20backed%20schema%20from%20Databricks
  date: '2026-09-15'
