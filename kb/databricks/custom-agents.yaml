id: custom-agents
name: Custom Agents
aliases:
  - Agent Bricks Custom Agents
  - Custom Agents on Apps
  - custom code agents
category: AI / ML
what:
  note: The original code-first brick in Agent Bricks - author an agent in Python with whatever library you like, wrap it in an MLflow ResponsesAgent, and deploy it as a Databricks App with the MLflow AgentServer or to Model Serving.
  link: https://docs.databricks.com/aws/en/agents/custom-agents/author-agent#:~:text=an%20earlier%20agent%20server%20that%20the%20app%20templates%20use
fact:
  - note: The rename was announced in a blog post and nowhere else. No release note on any cloud says the words, and the docs were simply find-and-replaced under it.
    link: https://www.databricks.com/blog/custom-agents-now-available-databricks#:~:text=formerly%20Agent%20Framework
  - note: Your agent only shows up in the workspace Agents list if you named the app with an agent- prefix, so the product is opt-in at the level of a string.
    link: https://docs.databricks.com/aws/en/agents/custom-agents/author-agent#:~:text=its%20name%20must%20start%20with%20the
  - note: Its Model Serving path spent months telling you to move to Databricks Apps, and then in October 2026 the Apps path it recommended was filed under Legacy too.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/october#:~:text=and%20agents%20deployed%20to%20Model%20Serving%2C%20are%20now%20in%20a%20Legacy%20section
status:
  value: legacy
  link: https://docs.databricks.com/aws/en/agents/legacy/#:~:text=no%20longer%20best%20practice%20for%20building%20agents
  date: '2026-10-14'
