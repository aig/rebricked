successorId: agent-bricks-cli
replacement: The Agent Bricks CLI, serving agents with DurableAgentServer on Agent Runtime
occasion:
  date: 2026-02
  link: https://www.databricks.com/blog/custom-agents-now-available-databricks#:~:text=Agent%20Bricks%20Custom%20Agents%2C%20formerly%20Agent%20Framework%2C%20is%20now%20available%20on%20Databricks
  note: Launch blog post
limitations:
  note: Deploying on Databricks Apps supports only medium and large compute sizes, and the MLflow Review App Chat UI does not currently support agents deployed on Databricks Apps (use labeling sessions to evaluate existing traces instead).
  link: https://docs.databricks.com/aws/en/agents/custom-agents/author-agent#:~:text=Only%20medium%20and%20large%20compute%20sizes%20are%20supported
  date: '2026-10-14'
