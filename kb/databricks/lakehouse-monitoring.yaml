id: lakehouse-monitoring
name: Lakehouse Monitoring
aliases:
  - Databricks Lakehouse Monitoring
category: Data governance
what:
  note: 'Databricks'' built-in data and model quality monitoring: out-of-the-box summary statistics, changes in distribution over time, and model performance metrics for tables in the platform.'
  link: https://docs.databricks.com/aws/en/release-notes/product/2023/august#:~:text=integrates%20data%20and%20model%20quality%20monitoring%20into%20the%20Databricks%20platform
fact:
  - note: It shipped with fairness and bias metrics in the box, so the same monitor you set up to catch stale numbers could also tell you your model was discriminating.
    link: https://docs.databricks.com/aws/en/release-notes/product/2023/august#:~:text=including%20fairness%20and%20bias
  - note: 'You never had to build the dashboard: it generated a summary dashboard for you automatically, then let you hang alerts off the data behind it.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2023/august#:~:text=automatically%20generates%20a%20summary%20dashboard
  - note: 'The name outlived the docs that used it: Databricks'' own product page for this capability still answers at a /lakehouse-monitoring URL.'
    link: https://www.databricks.com/product/machine-learning/lakehouse-monitoring
