id: 1password-event-logs-connector
name: '1Password Event Logs connector'
aliases:
  - '1Password Event Logs'
  - '1Password'
category: Data engineering
what:
  note: 'A managed Lakeflow Connect connector that ingests 1Password Events API data - audit events, item usages and sign-in attempts - into Unity Catalog tables.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/1password-event-logs#:~:text=ingests%20Events%20API%20data%20from%201Password%20into%20Databricks
fact:
  - note: 'It watches the password manager watchers: audit events, item usages and sign-in attempts all land in Unity Catalog tables.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/1password-event-logs#:~:text=ingest%20audit%20events%2C%20item%20usages%2C%20and%20sign%2Din%20attempts
  - note: 'No API key and no OAuth - it authenticates with a 1Password Events Reporting bearer token, the only method on the list.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/1password-event-logs#:~:text=1Password%20Events%20Reporting%20bearer%20token
  - note: 'Rename a column upstream and it does not notice the rename - it sees a brand-new column and a deleted one.'
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/1password-event-logs#:~:text=Treated%20as%20a%20new%20column%20%28new%20name%29%20and%20deleted%20column%20%28old%20name%29
status:
  value: active
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/1password-event-logs#:~:text=Lakeflow%20Connect%20for%201Password%20Event%20Logs%20from%20the%20Previews%20page
  date: '2026-10-20'
releases:
  - type: beta
    date: 2026-09
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=The%201Password%20Event%20Logs%20connector%20is%20now%20available%20in%20Lakeflow%20Connect
introducedAt:
  date: 2026-09
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=The%201Password%20Event%20Logs%20connector%20is%20now%20available%20in%20Lakeflow%20Connect
limitations:
  note: 'API-only pipeline authoring (no UI), no API-based row filtering, no SCD Type 2, and schema evolution does not handle data type changes; column renames arrive as a new column plus a deleted one.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/1password-event-logs
  date: '2026-10-20'
