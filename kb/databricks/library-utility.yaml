    kind: official
    label: 'Databricks Runtime 11.0 release notes (June 2022): the runtime where install and installPyPI are gone'
  - url: https://docs.databricks.com/aws/en/release-notes/product/2019/june
    kind: official
    label: 'Databricks release notes (June 2019): Library utilities generally available in Databricks Runtime 5.4'
  - url: https://learn.microsoft.com/en-us/azure/databricks/archive/dev-tools/dbutils-library
    kind: official
    label: 'Microsoft Learn (archived): Library utility (dbutils.library) (legacy)'
