id: dataframe-caching-on-serverless-compute
name: DataFrame caching on serverless compute
aliases:
  - df.cache()
  - df.persist()
  - serverless DataFrame cache
category: Compute / BI
what:
  note: Caching a DataFrame with df.cache() or df.persist() on serverless compute, which computes it once and saves the result as a session-local snapshot in cloud storage to reuse for the rest of the session.
  link: https://docs.databricks.com/aws/en/compute/serverless/dataframe-cache#:~:text=you%20can%20cache%20a%20DataFrame
fact:
  - note: Ask for MEMORY_ONLY and you get disk anyway - serverless accepts any storage level, ignores it, and reports DISK_ONLY once the DataFrame is cached.
    link: https://docs.databricks.com/aws/en/compute/serverless/dataframe-cache#:~:text=accepts%20any%20storage%20level%20and%20ignores%20it
  - note: It is eager, not lazy - the DataFrame is computed the moment you call cache(), not on the next action.
    link: https://docs.databricks.com/aws/en/compute/serverless/dataframe-cache#:~:text=computes%20the%20DataFrame%20when%20you%20call
  - note: The snapshot is private and perishable - only the session that cached it can read it, and it lasts until the session ends, for at most seven days.
    link: https://docs.databricks.com/aws/en/compute/serverless/dataframe-cache#:~:text=for%20at%20most%20seven%20days
status:
  value: active
  link: https://docs.databricks.com/aws/en/compute/serverless/dataframe-cache#:~:text=This%20feature%20is%20in%20Public%20Preview
  date: '2026-10-26'
releases:
