limitations:
  note: Public Preview, on by default. Not available with the compliance security profile or in AWS GovCloud; needs serverless environment version 5 or above (Databricks Connect Python 18.1.8+ or Scala 18.1.5+); CACHE TABLE and the spark.catalog cache methods are unsupported; DataFrames with duplicate or special-character column names, interval columns, or no columns cannot be cached; the persist storage level and the unpersist blocking flag are ignored.
  link: https://docs.databricks.com/aws/en/compute/serverless/dataframe-cache
  date: '2026-10-26'
