id: databricks-terraform-provider
name: Databricks Terraform provider
aliases:
  - databricks/databricks
  - databrickslabs/databricks
  - Terraform provider
  - Databricks Labs Terraform provider
  - terraform-provider-databricks
category: Developer experience
what:
  note: A HashiCorp Terraform provider for managing Databricks workspaces, their resources, and the associated cloud infrastructure as code, with the goal of supporting all Databricks REST APIs.
  link: https://docs.databricks.com/aws/en/dev-tools/terraform/#:~:text=The%20goal%20of%20the%20Databricks%20Terraform%20provider%20is%20to%20support%20all%20Databricks%20REST%20APIs
fact:
  - note: It started life as a Databricks Labs project under the databrickslabs/databricks source address, and old configs still pointing there fail to install until you replace it with databricks/databricks in every .tf file.
    link: https://docs.databricks.com/aws/en/dev-tools/terraform/troubleshoot#:~:text=Replace%20databrickslabs%2Fdatabricks%20with%20databricks%2Fdatabricks%20in%20all%20of%20your%20.tf%20files
  - note: The move left a forwarding address on the docs - the troubleshooting page still sends provider bugs to Issues in the databrickslabs/terraform-provider-databricks GitHub repository.
    link: https://docs.databricks.com/aws/en/dev-tools/terraform/troubleshoot#:~:text=Issues%20in%20the%20databrickslabs%2Fterraform%2Dprovider%2Ddatabricks%20GitHub%20repository
  - note: Its launch post credits a customer obsessed crew from the Databricks Labs who teamed up and started building it a few months before the announcement.
    link: https://www.databricks.com/blog/2020/09/11/announcing-databricks-labs-terraform-integration-on-aws-and-azure.html#:~:text=customer%20obsessed%20crew%20from%20the%20Databricks%20Labs
status:
