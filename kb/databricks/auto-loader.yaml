limitations:
  note: Auto Loader does not guarantee the order in which files are discovered or processed, so pipelines must handle out-of-order arrivals. With file events, the cache can expire if the stream runs infrequently (invoke it at least once every seven days or it falls back to directory listing), and useIncremental, useNotifications, cloudFiles.fetchParallelism, cloudFiles.backfillInterval and cloudFiles.pathRewrites are unsupported. Classic file notification mode does not support changing the source path.
  link: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/file-notification-mode#:~:text=invoke%20Auto%20Loader%20at%20least%20once%20every%20seven%20days
  date: '2026-09-20'
