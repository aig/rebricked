limitations:
  note: Beta limitations - supported on users only, with service principals and groups not yet covered; each attribute holds a single value; the attribute control list can only be configured in the account console, with no API to do it programmatically; and on Microsoft Entra ID costCenter and division have no native source field.
  link: https://docs.databricks.com/aws/en/admin/users-groups/identity-attributes/#:~:text=Identity%20attributes%20are%20supported%20on%20users%20only
  date: '2026-08-20'
