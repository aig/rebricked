id: identity-attributes
name: Identity attributes
category: Data governance
what:
  note: A fixed set of nine attributes (title, userType, locality, region, country, costCenter, organization, division, department) that Databricks stores on account users and syncs from your identity provider, so Unity Catalog ABAC policies can reference who someone is rather than only which group they are in.
  link: https://docs.databricks.com/aws/en/admin/users-groups/identity-attributes/#:~:text=Identity%20attributes%20are%20a%20fixed%20set%20of%20nine%20attributes%20that%20Databricks%20stores%20on%20account%20users
fact:
  - note: Nine attributes, and nine is the whole list - each one holds a single value, and the docs file multi-valued attributes under "future work".
    link: https://docs.databricks.com/aws/en/admin/users-groups/identity-attributes/#:~:text=Multi%2Dvalued%20attributes%20are%20future%20work
  - note: Two of the nine have nowhere to come from on Microsoft Entra ID, which has no native source field for costCenter or division, so they stay unmapped unless you supply a custom extension attribute or expression.
    link: https://docs.databricks.com/aws/en/admin/users-groups/identity-attributes/#:~:text=On%20Microsoft%20Entra%20ID%20there%20is%20no%20native%20source%20field%20for
  - note: Storing the attributes and using them are two separate launches - the ABAC policy functions that consume them (has_identity_attribute_value and has_identity_attribute_tag_match, valid in the WHEN clause of a column mask policy) ship separately from the attributes themselves.
    link: https://docs.databricks.com/aws/en/admin/users-groups/identity-attributes/#:~:text=ABAC%20policy%20functions%20that%20consume%20identity%20attributes%20are%20delivered%20separately%20from%20this%20feature
status:
