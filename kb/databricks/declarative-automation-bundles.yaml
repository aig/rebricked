id: declarative-automation-bundles
name: Declarative Automation Bundles
aliases:
  - Databricks Asset Bundles
  - DABs
  - DAB
category: Developer experience
what:
  note: Infrastructure-as-code format for defining and deploying Databricks resources (jobs, pipelines, etc.) as a versioned bundle.
  link: https://docs.databricks.com/aws/en/dev-tools/bundles/#:~:text=infrastructure%2Das%2Dcode%20%28IaC%29%20approach%20to%20managing%20your%20Databricks%20projects
fact:
  - note: Describe an entire project's Databricks resources - jobs, pipelines, dashboards, model serving endpoints - as YAML source files, then validate, deploy, and run the whole bundle from the Databricks CLI.
    link: https://docs.databricks.com/aws/en/dev-tools/bundles/#:~:text=Dashboards%2C%20Model%20Serving%20endpoints
  - note: The 2026 rename kept the affectionate 'DABs' acronym, so the docs now read 'Declarative Automation Bundles (formerly known as Databricks Asset Bundles).'
    link: https://docs.databricks.com/aws/en/dev-tools/bundles/#:~:text=formerly%20known%20as%20Databricks%20Asset%20Bundles
  - note: The rename was applied retroactively, so the September 2023 release note that first announced the Public Preview now reads as if it always said 'Declarative Automation Bundles'.
    link: https://docs.databricks.com/aws/en/release-notes/product/2023/september#:~:text=Declarative%20Automation%20Bundles%20%28Public%20Preview%29
