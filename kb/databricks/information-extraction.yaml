id: information-extraction
name: Information Extraction
aliases:
  - Key Information Extraction
category: AI / ML
what:
  note: Agent Bricks capability with a no-code UI that turns unstructured documents into a structured table by extracting fields against a schema.
  link: https://docs.databricks.com/aws/en/generative-ai/agent-bricks/info-extraction#:~:text=transforms%20unstructured%20documents%20and%20text%20into%20key%2C%20structured%20insights
fact:
  - note: You describe what you want in plain English and click Generate Schema - it writes the extraction schema for you; under the hood it runs on the ai_extract SQL function.
    link: https://docs.databricks.com/aws/en/generative-ai/agent-bricks/info-extraction#:~:text=Information%20Extraction%20is%20built%20on%20top%20of%20the%20AI%20function
  - note: The original launch capability now sits at a '(legacy)' docs page, replaced by a rebuild on the ai_extract v2 signature.
    link: https://docs.databricks.com/aws/en/generative-ai/agent-bricks/info-extraction#:~:text=This%20page%20covers%20the%20new%20version%20of%20Information%20Extraction
status:
