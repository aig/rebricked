    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=The%20Databricks%20Genie%20app%20for%20Slack%20is%20now%20available%20in%20Public%20Preview
  - type: ga
    date: 2026-11
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/november#:~:text=The%20Databricks%20Genie%20app%20for%20Slack%20is%20now%20generally%20available
introducedAt:
  date: 2026-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=The%20Databricks%20Genie%20app%20for%20Slack%20is%20now%20available%20in%20Public%20Preview
limitations:
  note: You can't choose the SQL warehouse - Databricks picks one the user is authorized to use. A pinned Genie Agent only receives new conversations (existing ones stay on Genie One, and Genie One may rewrite the question before it reaches the agent), feedback always goes to Genie One, and you can't create Genie Agents from Slack. Workspaces with an IP access list must allow the us-west-2 control plane IPs, and Private Link workspaces need a context-based ingress rule for the app.
  link: https://docs.databricks.com/aws/en/genie-one/genie-slack#:~:text=You%20cannot%20specify%20which%20compute%20%28SQL%20warehouse%29%20the%20Databricks%20Genie%20app%20for%20Slack%20uses
  date: '2026-11-10'
