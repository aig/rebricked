id: unity-catalog-functions-mcp-server
name: Unity Catalog functions MCP server
aliases:
  - UC Functions MCP server
  - functions MCP server
category: AI / ML
what:
  note: Databricks managed MCP server that exposes the custom Python and SQL functions registered in Unity Catalog as predefined tools for agents to call, governed by Unity Catalog permissions.
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/uc-functions#:~:text=exposes%20the%20custom%20Python%20and%20SQL%20functions%20you%20register%20in%20Unity%20Catalog
fact:
  - note: No tool authoring required - a Python or SQL function someone already registered in a catalog becomes a predefined tool an agent can call.
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/uc-functions#:~:text=predefined%20tools%20for%20agents%20to%20call
  - note: It was in the first batch of managed servers Databricks announced in June 2025, alongside the Genie space and AI Search index servers.
    link: https://www.databricks.com/blog/announcing-managed-mcp-servers-unity-catalog-and-mosaic-ai-integration#:~:text=managed%20servers%20for%20UC%20Functions%2C%20Genie%20spaces%2C%20and%20AI%20Search%20Indexes
