limitations:
  note: 'For traces stored in Unity Catalog: ingestion is initially limited to 200 traces per second per workspace and 100 MB per second per table (a raisable default - ask your account team for more); an experiment can be bound to a Unity Catalog trace location only when it is created; Unity Catalog traces are not supported with Knowledge Assistant or Supervisor Agent; individual traces cannot be deleted (delete rows from the underlying tables with SQL instead); and traces cannot yet be written to a default storage catalog or to storage protected by Private Link. Traces stored in an experiment instead are hard-capped at 100,000 per experiment.'
  link: https://docs.databricks.com/aws/en/mlflow3/genai/tracing/trace-unity-catalog#:~:text=Trace%20ingestion%20is%20initially%20limited%20to%20200%20traces%20per%20second%20per%20workspace
