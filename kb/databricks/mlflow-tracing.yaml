category: AI / ML
what:
  note: 'The observability layer for GenAI apps and agents on Databricks: it records the inputs, outputs, latency, token usage, and cost of every intermediate step of a run - LLM calls, retrievers, tools, sub-agents - and shows them in the MLflow trace explorer, with traces kept in an MLflow experiment or, since 2026, as OpenTelemetry rows in Unity Catalog tables.'
  link: https://docs.databricks.com/aws/en/mlflow3/genai/tracing/#:~:text=MLflow%20Tracing%20is%20the%20observability%20foundation%20for%20GenAI%20development%20on%20Databricks
fact:
  - note: 'The docs page for watching what your agent does opens with a "Coding agent quickstart" - "Using a coding agent? Paste this prompt" - so the first recommended reader of the tracing documentation is the agent you are about to trace.'
    link: https://docs.databricks.com/aws/en/mlflow3/genai/tracing/#:~:text=Using%20a%20coding%20agent%3F%20Paste%20this%20prompt
  - note: Keep traces in an MLflow experiment and the backend caps you at 100,000 traces per experiment; point the experiment at a Unity Catalog table instead and the same row of the comparison table just says Unlimited.
    link: https://docs.databricks.com/aws/en/mlflow3/genai/tracing/trace-unity-catalog#:~:text=100%2C000%20traces%20per%20experiment
  - note: Since August 2026 the trace explorer can be redecorated by Genie - you describe the layout you want in plain language and it generates a reusable view with no coding required, which is an AI building the dashboard you use to check on your AI.
    link: https://docs.databricks.com/aws/en/mlflow3/genai/tracing/observe-with-traces/custom-trace-view#:~:text=You%20describe%20the%20layout%20you%20want%20in%20plain%20language%20and%20Genie%20generates%20it%2C%20with%20no%20coding%20required
