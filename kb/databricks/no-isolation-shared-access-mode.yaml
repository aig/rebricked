id: no-isolation-shared-access-mode
name: No isolation shared access mode
aliases:
  - No isolation shared clusters
  - no-isolation shared
  - legacy shared (no isolation)
category: Compute / BI
what:
  note: The legacy compute access mode that shares a cluster across users without process isolation or Unity Catalog governance.
  link: https://docs.databricks.com/aws/en/admin/account-settings/no-isolation-shared#:~:text=run%20arbitrary%20code%20from%20multiple%20users%20in%20the%20same%20shared%20environment
fact:
  - note: It shared one cluster across users with no process isolation between them and no Unity Catalog governance - so, unsurprisingly, new accounts don't get it by default anymore.
    link: https://docs.databricks.com/aws/en/admin/account-settings/legacy-features#:~:text=won%27t%20have%20access%20to%20legacy%20features%20by%20default
  - note: Admins can flip an account setting that disables credential sharing on these clusters.
    link: https://docs.databricks.com/aws/en/admin/account-settings/no-isolation-shared#:~:text=prevents%20automatic%20generation%20of%20Databricks%20API%20internal%20credentials
  - note: From September 30, 2026 every new workspace is provisioned without it, so the mode survives only in workspaces old enough to remember asking for it.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/upgrade/uc-only-migration#:~:text=Starting%20on%20September%2030%2C%202026
status:
  value: legacy
  link: https://docs.databricks.com/aws/en/admin/account-settings/no-isolation-shared#:~:text=use%20the%20legacy%20access%20mode
  date: '2026-08-20'
from:
  date: '2022'
  link: https://docs.databricks.com/aws/en/release-notes/product/2022/august#:~:text=Cluster%20UI%20preview%20and%20access%20mode%20replaces%20security%20mode
deprecatedAt:
  date: 2025-12
  link: https://docs.databricks.com/aws/en/admin/account-settings/legacy-features#:~:text=accounts%20created%20after%20December%2019%2C%202025
successorId: shared-single-user-access-modes
replacement: Shared or Single user access mode
