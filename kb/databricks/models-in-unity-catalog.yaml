id: models-in-unity-catalog
name: Models in Unity Catalog
aliases:
  - UC models
  - Models in UC
category: AI / ML
what:
  note: Model lifecycle management governed by Unity Catalog - registered models live in the three-level namespace with aliases instead of stages.
  link: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/#:~:text=using%20aliases%20to%20promote%20models%20for%20deployment
fact:
  - note: Registered models live in the catalog.schema namespace with aliases like @champion, so promoting a model to production is just repointing an alias - and every version carries Unity Catalog lineage and access control.
    link: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/#:~:text=centralized%20access%20control%2C%20auditing%2C%20lineage%2C%20and%20model%20discovery%20across%20workspaces
  - note: You migrate old model versions across with copy_model_version().
    link: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/#:~:text=copy_model_version%20MLflow%20Client%20API
status:
  value: active
  link: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/#:~:text=Databricks%20recommends%20for%20governing%20and%20deploying%20models
  date: '2026-07-18'
