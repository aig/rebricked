  link: https://docs.databricks.com/aws/en/release-notes/product/2023/june#:~:text=Models%20in%20Unity%20Catalog%20%28Public%20Preview%29
limitations:
  note: Doesn't support stages, webhooks, email notifications, comment threads, or the activity log, and several search-API fields and operators (order_by, tag filters, and operators beyond exact equality) are unsupported.
  link: https://docs.databricks.com/aws/en/machine-learning/manage-model-lifecycle/#:~:text=Webhooks%20are%20not%20supported%20for%20models%20in%20Unity%20Catalog.
  date: '2026-07-23'
