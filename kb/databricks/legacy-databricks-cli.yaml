category: Developer experience
what:
  note: The original Python-based command-line interface (versions 0.18 and below).
  link: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/migrate#:~:text=Databricks%20CLI%20versions%200.18%20and%20below
fact:
  - note: It was a Python package (versions 0.18 and below) that carried an official 'Experimental' label for its entire life and never graduated out of it.
    link: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/migrate#:~:text=The%20legacy%20CLI%20remains%20in%20an%20Experimental%20state.
  - note: Databricks says it 'has not established a date or timeline for deprecating the legacy CLI' - it is simply unsupported and frozen.
    link: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/cli/migrate#:~:text=Databricks%20has%20not%20established%20a%20date%20or%20timeline%20for%20deprecating%20the%20legacy%20CLI.
