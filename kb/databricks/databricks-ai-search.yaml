id: databricks-ai-search
name: Databricks AI Search
aliases:
  - Mosaic AI Vector Search
  - Databricks Vector Search
  - Vector Search
category: AI / ML
what:
  note: Managed search over Unity Catalog data, covering vector similarity plus hybrid keyword-similarity search over the same index.
  link: https://docs.databricks.com/aws/en/ai-search/ai-search#:~:text=combines%20vector%2Dbased%20embedding%20search%20with%20traditional%20keyword%2Dbased%20search
fact:
  - note: It outgrew pure vector search - on a storage-optimized endpoint you can now build an index with no embedding columns at all and search it with BM25 keyword scoring, a capability still in Beta.
    link: https://docs.databricks.com/aws/en/ai-search/ai-search#:~:text=The%20index%20supports%20keyword%2Dbased%20full%2Dtext%20search%20using%20BM25%20scoring%2C%20without%20requiring%20vector%20embeddings
  - note: Its high-QPS mode is enabled by default and yet changes nothing for the endpoints you already run - existing endpoints are pointedly left alone.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=High%20QPS%20is%20enabled%20by%20default%2C%20but%20existing%20endpoints%20are%20not%20affected
status:
  value: active
  link: https://docs.databricks.com/aws/en/ai-search/ai-search#:~:text=Databricks%20AI%20Search%20%28formerly%20Databricks%20Vector%20Search%29
  date: '2026-08-20'
releases:
  - type: ga
    date: 2024-05
    link: https://www.databricks.com/blog/announcing-mosaic-ai-vector-search-general-availability-databricks#:~:text=general%20availability%20of%20Databricks%20AI%20Search
from:
  date: 2026-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Vector%20Search%20is%20now%20AI%20Search
limitations:
  note: Row- and column-level permissions aren't supported, indexes can't be cloned into another workspace, the _id column name is reserved, and index capacity is provisioned from the source table size at creation, so starting small risks capacity-exhausted errors. Query results default to 10,000 rows for ANN and 200 for hybrid or full-text search with a 10 MB response limit, all raisable on request, and storage-optimized endpoints add limits such as no continuous sync, embedding dimensions divisible by 16, and no CMK or FedRAMP support.
  link: https://docs.databricks.com/aws/en/ai-search/ai-search#:~:text=Row%20and%20column%20level%20permissions%20are%20not%20supported
  date: '2026-08-20'
