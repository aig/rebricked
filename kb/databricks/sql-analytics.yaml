id: sql-analytics
name: SQL Analytics
category: Compute / BI
what:
  note: The SQL query, dashboard, and BI service that let data analysts run data-warehouse-style workloads directly on the data lake.
  link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-sql-analytics-to-enable-cloud-data-warehousing-on-data-lakes#:~:text=workloads%20previously%20meant%20only%20for%20a%20data%20warehouse%20on%20a%20data%20lake
fact:
  - note: 'Debuted in November 2020 to let analysts run plain BI and reporting workloads directly on the data lake, with a SQL-native query and visualization interface and native connectors for major BI tools like Tableau and Power BI: warehouse habits at lake prices.'
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-sql-analytics-to-enable-cloud-data-warehousing-on-data-lakes#:~:text=native%20connectors%20for%20all%20major%20BI%20tools
