id: databricks-apps
name: Databricks Apps
aliases:
  - Apps
  - databricks apps
category: Developer experience
what:
  note: A serverless way to build and deploy interactive data and AI applications - dashboards, chatbots, forms, ops tools - directly on Databricks, in common Python or JavaScript frameworks and governed by Unity Catalog.
  link: https://docs.databricks.com/aws/en/dev-tools/databricks-apps/#:~:text=build%20and%20deploy%20secure%20data%20and%20AI%20applications%20directly%20on%20the%20Databricks%20platform
fact:
  - note: It takes an off-the-shelf Streamlit, Dash, Gradio, or React app and runs it on Databricks' own serverless compute with no infrastructure to provision - and the app is governed by Unity Catalog like everything else on the platform.
    link: https://docs.databricks.com/aws/en/dev-tools/databricks-apps/#:~:text=Popular%20Python%20frameworks%20include%20Streamlit%2C%20Dash%2C%20and%20Gradio
  - note: By its 2025 GA, Databricks reported 20,000+ apps built by 2,500+ customers across 28 regions.
    link: https://www.databricks.com/blog/announcing-general-availability-databricks-apps#:~:text=Over%2020%2C000%20apps%20have%20already%20been%20built
