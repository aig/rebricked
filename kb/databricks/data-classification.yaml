id: data-classification
name: Data Classification
aliases:
  - Databricks Data Classification
  - Unity Catalog data classification
category: Data governance
what:
  note: Unity Catalog governance feature that uses an agentic AI system to automatically classify and tag the sensitive data in the tables in your catalog, so you can then apply controls such as ABAC column masks over the results.
  link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification#:~:text=uses%20an%20agentic%20AI%20system%20to%20automatically%20classify%20and%20tag
fact:
  - note: The engine works hard at not working - it leans on intelligent scanning to decide when a table is worth looking at, and new tables and columns in a catalog are typically scanned within 24 hours of being created.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification#:~:text=New%20tables%20and%20columns%20in%20a%20catalog%20are%20typically%20scanned%20within%2024%20hours%20of%20being%20created
  - note: Its own results table is a sensitive-data hoard - system.data_classification.results contains all classification results across the entire metastore, sample values included, so the docs tell you to share it only with people allowed to see all of that.
    link: https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification#:~:text=contains%20all%20classification%20results%20across%20the%20entire%20metastore
  - note: It keeps quietly switching itself on for the strictest customers - after GA it became available by default for compliance security profile workspaces, reaching the ones with C5, TISAX, or IRAP controls selected in July 2026.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=either%20C5%2C%20TISAX%2C%20or%20IRAP%20controls%20selected
