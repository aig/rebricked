id: databricks-vector-search
name: Databricks Vector Search
category: AI / ML
what:
  note: Managed vector (similarity) search over Unity Catalog data, turning a Delta table into an auto-syncing vector index for RAG apps.
  link: https://docs.databricks.com/aws/en/vector-search/vector-search#:~:text=AI%20applications%20such%20as%20RAG%20systems
fact:
  - note: Launched to give RAG apps a serverless similarity search that could turn any Delta table into an auto-syncing vector index with one click, all governed by the same Unity Catalog permissions as the underlying data.
    link: https://docs.databricks.com/aws/en/vector-search/vector-search#:~:text=appear%20in%20and%20are%20governed%20by%20Unity%20Catalog
status:
