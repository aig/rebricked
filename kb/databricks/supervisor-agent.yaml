  link: https://docs.databricks.com/aws/en/release-notes/product/2026/october#:~:text=are%20now%20in%20a%20Legacy%20section
successorId: genie-agents
replacement: Genie Agents for low-code agents; the Agent Bricks CLI to coordinate multiple agents in code
occasion:
  date: 2026-02
  link: https://www.databricks.com/blog/agent-bricks-supervisor-agent-now-ga-orchestrate-enterprise-agents#:~:text=Agent%20Bricks%20Supervisor%20Agent%20is%20Now%20GA
  note: Supervisor Agent GA, February 2026
limitations:
  note: A single supervisor system cannot use more than 50 agents, and AI Search index subagents support only Delta Sync indexes. It needs serverless compute, Unity Catalog, Model Serving access and a nonzero serverless usage policy budget in a supported region. Web search is unavailable in workspaces with the Enhanced Security and Compliance add-on or in regions lacking web-search-capable models.
  link: https://docs.databricks.com/aws/en/agents/agent-bricks/multi-agent-supervisor#:~:text=cannot%20use%20more%20than%2050%20agents
  date: '2026-10-07'
