id: supervisor-agent
name: Supervisor Agent
aliases:
  - Multi-Agent Supervisor
  - 'Agent Bricks: Multi-Agent Supervisor'
  - MAS
category: AI / ML
what:
  note: Agent Bricks capability that orchestrates multiple specialized agents, routing each request to the right one.
  link: https://docs.databricks.com/aws/en/agents/agent-bricks/multi-agent-supervisor#:~:text=coordinates%20Genie%20Agents%2C%20agent%20endpoints
fact:
  - note: It's an agent whose entire job is bossing other agents around - routing each request to the right specialist - and its doc URL still reads /multi-agent-supervisor.
    link: https://docs.databricks.com/aws/en/agents/agent-bricks/multi-agent-supervisor#:~:text=Use%20Supervisor%20Agent%20to%20create%20a%20supervisor%20system
  - note: It can now supervise supervisors - another Supervisor Agent counts as a subagent tool - and a single system tops out at 50 agents, so the org chart has a documented headcount cap.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/may#:~:text=nesting%20supervisor%20agents%20as%20subagent%20tools
  - note: It went GA in February 2026 and was on the legacy shelf by October, where the docs tell you to replace one supervisor with either a low-code agent or a CLI, depending on whether you prefer clicking or typing.
    link: https://docs.databricks.com/aws/en/agents/legacy/#:~:text=To%20coordinate%20multiple%20agents%20in%20code
status:
  value: legacy
  link: https://docs.databricks.com/aws/en/agents/legacy/#:~:text=no%20longer%20best%20practice%20for%20building%20agents
  date: '2026-10-07'
