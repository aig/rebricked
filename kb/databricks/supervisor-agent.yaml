limitations:
  note: A single supervisor system cannot use more than 50 agents, and AI Search index subagents support only Delta Sync indexes. It needs serverless compute, Unity Catalog, Model Serving access and a nonzero serverless usage policy budget in a supported region. Web search requires databricks-gpt-5 in the allowlist and is unavailable in workspaces with the Enhanced Security and Compliance add-on or in regions lacking web-search-capable models.
