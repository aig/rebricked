category: Compute / BI
what:
  note: The hosted Apache Spark data platform under the plain company name, after it went generally available in June 2015 and dropped the word Cloud.
  link: https://www.databricks.com/company/newsroom/press-releases/databricks-announces-general-availability-cloud-platform-dramatically-simplifies-big-data-processing#:~:text=formerly%20known%20as%20Databricks%20Cloud
fact:
  - note: 'At GA it ran on exactly one cloud: it was available as a hosted platform on Amazon Web Services with a monthly subscription.'
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-announces-general-availability-cloud-platform-dramatically-simplifies-big-data-processing#:~:text=Databricks%20is%20available%20as%20a%20hosted%20platform%20on%20Amazon%20Web%20Services%20with%20a%20monthly%20subscription
  - note: Unveiled at Spark Summit 2014, it spent months in limited availability starting that November before Databricks opened it to everyone.
    link: https://www.databricks.com/blog/2015/06/15/databricks-is-now-generally-available.html#:~:text=launched%20it%20in%20limited%20availability%20in%20November
