limitations:
  note: Beta, turned on by a workspace admin from the Previews page. Monitors only jobs, pipelines and tables - not models or apps - and detects failures and data quality issues, not performance or cost regressions. It works per workspace rather than per account, a configuration can be shared with up to 25 individual workspace users but not with groups or service principals, it is not HIPAA compliant, and detecting data quality issues needs separately billed data quality monitoring.
  link: https://docs.databricks.com/aws/en/zeroops/#:~:text=It%20does%20not%20detect%20performance%20or%20cost%20regressions
  date: '2026-11-13'
