limitations:
  note: Private Preview (free, but detecting data quality issues needs data quality monitoring, billed separately). Monitors only jobs, pipelines and tables - not models or apps - and detects failures and data quality issues, not performance or cost regressions. It does not validate fixes in a production sandbox, works per workspace rather than per account, keeps its configuration and insights private to the user who set it up, and is not HIPAA compliant.
  link: https://docs.databricks.com/aws/en/zeroops/#:~:text=does%20not%20validate%20fixes%20in%20a%20production%20sandbox
  date: '2026-09-27'
