id: genie-zeroops
name: Genie ZeroOps
aliases:
  - ZeroOps
  - Genie background agent
category: Data engineering
what:
  note: A background agent in the Genie family that monitors your jobs, pipelines and tables, detects failures and data quality issues, identifies the root cause, and proposes a fix in an inbox of insights.
  link: https://docs.databricks.com/aws/en/zeroops/#:~:text=background%20agent%20that%20monitors%20your%20jobs%2C%20pipelines%2C%20and%20tables
fact:
  - note: It does not wait to be asked - where a prompt-driven assistant responds when you call it, this one runs continuously without a prompt and surfaces issues for you to act on.
    link: https://docs.databricks.com/aws/en/zeroops/#:~:text=runs%20continuously%20without%20a%20prompt
  - note: 'Zero ops does not mean zero review: for a job that runs code from Git it will prepare the change, but it pushes a fix to a new branch only after you explicitly ask it to and confirm the push.'
    link: https://docs.databricks.com/aws/en/zeroops/#:~:text=pushes%20a%20fix%20only%20after%20you%20explicitly%20ask%20it%20to%20and%20confirm%20the%20push
  - note: Before an insight's title or summary goes out in a notification, it checks the text for sensitive information such as names and email addresses and masks what it finds.
    link: https://docs.databricks.com/aws/en/zeroops/#:~:text=checks%20that%20text%20for%20sensitive%20information
