id: genie-zeroops
name: Genie ZeroOps
aliases:
  - ZeroOps
  - Genie background agent
category: Data engineering
what:
  note: A background agent in the Genie family that monitors your jobs, pipelines and tables, detects failures and data quality issues, identifies the root cause and downstream impact, and proposes a fix in an inbox of insights.
  link: https://docs.databricks.com/aws/en/zeroops/#:~:text=background%20agent%20that%20monitors%20your%20jobs%2C%20pipelines%2C%20and%20tables
fact:
  - note: It is discreet about things you are not allowed to see - if the root cause is an asset you lack access to, it will not name it and just reports that an upstream job or pipeline failed.
    link: https://docs.databricks.com/aws/en/zeroops/#:~:text=reports%20that%20an%20upstream%20job%20or%20pipeline%20failed
  - note: One root cause, one ticket - when a single problem breaks several assets, it rolls them into one insight instead of reporting each casualty separately.
    link: https://docs.databricks.com/aws/en/zeroops/#:~:text=groups%20them%20into%20one%20insight
  - note: 'Zero ops does not mean zero hands: it proposes the fix and links you to the source, but you generate the fix yourself or by prompting Genie Code.'
    link: https://docs.databricks.com/aws/en/zeroops/#:~:text=you%20generate%20the%20fix%20yourself
