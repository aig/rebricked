id: vnet-injection
name: VNet injection
aliases:
  - Bring Your Own VNET
  - BYO VNet
  - VNet-injected workspace
  - Deploy Azure Databricks in your Azure virtual network
category: Compute / BI
what:
  note: Deploying an Azure Databricks workspace's classic compute plane into an Azure virtual network you own, for network customization, private connectivity to Azure services and on-premises sources, custom DNS, and traffic inspection.
  link: https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/vnet-inject#:~:text=Deploy%20Azure%20Databricks%20in%20your%20Azure%20VNet%20to%20enable%20network%20customization
fact:
  - note: 'The "public subnet" is a nickname, not a promise: the host subnet is sometimes called the public subnet, yet with secure cluster connectivity both of the workspace subnets use only private IPs.'
    link: https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/vnet-inject#:~:text=A%20host%20subnet%20%28sometimes%20called%20the%20public%20subnet%29
  - note: Choose your subnet sizes like a tattoo - the docs state flatly that subnet CIDR ranges cannot be changed after deployment.
    link: https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/vnet-inject#:~:text=Subnet%20CIDR%20ranges%20cannot%20be%20changed%20after%20deployment
  - note: It took seven years to get a way in after the fact - only in March 2026 did migrating an existing workspace from a Databricks-managed VNet into your own VNet become generally available.
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2026/march#:~:text=Update%20workspace%20network%20configuration%20to%20VNet%20injection%20is%20now%20GA
