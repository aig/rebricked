limitations:
  note: The VNet must be in the same region and subscription as the workspace, with an address space between /16 and /24, and two dedicated subnets (container and host) of at least /26 recommended. Subnets cannot be shared across workspaces or host other Azure resources, and subnet CIDR ranges cannot be changed after deployment. After March 31, 2026, new VNets require an explicit outbound connectivity method (Databricks recommends a NAT gateway).
  link: https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/vnet-inject#:~:text=Subnet%20CIDR%20ranges%20cannot%20be%20changed%20after%20deployment
  date: '2026-09-27'
