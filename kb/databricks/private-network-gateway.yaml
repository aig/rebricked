id: private-network-gateway
name: Private network gateway
aliases:
  - private network gateway
  - serverless private network gateway
  - NCC gateway
category: Compute / BI
what:
  note: Managed gateway that connects Databricks serverless compute to resources in your own VPC, and to whatever that VPC routes to, through one subnet, a cross-account IAM role, and your existing network connectivity configuration.
  link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/private-network-gateway#:~:text=A%20private%20network%20gateway%20connects%20Databricks%20serverless%20compute%20to%20one%20or%20more%20resources%20in%20your%20VPC%20through%20a%20single%20managed%20gateway
fact:
  - note: One of its three selling points is purely bureaucratic - serverless egress leaves from a stable set of IP addresses you own, so someone else's allowlist can finally be satisfied.
    link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/private-network-gateway#:~:text=Send%20serverless%20egress%20from%20your%20own%20set%20of%20IP%20addresses%2C%20so%20downstream%20systems%20can%20identify%20the%20traffic%20at%20the%20network%20layer
  - note: A networking feature with no network UI - during the preview the account REST API is the only way to configure one, with no console screen and no Terraform.
    link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/private-network-gateway#:~:text=You%20configure%20the%20gateway%20only%20through%20the%20account%20REST%20API
  - note: The docs announce that it is free and that this is temporary in the same sentence.
    link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/private-network-gateway#:~:text=It%20is%20not%20billed%20while%20it%20is%20in%20preview%2C%20but%20Databricks%20will%20charge%20for%20it%20in%20the%20future
