id: budget-policies
name: Budget policies
category: Data governance
what:
  note: Admin-defined tag sets applied automatically to a user's serverless compute usage, so serverless spend could be attributed to a team or project rather than landing in one undifferentiated bill.
  link: https://docs.databricks.com/aws/en/release-notes/product/2024/october#:~:text=workspace%20admins%20can%20now%20create%20and%20assign
fact:
  - note: Its own launch note has since been rewritten. The October 2024 entry now reads as though the feature shipped under a later name, and only an archived copy still carries the words it was actually announced with.
    link: https://web.archive.org/web/20250214052533/https://docs.databricks.com/en/release-notes/product/2024/october.html
  - note: The docs page for this feature has never moved off the URL it was given here, so the original name survives in the address bar long after it left the page.
    link: https://docs.databricks.com/aws/en/admin/usage/budget-policies
