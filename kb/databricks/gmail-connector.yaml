    date: 2026-08
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=The%20connector%20ingests%20messages%2C%20labels%2C%20drafts%2C%20filters%2C%20and%20profile%20data
introducedAt:
