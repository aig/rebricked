limitations:
  note: 'In Beta. One mailbox per connection, and domain-wide delegation needs a Google Workspace super administrator. Only messages and message_labels sync incrementally, and they do not support SCD Type 2; every other table is fully re-ingested each run. Run at least weekly or the history cursor expires and forces a full refresh.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/gmail-limits#:~:text=Each%20connection%20ingests%20a%20single%20mailbox
  date: '2026-10-20'
