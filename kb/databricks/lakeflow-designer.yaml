id: lakeflow-designer
name: Lakeflow Designer
aliases:
  - Designer
  - Visual Data Prep
category: Data engineering
what:
  note: A visual, no-code, AI-native experience for building ETL pipelines with a drag-and-drop canvas and natural language, backed by production-ready Lakeflow pipeline code.
  link: https://docs.databricks.com/aws/en/designer/#:~:text=visual%2C%20no%2Dcode%2C%20AI%2Dnative%20experience
fact:
  - note: Drag boxes on a canvas or describe the flow in plain English, and it emits real, production-ready pipeline code - so the prototype and the production job end up being the same thing.
    link: https://docs.databricks.com/aws/en/designer/#:~:text=backed%20by%20production%2Dready%20code
  - note: It went from Public Preview in April 2026 to GA just two months later, in June.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Lakeflow%20Designer%20is%20now%20generally%20available
  - note: 'The no-code canvas quietly grew a spreadsheet: an Enter Data operator lets you type tabular data in by hand, sitting right beside the operators reading from Unity Catalog.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=Manually%20create%20tabular%20data%20in%20a%20spreadsheet%2Dstyle%20editor
