limitations:
  note: Requires the Premium plan or above and a workspace admin to create connections; it is not available in AWS GovCloud regions (nor Azure China, Azure Government, or FedRAMP workspaces); not every Databricks partner solution is featured, and the flow is optimized for new partner accounts, so Databricks recommends connecting an existing partner account manually instead.
  link: https://docs.databricks.com/aws/en/partner-connect/#:~:text=available%20in%20AWS%20GovCloud%20regions
  date: '2026-09-11'
