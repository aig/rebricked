id: partner-connect
name: Partner Connect
aliases:
  - Databricks Partner Connect
  - Partner Connect integrations
category: Data engineering
what:
  note: A workspace UI that lets you create trial accounts with selected Databricks technology partners and connect the workspace to their ingestion, transformation, BI, and ML tools in a few clicks, provisioning the SQL warehouse, service principal, and token the partner needs on your behalf.
  link: https://docs.databricks.com/aws/en/partner-connect/#:~:text=lets%20you%20create%20trial%20accounts%20with%20select%20Databricks%20technology%20partners
fact:
  - note: Every partner you connect gets its own robot employee - Partner Connect mints a service principal named after the partner in shouty snake case, so Fivetran shows up in your workspace as FIVETRAN_USER.
    link: https://docs.databricks.com/aws/en/partner-connect/admin#:~:text=the%20service%20principal's%20display%20name%20is%20FIVETRAN_USER
  - note: Desktop tools such as Power BI Desktop and Tableau Desktop never earn the green check mark on their tile, even after you connect them, because Partner Connect has no way of knowing what happened on your laptop.
    link: https://docs.databricks.com/aws/en/partner-connect/#:~:text=do%20not%20display%20a%20check%20mark%20icon%20in%20their%20tile
  - note: 'Despite the name, there is no Partner Connect item in the sidebar: the docs send you to Marketplace and a Partner Connect integrations section with a View all link.'
    link: https://docs.databricks.com/aws/en/partner-connect/#:~:text=In%20Partner%20Connect%20integrations
status:
