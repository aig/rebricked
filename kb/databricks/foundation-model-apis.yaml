  note: Launch blog post, December 11, 2023
limitations:
  note: Pay-per-token endpoints are rate limited per model in input and output tokens per minute and queries per hour, with limits that vary by workspace platform tier and deployment type; provisioned throughput has no TPM limit but is capped at 200 queries per second per workspace with per-model output token limits. Each request is capped at a 4 MB payload and 597 seconds of model execution, and Databricks-hosted models are only available in supported regions.
  link: https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/limits#:~:text=Provisioned%20throughput%20limits
  date: '2026-09-20'
