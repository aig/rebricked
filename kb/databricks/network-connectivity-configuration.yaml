id: network-connectivity-configuration
name: Network connectivity configuration
aliases:
  - NCC
  - NCCs
  - network connectivity configurations
  - serverless network connectivity
  - Serverless secure connectivity
category: Compute / BI
what:
  note: Account-level, regional object that manages serverless compute networking - the private endpoints (Private Link) and stable firewall identities serverless compute uses to reach your resources - and is attached to one or more workspaces in a region.
  link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/#:~:text=Serverless%20network%20connectivity%20is%20managed%20with%20network%20connectivity%20configurations%20%28NCCs%29
fact:
  - note: Before NCCs, Azure customers allowlisted serverless SQL in their storage firewalls by copying subnet IDs straight out of the Azure Databricks documentation.
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2023/october#:~:text=subnet%20IDs%20that%20were%20listed%20in%20Azure%20Databricks%20documentation%20before%20October%2031%2C%202023
  - note: The stable IPs were not so stable - the Public Preview's legacy list was decommissioned, and anyone still allowlisting those copied IPs can expect serverless compute to hit 403 Forbidden.
    link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/#:~:text=The%20legacy%20list%20of%20stable%20IPs%20from%20the%20Public%20Preview%20was%20decommissioned
  - note: A network object that also attaches to a data catalog - an NCC can be attached to a metastore to give OpenSharing SecureConnect private connectivity.
    link: https://docs.databricks.com/aws/en/security/network/serverless-network-security/#:~:text=NCCs%20can%20be%20attached%20to%20a%20metastore%20to%20enable%20private%20connectivity%20for%20OpenSharing%20SecureConnect
