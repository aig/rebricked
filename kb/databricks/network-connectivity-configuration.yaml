  note: Azure Private Link and Azure Storage firewall for DBSQL Serverless GA blog
limitations:
  note: An NCC is regional and attaches only to workspaces in its own region. Per account, up to 10 NCCs per region and up to 50 workspaces per NCC; private endpoints are capped per region across all NCCs (on AWS 30 for S3 and 100 for VPC resources; on Azure 100). These are fixed limits.
  link: https://docs.databricks.com/aws/en/security/network/concepts/privatelink-concepts#:~:text=Up%20to%2010%20NCCs%20per%20region%20per%20account
  date: '2026-09-27'
