id: databricks-genie-app-in-microsoft-teams
name: Databricks Genie app in Microsoft Teams
aliases:
  - Genie for Teams
  - Genie Teams app
  - '@Databricks Genie'
category: AI / BI
what:
  note: The Databricks-built Microsoft Teams app that brings Genie into Teams - DM it or mention @Databricks Genie in a channel or group chat to ask a data question and get the answer without leaving Teams, routed through Genie One or a pinned Genie Agent.
  link: https://docs.databricks.com/aws/en/integrations/msft-teams#:~:text=The%20Databricks%20Genie%20app%20in%20Microsoft%20Teams%20brings%20Genie%20into%20Microsoft%20Teams
fact:
  - note: Whatever region your workspace is in, the app's central service runs in East US 2 - and the docs promise it doesn't persist or log any request or answer content on the way through.
    link: https://docs.databricks.com/aws/en/integrations/msft-teams#:~:text=The%20central%20service%20doesn%27t%20persist%20or%20log%20any%20request%20or%20answer%20content
  - note: You can upload PDF, Word, and CSV files for Genie to read, but only in a direct message with no agent pinned - in a channel it politely declines and tells you where uploads work.
    link: https://docs.databricks.com/aws/en/integrations/msft-teams#:~:text=File%20upload%20is%20supported%20only%20in%20direct%20messages%20without%20a%20pinned%20Genie%20Agent
  - note: It went Beta in June 2026, Public Preview in July, and generally available in November - and somewhere in between learned to accept a plain workspace URL at sign-in instead of a server hostname.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=you%20can%20now%20enter%20your%20workspace%20URL%20instead%20of%20a%20server%20hostname
status:
