  - type: ga
    date: 2026-11
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/november#:~:text=The%20Databricks%20Genie%20app%20in%20Microsoft%20Teams%20is%20now%20generally%20available
introducedAt:
  date: 2026-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=The%20Databricks%20Genie%20app%20in%20Microsoft%20Teams%20is%20now%20available%20in%20Beta
limitations:
  note: You can't choose the SQL warehouse - Databricks picks one the user is authorized to use. A pinned Genie Agent only receives new conversations. File upload works only in direct messages with no pinned agent, takes PDF, Word (.docx), and CSV files of 20 MiB or smaller, up to five per message, and needs OneDrive for Business plus app version 1.0.17 or above; saving answers as PDFs is direct-message only too. Workspaces with an IP access list must allow the East US 2 control plane IPs, and Private Link workspaces need a context-based ingress rule for the app.
  link: https://docs.databricks.com/aws/en/integrations/msft-teams#:~:text=You%20cannot%20specify%20which%20compute%20%28SQL%20warehouse%29%20the%20Databricks%20Genie%20app%20in%20Microsoft%20Teams%20uses
  date: '2026-11-10'
