id: foundation-model-training
name: Foundation Model Training
category: AI / ML
what:
  note: Databricks' first managed fine-tuning service - train or continue pre-training a foundation model on your own data, with checkpoints saved to MLflow and the result registered to Unity Catalog.
  link: https://docs.databricks.com/aws/en/release-notes/product/2024/may#:~:text=Databricks%20now%20supports%20Foundation%20Model%20Training
fact:
  - note: The docs path it launched at, /large-language-models/foundation-model-training/, still spells this name out in full years later, long after the page itself stopped using it.
    link: https://docs.databricks.com/aws/en/large-language-models/foundation-model-training/
  - note: It shipped straight into Public Preview in May 2024 with continued pre-training included, so you could pour raw text at a base model and have the result land in Unity Catalog without touching a cluster.
    link: https://docs.databricks.com/aws/en/release-notes/product/2024/may#:~:text=Databricks%20now%20supports%20Foundation%20Model%20Training
