  link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=Serverless%20compute%20access%20control%20is%20now%20generally%20available
limitations:
  note: In a service disruption access checks might fail open, so denied users could still start serverless workloads - Databricks says not to rely on it as an absolute spend cap. Background compute (system-initiated jobs) is exempt from the controls. The companion rate limits on serverless compute are still in Private Preview.
  link: https://docs.databricks.com/aws/en/compute/serverless/manage-serverless-compute#:~:text=access%20checks%20might%20fail%20open
  date: '2026-09-20'
