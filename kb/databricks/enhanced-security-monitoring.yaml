limitations:
  note: Applies only to classic compute (clusters and non-serverless SQL warehouses) - serverless resources get no extra monitoring; the workspace must be on the Enterprise pricing tier; the pre-installed agents cannot be disabled; and turning it on bills the Enhanced Security and Compliance add-on.
  link: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-monitoring#:~:text=do%20not%20have%20extra%20monitoring%20when%20enhanced%20security%20monitoring%20is%20enabled
