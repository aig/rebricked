id: enhanced-security-monitoring
name: Enhanced security monitoring
aliases:
  - ESM
  - Enhanced Security Monitoring
category: Data governance
what:
  note: A workspace setting that swaps classic compute onto a CIS-hardened Ubuntu Advantage disk image and adds antivirus, file integrity, and vulnerability monitoring agents whose findings land in the audit logs.
  link: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-monitoring#:~:text=provides%20an%20enhanced%20hardened%20disk%20image%20and%20additional%20security%20monitoring%20agents
fact:
  - note: The antivirus agent scans the whole host OS filesystem and the Databricks Runtime container filesystem for viruses once a day, and you cannot switch the pre-installed agents off - they are baked into the disk image.
    link: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-monitoring#:~:text=Scans%20the%20filesystem%20for%20viruses%20daily
  - note: 'The audit log schema quietly names the tools doing the work: file integrity events arrive from a service called capsule8-alerts-dataplane and antivirus events from clamAVScanService-dataplane.'
    link: https://docs.databricks.com/aws/en/admin/account-settings/audit-logs#:~:text=capsule8%2Dalerts%2Ddataplane
  - note: Vulnerability scan reports are emailed to every workspace admin each time Databricks ships a new AMI - on Azure that only became automatic in July 2024, before which admins had to ask for them.
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2024/july#:~:text=Previously%2C%20workspace%20admins%20had%20to%20request%20them
status:
