id: genie-spaces
name: Genie Spaces
category: AI / BI
what:
  note: Curated, governed conversational query spaces scoped to a business domain, letting business users ask questions of their structured data in plain English (text-to-SQL).
  link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=ask%20questions%20of%20their%20data%20in%20Databricks
fact:
  - note: A Genie Space was a topic-scoped room where analysts hand-fed the AI tables, metric definitions and sample queries, so a business user could ask 'how's my sales pipeline?' and get an answer instead of Slacking the data team.
    link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=the%20natural%2Dlanguage%20chat%20interface%20that%20business%20users
status:
  value: renamed
  link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=Genie%20Agents%20were%20formerly%20known%20as%20Genie%20Spaces.
  date: '2026-08-20'
