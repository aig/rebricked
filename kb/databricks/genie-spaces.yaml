id: genie-spaces
name: Genie Spaces
category: AI / BI
what:
  note: Curated, governed conversational query spaces scoped to a business domain, letting business users ask questions of their structured data in plain English (text-to-SQL).
  link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=ask%20questions%20of%20their%20data%20in%20Databricks
fact:
  - note: A Genie Space was a topic-scoped room where analysts hand-fed the AI tables, example SQL queries and instructions, so a business user could ask 'how's my sales pipeline?' in a chat box and get an answer instead of Slacking the data team.
    link: https://docs.databricks.com/aws/en/genie-agents/set-up#:~:text=the%20natural%2Dlanguage%20chat%20interface%20where%20business%20users%20ask%20questions%20of%20their%20data
status:
  value: renamed
