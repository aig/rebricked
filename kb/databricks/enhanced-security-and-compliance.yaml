id: enhanced-security-and-compliance
name: Enhanced Security and Compliance
aliases:
  - ESC
  - Enhanced Security and Compliance add-on
  - ESC add-on
category: Data governance
what:
  note: 'The platform add-on (a billing SKU, not a feature) that bundles three workspace security controls: the compliance security profile, enhanced security monitoring, and automatic cluster update.'
  link: https://docs.databricks.com/aws/en/security/privacy/#:~:text=Enhanced%20Security%20and%20Compliance%20is%20a%20platform%20add%2Don%20that%20provides%20enhanced%20security%20and%20controls%20for%20your%20compliance%20needs
fact:
  - note: 'It is a bundle, not a thing you switch on: the docs list exactly three members - the compliance security profile, enhanced security monitoring, and automatic cluster update - and enabling any one of them on a workspace adds the add-on to your bill.'
    link: https://docs.databricks.com/aws/en/security/privacy/#:~:text=The%20Enhanced%20Security%20and%20Compliance%20add%2Don%20includes
  - note: For its first two years you could not buy it without a phone call - the February 2024 release notes still say to contact your account representative to add it, and only in July 2025 did it become available to all customers with no contract changes required.
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/july#:~:text=is%20now%20available%20to%20all%20customers%2C%20with%20no%20contract%20changes%20required
  - note: Azure Databricks announced it in August 2023 as "the new add-on", a year after both of its headline features had already gone GA on AWS - so the packaging is younger than the parts.
    link: https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2023/august#:~:text=Both%20features%20are%20available%20as%20part%20of%20the%20new%20add%2Don
status:
  value: active
  link: https://docs.databricks.com/aws/en/security/privacy/#:~:text=Enhanced%20Security%20and%20Compliance%20is%20a%20platform%20add%2Don
  date: '2026-09-11'
introducedAt:
  date: '2023'
  link: https://docs.databricks.com/aws/en/release-notes/product/2023/may#:~:text=Enterprise%20pricing%20tier%20and%20the%20Enhanced%20Security%20and%20Compliance%20add%2Don
limitations:
  note: Requires the Enterprise pricing tier on AWS (Premium on Azure) and an account that includes the add-on; enhanced security monitoring and automatic cluster update only cover classic compute, and enabling the compliance security profile is intended to be permanent.
  link: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-compliance#:~:text=Your%20Databricks%20workspace%20is%20on%20the%20Enterprise%20pricing%20tier
  date: '2026-09-11'
