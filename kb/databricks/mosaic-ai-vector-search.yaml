id: mosaic-ai-vector-search
name: Mosaic AI Vector Search
category: AI / ML
what:
  note: Managed, serverless vector (similarity) search over Unity Catalog data, with one-click Delta-to-index sync, scaling to billions of embeddings.
  link: https://docs.databricks.com/aws/en/vector-search/vector-search#:~:text=over%20one%20billion%20vectors%20at%20dimension%20768
