limitations:
  note: Running the code for a single table is available only for streaming tables and materialized views - sinks and views are not supported. Running a single file skips errors in other files, uses each other table's most recent materialization, can fail on tables not yet materialized and may draw an incorrect or disjointed pipeline graph, and non-source code files cannot be external files outside the pipeline root folder.
  link: https://docs.databricks.com/aws/en/ldp/multi-file-editor#:~:text=Sinks%20and%20views%20are%20not%20supported
  date: '2026-09-20'
