  link: https://docs.databricks.com/aws/en/release-notes/product/2026/april#:~:text=is%20now%20generally%20available.%20This%20function%20parses%20structured%20content
  note: Announced April 16, 2026, the same day ai_parse_document went GA
limitations:
  note: Its parsing step, ai_parse_document, is limited to documents of at most 500 pages and 100 MB - a longer document fails immediately unless you pass a page range that stays within the limit.
  link: https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_parse_document#:~:text=Documents%20are%20limited%20to%20a%20maximum%20of%20500%20pages
  date: '2026-09-27'
