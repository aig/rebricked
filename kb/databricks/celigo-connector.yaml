  link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=The%20Celigo%20connector%20is%20now%20available%20in%20Lakeflow%20Connect
limitations:
  note: 'In Beta, switched on from the Previews page. Ingests only the audit_logs table, one data region per connection, and needs a full-access integrator.io API token from an account owner or administrator. Column renames need a full refresh, data type changes are not evolved, and row filtering is not supported.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/celigo-limits#:~:text=Each%20connection%20targets%20one%20data%20region
  date: '2026-10-20'
