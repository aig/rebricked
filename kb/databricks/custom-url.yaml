id: custom-url
name: Custom URL
aliases:
  - Custom URLs
  - branded account URL
  - account custom URL
category: Developer experience
what:
  note: A single branded entry point for a whole Databricks account (for example acme.databricks.com) that replaces the per-workspace URLs users navigate today, letting them move between workspaces and Genie One without signing in again.
  link: https://docs.databricks.com/aws/en/admin/account-settings/custom-url#:~:text=replaces%20the%20collection%20of%20per%2Dworkspace%20URLs%20that%20account%20users%20navigate%20today
fact:
  - note: 'You get the vanity domain on loan, not in freehold: the docs reserve Databricks the right to change, reclaim, or revoke a custom URL at any time, promising advance notice only where possible.'
    link: https://docs.databricks.com/aws/en/admin/account-settings/custom-url#:~:text=Databricks%20reserves%20the%20right%20to%20change%2C%20reclaim%2C%20or%20revoke%20a%20custom%20URL%20at%20any%20time
  - note: An eligible admin can claim the URL themselves with one button, but nobody can rename it themselves afterwards - changing it means contacting your Databricks account team.
    link: https://docs.databricks.com/aws/en/admin/account-settings/custom-url#:~:text=To%20rename%20your%20custom%20URL%2C%20contact%20your%20Databricks%20account%20team
  - note: 'The admin who claims it has to be on a company mailbox: the account must be a paying, verified customer and the claiming admin needs a non-reserved domain email address.'
    link: https://docs.databricks.com/aws/en/admin/account-settings/custom-url#:~:text=The%20account%20admin%20enabling%20the%20custom%20URL%20must%20have%20a%20non%2Dreserved%20domain%20email%20address
