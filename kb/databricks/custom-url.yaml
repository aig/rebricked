limitations:
  note: Public Preview, and the account must be enabled for unified login; workspaces on Inbound Private Link need custom-URL Private Link configured with context-based ingress policies. Developer tooling needs minimum versions (CLI/DABs 1.0.0, Terraform 1.114.0, Go SDK 0.130.0, Python SDK 0.103.0, Java SDK 0.105.0, VS Code extension 2.11.0). Unity Catalog OAuth connections need a custom-URL callback URI added to the third-party app, and dashboards embedded for external users need their embedding app updated.
  link: https://docs.databricks.com/aws/en/admin/account-settings/custom-url#:~:text=Your%20account%20must%20be%20enabled%20for%20unified%20login
