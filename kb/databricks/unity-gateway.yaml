  - note: The rename was applied backwards through the archive - the August 4, 2026 release note now reads "Unity Gateway is now generally available", while the blog post published that same day is still titled "Unity AI Gateway is Generally Available".
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=Unity%20Gateway%20is%20now%20generally%20available
  - note: It is big enough to have its own release-notes page apart from the platform notes, which introduces it as the enterprise control plane for governing AI cost, security, and access.
    link: https://docs.databricks.com/aws/en/release-notes/unity-gateway/#:~:text=the%20enterprise%20control%20plane%20for%20governing%20AI%20cost%2C%20security%2C%20and%20access
