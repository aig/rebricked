what:
  note: 'Databricks'' governance solution for enterprise AI, part of Unity Catalog: the control plane over the models, MCP servers, agents, and tools an organization uses, setting permissions, rate limits, spend limits, payload logging, and safety guardrails on every request.'
  link: https://docs.databricks.com/aws/en/ai-gateway/#:~:text=Unity%20Gateway%20is%20the%20Databricks%20governance%20solution%20for%20enterprise%20AI
fact:
