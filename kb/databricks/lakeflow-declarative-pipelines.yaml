category: Data engineering
what:
  note: Declarative framework for batch and streaming ETL pipelines.
  link: https://docs.databricks.com/aws/en/ldp/concepts/#:~:text=declarative%20framework%20for%20building%20batch%20and%20streaming%20data%20pipelines
fact:
  - note: You describe the tables you want and it works out the execution order and dependencies for you - and the DLT code written back in 2021 still runs unchanged under the new name.
    link: https://docs.databricks.com/aws/en/ldp/where-is-dlt#:~:text=there%20is%20no%20migration%20required%20to%20use%20Lakeflow%20pipelines
  - note: The open-source engine underneath is a separate project called Spark Declarative Pipelines, and Databricks docs increasingly shorten the product to just 'Lakeflow pipelines.'
    link: https://docs.databricks.com/aws/en/ldp/where-is-dlt#:~:text=has%20been%20updated%20to%20Lakeflow%20pipelines
