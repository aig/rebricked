limitations:
  note: A workspace is limited to 1000 concurrent pipeline updates; a pipeline allows at most 100 source files (or 50 folder entries referencing up to 1000 files); pivot() is unsupported, Delta time travel works only on streaming tables not materialized views, and identity columns are incompatible with AUTO CDC processing.
  link: https://docs.databricks.com/aws/en/ldp/limitations#:~:text=limited%20to%201000%20concurrent%20pipeline%20updates
