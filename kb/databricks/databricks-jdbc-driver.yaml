id: databricks-jdbc-driver
name: Databricks JDBC Driver
aliases:
  - Databricks JDBC Driver (OSS)
  - databricks-jdbc
  - OSS JDBC driver
category: Developer experience
what:
  note: The open source JDBC driver, version 3 and above, for connecting tools such as DataGrip, DBeaver, and SQL Workbench/J to Databricks.
  link: https://docs.databricks.com/aws/en/integrations/jdbc-oss#:~:text=This%20page%20provides%20information%20on%20installing%20and%20using%20the%20Databricks%20JDBC%20Driver%2C%20version%203%20and%20above
fact:
  - note: Databricks wrote this one itself and then published the source under Apache 2.0, so you can read exactly how your query results get fetched.
    link: https://docs.databricks.com/aws/en/integrations/jdbc-oss#:~:text=The%20Databricks%20JDBC%20Driver%20source%20code%20is%20publicly%20available%20under%20the%20Apache%202.0%20license
  - note: It can run queries through the Statement Execution APIs instead of Thrift, which the docs credit with the 'beneficial query result retention feature'.
    link: https://docs.databricks.com/aws/en/integrations/jdbc-oss#:~:text=which%20provides%20the%20beneficial%20query%20result%20retention%20feature
  - note: Java 8 holdouts get their own branch, which Databricks syncs with main only periodically and then politely invites the community to keep updated.
    link: https://docs.databricks.com/aws/en/integrations/jdbc-oss#:~:text=This%20branch%20is%20synced%20with%20the%20main%20branch%20periodically
status:
