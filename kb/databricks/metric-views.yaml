limitations:
  note: Measures have no fixed aggregation level, so a query must request them through the MEASURE function rather than selecting the column directly. Joined tables cannot include MAP type columns, a metric view that defines parameters cannot be materialized, and a one_to_many join restricts its materializations to exact match with no rollup match. Metric views need Databricks Runtime 16.4 or above, and Microsoft removed BI compatibility mode from the Power BI Databricks connector in April 2026, so Power BI reports that queried metric views through it no longer function.
  link: https://docs.databricks.com/aws/en/uc-semantics/metric-views/yaml-reference#:~:text=Joined%20tables%20can%27t%20include
  date: '2026-08-20'
