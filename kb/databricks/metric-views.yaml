id: metric-views
name: Metric views
aliases:
  - Unity Catalog metric views
  - Unity Catalog Metrics
  - Metric view
category: Data governance
what:
  note: Unity Catalog securable objects that define business KPIs once as reusable SQL metrics, separating measure definitions from the fields used to group, filter, and aggregate them.
  link: https://docs.databricks.com/aws/en/uc-semantics/metric-views/#:~:text=Metric%20views%20are%20the%20core%20implementation%20of
fact:
  - note: They are the core implementation of Unity Catalog semantics, which makes them the rare governance object that dashboards, notebooks, alerts, Genie Agents and external BI tools all read from the same definition.
    link: https://docs.databricks.com/aws/en/uc-semantics/metric-views/#:~:text=Metric%20views%20are%20the%20core%20implementation%20of
  - note: 'It is a view whose columns you cannot simply select: a measure has no pre-determined level of aggregation until query time, so SQL has to ask for it through a MEASURE function instead.'
    link: https://docs.databricks.com/aws/en/uc-semantics/metric-views/yaml-reference#:~:text=To%20reference%20a%20measure%20in%20a%20query
  - note: Databricks showed them off at Data + AI Summit 2025 under the name Unity Catalog Metrics and promised general availability 'later this summer'.
    link: https://www.databricks.com/blog/whats-new-databricks-unity-catalog-data-ai-summit-2025#:~:text=Generally%20Available%20later%20this%20summer
