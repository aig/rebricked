id: variant
name: Variant
aliases:
  - VARIANT
  - variant data type
  - variant shredding
category: Data engineering
what:
  note: 'A column type for semi-structured data: one column holds arbitrary nested JSON-shaped data with no declared schema, created with parse_json() and queried by path, while shredding gives it query performance closer to real typed columns.'
  link: https://docs.databricks.com/aws/en/release-notes/product/2026/july#:~:text=Variant%20is%20a%20flexible%20data%20type%20for%20semi%2Dstructured%20data%20that%20delivers%20structured%2Dlike%20query%20performance
fact:
  - note: 'Databricks recommends it as the replacement for keeping semi-structured data in JSON strings, but the swap can quietly change your answers: variant paths are matched case-sensitively, where JSON strings never cared.'
    link: https://docs.databricks.com/aws/en/semi-structured/variant-json-diff#:~:text=All%20variant%20path%20elements%20are%20matched%20in%20a%20case%2Dsensitive%20way.%20JSON%20strings%20are%20case%2Dinsensitive.
  - note: 'Its speed comes from quietly un-blobbing itself: shredding stores the fields that turn up often as real columns inside the Parquet files, so a query reads a column instead of picking through a binary blob.'
    link: https://docs.databricks.com/aws/en/tables/features/variant-shredding#:~:text=storing%20commonly%20occurring%20fields%20as%20separate%20columns%20in%20the%20underlying%20Parquet%20files
  - note: Shredding turns itself on for a new CREATE TABLE but pointedly not for CREATE OR REPLACE TABLE or ALTER TABLE - a deliberate refusal to change how anyone's existing tables and workloads already behave.
    link: https://docs.databricks.com/aws/en/tables/features/variant-shredding#:~:text=This%20avoids%20changing%20the%20shredding%20behavior%20of%20existing%20tables%20and%20workloads
status:
  value: active
  link: https://docs.databricks.com/aws/en/semi-structured/variant#:~:text=Databricks%20recommends%20using%20VARIANT%20over%20JSON%20strings%20for%20semi%2Dstructured%20data
  date: '2026-08-03'
