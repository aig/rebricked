occasion:
  date: 2026-04
  link: https://www.databricks.com/blog/introducing-databricks-connector-google-sheets-real-time-governed-lakehouse-data-sheets-users#:~:text=The%20Databricks%20connector%20for%20Google%20Sheets%20is%20now%20Generally%20Available%20for%20all%20Databricks%20customers
  note: Launch blog post (General Availability)
limitations:
  note: Runs on SQL warehouses only (all-purpose compute is not supported) and queries time out after 15 minutes. Write-back is table-level only - no row-level updates, appends or merges, and no views or materialized views. Scheduled refreshes can't be edited (delete and recreate), don't pick up edited queries, can't target pivot tables, hold at most 20 imports per schedule and cap query text at 4,096 characters. Renaming or deleting a sheet breaks its import's refresh, and Viewer or Commenter recipients of a shared sheet can't use the add-on.
  link: https://docs.databricks.com/aws/en/integrations/google-sheets/write-back#:~:text=The%20Databricks%20Connector%20for%20Google%20Sheets%20only%20supports%20SQL%20warehouses
  date: '2026-09-27'
