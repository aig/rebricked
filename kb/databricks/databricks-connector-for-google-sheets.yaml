id: databricks-connector-for-google-sheets
name: Databricks Connector for Google Sheets
aliases:
  - Google Sheets connector
  - Google Sheets add-on
  - Databricks for Google Sheets
category: Developer experience
what:
  note: A Google Sheets add-on that connects to a Databricks workspace so you can import governed Unity Catalog tables, SQL query results and pivot tables into a sheet, refresh them on a schedule, ask Genie One for data, and write ranges back to Unity Catalog tables.
  link: https://docs.databricks.com/aws/en/integrations/google-sheets/#:~:text=The%20Databricks%20Connector%20for%20Google%20Sheets%20connects%20your%20Databricks%20workspace%20with%20Google%20Sheets
fact:
  - note: The sheet's name is load-bearing - rename or delete a sheet tied to an import and it can no longer refresh, and one documented fix is to recreate a sheet with the exact same name.
    link: https://docs.databricks.com/aws/en/integrations/google-sheets/query-data#:~:text=Renaming%20or%20deleting%20a%20sheet%20that%20is%20attached%20to%20an%20existing%20import%20prevents%20you%20from%20refreshing%20the%20import
  - note: The ceiling is set by Google, not Databricks - imports go up to the Google Sheets limit of 10 million cells.
    link: https://docs.databricks.com/aws/en/integrations/google-sheets/query-data#:~:text=The%20connector%20supports%20importing%20up%20to%20the%20Google%20Sheets%20limit%20of%2010%20million%20cells
  - note: Scheduled refreshes only work once a metastore admin creates a Unity Catalog connection with one very specific name - databricks_google_connection.
    link: https://docs.databricks.com/aws/en/integrations/google-sheets/schedule-refresh#:~:text=A%20Unity%20Catalog%20connection%20called%20databricks_google_connection
status:
