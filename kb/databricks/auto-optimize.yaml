limitations:
  note: Auto compaction and optimized writes are always enabled for MERGE, UPDATE and DELETE operations and cannot be turned off there; the manual settings do not apply to Unity Catalog managed tables, which tune file size automatically, and the docs treat the autoOptimize.autoCompact table property as a legacy setting to unset when moving such tables to background auto compaction.
  link: https://docs.databricks.com/aws/en/tables/tune-file-size#:~:text=always%20enabled%20for
  date: '2026-09-11'
