id: auto-optimize
name: Auto Optimize
aliases:
  - Auto optimize
  - autoOptimize
  - delta.autoOptimize.autoCompact
  - delta.autoOptimize.optimizeWrite
  - Optimized writes
  - Auto compaction
category: Data engineering
what:
  note: Delta Lake's umbrella name for two table settings, autoOptimize.optimizeWrite and autoOptimize.autoCompact, that shape data files as they are written (shuffling before the write for fewer, larger files) and compact small files right after a write succeeds.
  link: https://docs.databricks.com/aws/en/tables/tune-file-size#:~:text=describes%20the%20settings
fact:
  - note: The 2019 headline Delta Lake feature has shrunk to a one-sentence glossary entry - the current docs say only that Auto optimize describes the settings autoOptimize.autoCompact and autoOptimize.optimizeWrite, then send you to its two halves.
    link: https://docs.databricks.com/aws/en/tables/tune-file-size#:~:text=describes%20the%20settings
  - note: The autoCompact setting accepts a value literally spelled legacy, which the docs define as an alias for true - so legacy mode is just the original fixed 128 MB target with no dynamic sizing.
    link: https://docs.databricks.com/aws/en/tables/tune-file-size#:~:text=Alias%20for
  - note: Auto compaction leaves a fingerprint - in the table history it appears as an OPTIMIZE operation with operationParameters.auto set to true, which is how you tell it apart from an OPTIMIZE a human ran.
    link: https://docs.databricks.com/aws/en/tables/tune-file-size#:~:text=operationParameters.auto
