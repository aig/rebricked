limitations:
  note: You must pick the VPC when you first create the workspace - an existing workspace on a Databricks-managed VPC cannot be moved into one (a customer-managed workspace can be moved to another VPC). The VPC needs DNS hostnames and resolution enabled, at least two private subnets in different Availability Zones (one workspace subnet per AZ), each with a netmask between /17 and /26 and outbound access via NAT or a similar appliance, plus one to five security groups; region availability is limited. Network configurations per account default to 11 on Premium and 55 on Enterprise, raisable on request.
  link: https://docs.databricks.com/aws/en/security/network/classic/customer-managed-vpc#:~:text=You%20cannot%20move%20an%20existing%20workspace%20with%20a%20Databricks%2Dmanaged%20VPC%20to%20use%20a%20customer%2Dmanaged%20VPC
  date: '2026-09-27'
