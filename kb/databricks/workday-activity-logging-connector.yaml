limitations:
  note: 'Beta, enabled by a workspace admin from the Previews page. No UI-based pipeline authoring (API, notebook or Declarative Automation Bundles only), no API-based row filtering, no SCD Type 2, and no schema evolution for data type changes. OAuth refresh token is the only supported authentication.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/workday-activity-logging#:~:text=UI%2Dbased%20pipeline%20authoring%20Not%20supported
  date: '2026-10-20'
