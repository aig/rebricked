id: databricks-assistant
name: Databricks Assistant
category: AI / ML
what:
  note: AI coding assistant that generates and fixes SQL and Python across notebooks, the SQL editor, and pipelines, grounded in Unity Catalog metadata.
  link: https://docs.databricks.com/aws/en/notebooks/code-assistant#:~:text=generates%20Python%20code%20or%20SQL%20queries%2C%20explains%20complex%20code
fact:
  - note: A context-aware helper wired into notebooks, the SQL editor and file editor that turns plain-English requests into SQL or Python, explains gnarly code, and quietly reads your Unity Catalog metadata to tailor answers.
    link: https://docs.databricks.com/aws/en/notebooks/code-assistant#:~:text=uses%20Unity%20Catalog%20metadata%20to%20understand%20your%20tables
