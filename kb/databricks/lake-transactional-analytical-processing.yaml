id: lake-transactional-analytical-processing
name: Lake Transactional/Analytical Processing (LTAP)
aliases:
  - LTAP
category: Data engineering
what:
  note: A data architecture that serves both transactional (OLTP) and analytical (OLAP) workloads from one unified storage layer in the lake under a single governance model, removing the CDC, replication, and transformation pipelines teams otherwise maintain to copy operational data into a separate analytical system. Databricks builds it on the Lakebase storage architecture and ships it as a set of Lakebase capabilities rather than as one feature.
  link: https://docs.databricks.com/aws/en/oltp/projects/ltap-overview#:~:text=is%20a%20data%20architecture%20that%20serves%20both%20transactional%20%28OLTP%29%20and%20analytical%20%28OLAP%29%20workloads
fact:
  - note: Databricks declared itself the world's first LTAP platform on the same day it coined the term LTAP, which does make the claim hard to dispute.
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-ltap-first-lake-transactionalanalytical#:~:text=world%27s%20first%20LTAP%20platform
  - note: The name is a deliberate play on HTAP, the decades-old holy grail of one engine doing both jobs; LTAP gives up on that and keeps Postgres for the writes and Lakehouse engines for the reads, unifying only the storage underneath.
    link: https://www.databricks.com/blog/lakebase-ltap-rethinking-database-storage#:~:text=LTAP%20is%20a%20deliberate%20play%20on%20HTAP
  - note: 'The architecture whose whole pitch is that there is no second copy of your data spent its rollout keeping two: Databricks dual-writes row and columnar formats to object storage during the transitional rollout stage, purely to check its own arithmetic.'
    link: https://www.databricks.com/blog/lakebase-ltap-rethinking-database-storage#:~:text=dual%20write%20both%20row%20format%20and%20columnar%20format%20in%20object%20stores%20for%20data%20verification
