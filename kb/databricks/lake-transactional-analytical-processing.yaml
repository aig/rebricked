id: lake-transactional-analytical-processing
name: Lake Transactional/Analytical Processing (LTAP)
aliases:
  - LTAP
category: Data engineering
what:
  note: A data processing architecture that unifies transactional (OLTP) and analytical (OLAP) workloads on a single copy of data in the lake, combining Lakebase (serverless Postgres on open object storage) with the Lakehouse under one governance model - so operational and analytical apps share one source of truth without ETL, replicas, or pipelines. Announced June 2026 and, per the press release's own availability note, coming soon as part of Lakebase.
  link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-ltap-first-lake-transactionalanalytical#:~:text=unifies%20transactions%2C%20analytics%2C%20streaming%2C%20and%20operational%20data%20on%20a%20single%20copy%20of%20storage%20in%20the%20lake
fact:
  - note: Databricks declared itself the world's first LTAP platform on the same day it coined the term LTAP, which does make the claim hard to dispute.
    link: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-ltap-first-lake-transactionalanalytical#:~:text=world%27s%20first%20LTAP%20platform
  - note: The name is a deliberate play on HTAP, the decades-old holy grail of one engine doing both jobs; LTAP gives up on that and keeps Postgres for the writes and Lakehouse engines for the reads, unifying only the storage underneath.
    link: https://www.databricks.com/blog/lakebase-ltap-rethinking-database-storage#:~:text=LTAP%20is%20a%20deliberate%20play%20on%20HTAP
  - note: 'The architecture whose whole pitch is that there is no second copy of your data currently keeps two: during the transitional rollout Databricks dual-writes row and columnar formats to object storage, purely to check its own arithmetic.'
    link: https://www.databricks.com/blog/lakebase-ltap-rethinking-database-storage#:~:text=dual%20write%20both%20row%20format%20and%20columnar%20format%20in%20object%20stores%20for%20data%20verification
