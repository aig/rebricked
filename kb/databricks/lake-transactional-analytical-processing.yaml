limitations:
  note: 'Not shipped yet: Databricks says it is still ironing out the kinks and rolling it out ''in the coming months'', during which it dual-writes row and columnar copies of the data purely to verify itself. Very small tables are left unconverted rather than given Iceberg metadata (they stay queryable), and the intermediate Postgres row versions kept for MVCC and point-in-time recovery are not visible to Iceberg or Delta readers.'
  link: https://www.databricks.com/blog/lakebase-ltap-rethinking-database-storage#:~:text=roll%20it%20out%20in%20the%20coming%20months
  date: '2026-08-04'
