limitations:
  note: 'Unity Catalog governs only analytical access to registered Lakebase data, not individual Postgres tables, so the transactional path is still controlled by Postgres GRANT and REVOKE. Each table has a single writer, either Lakebase or the lakehouse, and the capabilities implementing LTAP sit at mixed maturity and vary by cloud: registering Lakebase in Unity Catalog and synced tables are GA, LTAP Direct Writes and Lakehouse//RT queries on Lakebase are Beta, and Lakebase Change Data Feed is in Public Preview.'
  link: https://docs.databricks.com/aws/en/oltp/projects/ltap-overview#:~:text=It%20does%20not%20yet%20govern%20individual%20Postgres%20tables%20directly
  date: '2026-08-20'
