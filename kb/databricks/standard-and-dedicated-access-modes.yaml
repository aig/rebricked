limitations:
  note: On Standard access mode, Databricks Runtime for ML, GPU compute, R, RDD APIs, spark-submit tasks, Hive UDFs, the Scala SparkContext, and streaming socket sources aren't supported; compute runs as a low-privilege user with restricted filesystem access and can't reach the instance metadata service or other services in the Databricks VPC.
  link: https://docs.databricks.com/aws/en/compute/access-mode-limitations#:~:text=runs%20commands%20as%20a%20low%2Dprivilege%20user
