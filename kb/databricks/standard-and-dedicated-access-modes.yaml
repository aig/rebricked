fact:
  - note: '''Shared'' became ''Standard'' and ''Single user'' became ''Dedicated'' in 2025 - then ''Dedicated'' clusters were promptly allowed to be shared with a group, making the new name ironic on arrival.'
    link: https://www.databricks.com/blog/whats-new-unity-catalog-compute#:~:text=dedicated%20clusters%20can%20now%20be%20shared%20with%20a%20group
  - note: A new 'Auto' mode now just picks the recommended access mode for you.
    link: https://www.databricks.com/blog/whats-new-unity-catalog-compute#:~:text=automatically%20picks%20the%20recommended%20compute%20access%20mode
