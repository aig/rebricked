  link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=The%20Mission%20Critical%20workspace%20add%2Don%20is%20now%20in%20Public%20Preview.
limitations:
  note: Requires an Enterprise-plan workspace and the gated Managed DR preview; only account admins can toggle it, and it can't be turned off while a failover group is active. Enhanced security monitoring and automatic cluster update apply to classic compute only, and enabling the compliance security profile with standards permanently pins the workspace to CSP.
  link: https://docs.databricks.com/aws/en/admin/mission-critical#:~:text=can%27t%20turn%20off%20Mission%20Critical%20while%20any%20failover%20group
  date: '2026-07-23'
