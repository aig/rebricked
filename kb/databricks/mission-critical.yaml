id: mission-critical
name: Mission Critical
aliases:
  - Mission Critical add-on
category: Data governance
what:
  note: A workspace add-on that unlocks managed disaster recovery plus the Enhanced Security and Compliance (ESC) controls for a single compute rate, enabled per workspace from the account console.
  link: https://docs.databricks.com/aws/en/admin/mission-critical#:~:text=workspace%2Dlevel%20add%2Don%20that%20bundles%20managed%20disaster%20recovery
fact:
  - note: It bundles managed disaster recovery with the Enhanced Security and Compliance controls into one per-workspace add-on billed at a single compute rate - and it's gated, so you turn it on by talking to your account team from a new Add-ons tab, not with a toggle.
    link: https://docs.databricks.com/aws/en/admin/mission-critical#:~:text=with%20Enhanced%20Security%20and%20Compliance%20%28ESC%29%20features
  - note: It entered Public Preview on June 12, 2026.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Mission%20Critical%20workspace%20add%2Don%20is%20now%20in%20Public%20Preview
status:
  value: active
