  date: '2026'
  link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=This%20feature%20is%20in%20Beta
limitations:
  note: Fixed at 4 cores, 16 GB RAM and up to 100 GB of storage, with a maximum of 40 sandboxes per user and 100 per workspace; it doesn't yet integrate with serverless egress control, so it shouldn't be used in an SEG-enabled workspace; public IP addresses can change at any time; and home-directory data will be deleted when the Beta period ends.
  link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=Tech%20specs%3A%204%20cores%2C%2016%20GB%20RAM%2C%20up%20to%20100%20GB%20storage
  date: '2026-09-13'
