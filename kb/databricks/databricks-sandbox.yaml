id: databricks-sandbox
name: Databricks Sandbox
aliases:
  - sandbox
  - databricks sandbox
category: Compute / BI
what:
  note: An isolated, on-demand serverless environment for running untrusted code - an agent harness, AI-written code, background workers, or an IDE/SSH session - driven through the Databricks REST API, SDK, or CLI, with a persistent home directory.
  link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=Databricks%20Sandbox%20lets%20you%20run%20untrusted%20code%20in%20an%20isolated%20environment
fact:
  - note: The home directory is /home/sandbox-agent, which is a fairly direct statement about who the docs think the primary user is.
    link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=Data%20in%20your%20home%20directory%20%28%2Fhome%2Fsandbox-agent%29%20persists%20for%20the%20lifetime%20of%20your%20Databricks%20Sandbox
  - note: The first time you SSH in, Databricks quietly rewires coding harnesses such as Claude and Codex to send their inference through AI Gateway, so the agent is governed before it types anything.
    link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=automatically%20configures%20common%20coding%20harnesses%20such%20as%20Claude%20and%20Codex%20to%20use%20AI%20Gateway
  - note: Stopping a sandbox does not stop the storage bill - the home directory is billed for as long as the sandbox exists, so the only way to stop paying for storage is to delete it.
    link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=To%20stop%20paying%20for%20storage%2C%20you%20must%20delete%20the%20sandbox
status:
