introducedAt:
  date: '2026'
  link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=This%20feature%20is%20in%20Beta
limitations:
  note: Fixed at 4 vCPUs and 8 GB of RAM, with up to 100 GB in the home directory and 10 GB outside it (deleted on stop); default quotas of 40 active sandboxes per user (400 total) and 100 active per workspace (1,000 total); network egress is unrestricted and not configurable, ingress is closed; public IP addresses can change at any time; it is not a Spark runtime; the startup environment can't be customized; and Databricks might purge sandbox data at the end of the Beta.
  link: https://docs.databricks.com/aws/en/compute/serverless/sandbox#:~:text=Databricks%20Sandbox%20comes%20with%204%20vCPUs%20and%208%20GB%20of%20RAM
  date: '2026-09-27'
