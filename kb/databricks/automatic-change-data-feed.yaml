  link: https://docs.databricks.com/aws/en/release-notes/product/2026/september#:~:text=Automatic%20change%20data%20feed%20is%20now%20generally%20available
limitations:
  note: Needs Databricks Runtime 19 or above and a Unity Catalog table that is either Delta Lake with row tracking enabled or Iceberg v3. Only Databricks readers can query it, for Delta and Iceberg alike; it is unsupported on tables with row filters or column masks and for multi-statement transactions that modified the source table; and a query cannot span a non-additive schema change such as a column rename, drop, or type change.
  link: https://docs.databricks.com/aws/en/tables/features/change-data-feed#:~:text=Automatic%20change%20data%20feed%20isn%27t%20supported%20on%20tables%20with%20row%20filters%20or%20column%20masks
