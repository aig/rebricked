id: query-based-connectors
name: Query-based connectors
aliases:
  - Query-based ingestion
  - Lakeflow Connect query-based connector
category: Data engineering
what:
  note: 'Lakeflow Connect connectors that ingest from databases (Oracle, Teradata, SQL Server, MySQL, MariaDB, PostgreSQL and any Lakehouse Federation source) by querying the source on a schedule with a cursor column, with no CDC setup and no ingestion gateway.'
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/query-based-overview#:~:text=ingest%20data%20from%20databases%20by%20querying%20the%20source%20directly
fact:
  - note: To catch rows committed late by a long-running source transaction, each run quietly re-reads a short window just below the previous high-water mark.
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/query-based-overview#:~:text=re%2Dreads%20a%20short%20window%20of%20rows%20just%20below%20the%20high%2Dwater%20mark
  - note: It only sees the latest state of each changed row - if a row changes five times between runs, the four in-between versions never existed as far as it knows.
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/query-based-overview#:~:text=They%20don%27t%20capture%20every%20intermediate%20row%20state%20between%20runs
  - note: Through foreign catalog ingestion it can read any Lakehouse Federation source, so anything Databricks can federate it can also ingest.
    link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/query-based-overview#:~:text=All%20Lakehouse%20Federation%20data%20sources%20are%20supported%20using%20foreign%20catalog%20ingestion
