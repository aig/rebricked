limitations:
  note: Queries run directly against source tables, so they can be slower and add load compared with CDC connectors; runs are scheduled rather than continuous, deletion tracking needs API configuration (hard-delete tracking is in Beta), and the cursor column must be monotonically increasing.
  link: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/query-based-overview#:~:text=can%20place%20more%20load%20on%20the%20source%20database
  date: '2026-10-20'
