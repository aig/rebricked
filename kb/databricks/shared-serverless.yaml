  link: https://docs.databricks.com/aws/en/release-notes/product/2026/october#:~:text=notebooks%20and%20files%20in%20the%20same%20bundle%20can%20share%20serverless%20compute
limitations:
  note: Beta, behind the Project-Scoped Shared Compute preview. Compute sharing is scoped to a serverless usage policy, so notebooks and files in the same Git folder or bundle under different usage policies get separate compute; requires serverless environment version 5 or above; only the user who first attaches can run workloads; Python variables are not shared between notebooks.
  link: https://docs.databricks.com/aws/en/compute/serverless/notebooks/shared-serverless#:~:text=Compute%20sharing%20is%20scoped%20to%20a%20serverless%20usage%20policy
  date: '2026-10-26'
