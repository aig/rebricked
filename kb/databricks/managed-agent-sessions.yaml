id: managed-agent-sessions
name: Managed agent sessions
aliases:
  - agent sessions
  - agent conversation history
category: AI / ML
what:
  note: A fully managed, Lakebase-backed, framework-agnostic store for an agent's session state - the conversation history an agent reloads at the start of a turn and appends to as it runs.
  link: https://docs.databricks.com/aws/en/agents/agent-memory/managed-sessions
fact:
  - note: It is deliberately unopinionated about what a turn looks like - every item appended to a session can be any JSON-compatible value.
    link: https://docs.databricks.com/aws/en/agents/agent-memory/managed-sessions
  - note: The preview has no line item of its own - you are billed only for the Lakebase instance the sessions live in.
    link: https://docs.databricks.com/aws/en/agents/agent-memory/managed-sessions
