limitations:
  note: Beta, turned on by a workspace admin through the Artifacts preview. Each stored file has a size limit - 5 MB for data, 5 MB for pages and components, 10 MB for images - and printing or saving as PDF allows at most 50 MB across all files. Artifacts run in a sandbox without network access, so they can't load external scripts, fonts, or images or write data back to tables or external systems, and their data is a snapshot that does not refresh.
  link: https://docs.databricks.com/aws/en/genie-one/artifacts#:~:text=Artifacts%20run%20in%20a%20sandbox%20without%20network%20access
  date: '2026-11-13'
