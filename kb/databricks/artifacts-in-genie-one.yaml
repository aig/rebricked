id: artifacts-in-genie-one
name: Artifacts in Genie One
aliases:
  - Genie One artifacts
  - Genie artifacts
  - Slides in Genie One
  - Genie One slides
category: AI / BI
what:
  note: Slide decks and other custom visual pages that Genie One builds from your data and saves to your workspace, where you edit, present, and share them - and anyone viewing can Ask Genie about the data behind a chart or number.
  link: https://docs.databricks.com/aws/en/genie-one/artifacts#:~:text=Artifacts%20are%20slide%20decks%20and%20other%20custom%20visual%20pages%20that%20Genie%20One%20builds%20from%20your%20data
fact:
  - note: An artifact carries a snapshot of its query results around with it, so anyone who can view the artifact can see its data, source-table access or not - and the snapshot never updates when the source data changes.
    link: https://docs.databricks.com/aws/en/genie-one/artifacts#:~:text=Anyone%20who%20can%20view%20the%20artifact%20can%20see%20its%20data
  - note: The name was already taken in-house, so the docs stop to clarify that Genie One artifacts are unrelated to MLflow artifacts, the files MLflow logs with a model run.
    link: https://docs.databricks.com/aws/en/genie-one/artifacts#:~:text=unrelated%20to%20MLflow%20artifacts
  - note: Slide decks come with speaker notes and a Presenter view, and when the audience asks about a number you can select it, Ask Genie, and carry on - the presentation keeps running while Genie works on the answer.
    link: https://docs.databricks.com/aws/en/genie-one/slides#:~:text=The%20presentation%20keeps%20running%20while%20Genie%20works%20on%20the%20answer
