id: databricks-managed-mcp-servers
name: Databricks managed MCP servers
aliases:
  - Managed MCP servers
  - MCP servers
  - Model Context Protocol
category: AI / ML
what:
  note: Databricks-hosted Model Context Protocol servers that give AI agents governed access to Genie, AI Search, Databricks SQL, and Unity Catalog functions with no server to build or host.
  link: https://docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp#:~:text=ready%2Dto%2Duse%20servers%20that%20connect%20your%20AI%20agents
fact:
  - note: 'There is nothing to install: Databricks hosts the servers and manages authentication, so "adding" one means pointing a client at a path on your own workspace hostname.'
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp#:~:text=Databricks%20hosts%20the%20servers%20and%20manages%20authentication
  - note: Access is sliced per server by OAuth scope, so an agent that only needs to search an index cannot quietly acquire the ability to run SQL.
    link: https://docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp#:~:text=include%20the%20corresponding%20OAuth%20scope%20for%20each%20server
  - note: When the managed connectors moved under Unity AI Gateway in August 2026, every user of them had to reauthenticate, and Genie put up a prompt asking them to reconnect.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=Users%20must%20reauthenticate%20their%20connectors
