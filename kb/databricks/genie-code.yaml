limitations:
  note: Databricks warns that auto-approve is a productivity feature, not a security boundary, and says to keep it off for production data, sensitive workspaces, or shared resources; it also recommends always reviewing generated code before running it, since Genie Code can make mistakes.
  link: https://docs.databricks.com/aws/en/genie-code/agent-mode#:~:text=Auto%2Dapprove%20is%20a%20productivity%20feature%2C%20not%20a%20security%20boundary
