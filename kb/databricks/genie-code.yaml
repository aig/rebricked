id: genie-code
name: Genie Code
aliases:
  - Databricks Assistant
  - Assistant
category: AI / ML
what:
  note: AI coding assistant that generates and fixes SQL and Python across notebooks, the SQL editor, and pipelines, grounded in Unity Catalog metadata.
  link: https://docs.databricks.com/aws/en/notebooks/code-assistant#:~:text=generates%20Python%20code%20or%20SQL%20queries%2C%20explains%20complex%20code
fact:
  - note: Unlike a generic code assistant, it reads your Unity Catalog metadata - so its SQL and Python suggestions already know your real table and column names.
    link: https://docs.databricks.com/aws/en/notebooks/code-assistant#:~:text=understand%20your%20tables%2C%20columns%2C%20descriptions
  - note: Databricks' launch blog did not introduce it as a new product but as the newest addition to the Databricks Genie family.
    link: https://www.databricks.com/blog/introducing-genie-code#:~:text=the%20newest%20addition%20to%20the%20Databricks%20Genie%20family
  - note: 'You can put it on a schedule: a scheduled task runs your prompt as a full session and leaves behind a continuable chat with the results, and since the feature went GA on September 1, 2026 auto-approve is always on for those runs, because nobody is there to click yes.'
    link: https://docs.databricks.com/aws/en/genie-code/scheduled-tasks#:~:text=Auto%2Dapprove%20is%20always%20on%20for%20scheduled%20runs
status:
  value: active
