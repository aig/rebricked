id: databricks-excel-add-in
name: Databricks Excel Add-in
aliases:
  - Excel Add-in
  - Excel Connector
  - Databricks for Excel
category: Developer experience
what:
  note: A Microsoft Excel add-in that signs in to a Databricks workspace over SSO so you can browse and import governed Unity Catalog tables, run SQL, build pivot tables, and write data back, without leaving the spreadsheet.
  link: https://docs.databricks.com/aws/en/integrations/excel#:~:text=The%20Databricks%20Excel%20Add%2Din%20connects%20your%20Databricks%20workspace%20to%20Microsoft%20Excel
fact:
  - note: The data goes both ways - since June 2026 the add-in can create a new Unity Catalog table or overwrite an existing one straight from the sheet.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=Create%20a%20new%20table%20or%20overwrite%20an%20existing%20table%20in%20Databricks%20without%20leaving%20Excel
  - note: Genie One moved into the spreadsheet in August 2026, so you can ask for data in plain English inside Excel and get it back as native rows and columns.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=import%20the%20results%20into%20Microsoft%20Excel%20as%20native%20rows%20and%20columns
  - note: 'The August 2026 filter update gave with one hand and took with the other: cascading filters and case-insensitive matching arrived, and LIKE, NOT LIKE, IN, NOT IN and ILIKE quietly left.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/august#:~:text=are%20no%20longer%20available%20in%20the%20filters%20list
