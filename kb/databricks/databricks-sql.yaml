what:
  note: The serverless data warehouse for running SQL queries, dashboards, and BI on the lakehouse.
  link: https://learn.microsoft.com/en-us/azure/databricks/sql/release-notes/2021#:~:text=unifies%20data%2C%20AI%2C%20and%20BI%20workloads%20in%20one%20place
fact:
  - note: Easy to confuse with SQL Warehouse, but one's the product and the other's the compute engine that runs it - and it dropped the name 'SQL Analytics' back in 2021.
    link: https://learn.microsoft.com/en-us/azure/databricks/sql/release-notes/2021#:~:text=SQL%20Analytics%20is%20renamed%20to%20Databricks%20SQL.
  - note: 'When it was renamed in May 2021, even the access entitlement changed: ''SQL Analytics access'' became ''Databricks SQL access.'''
    link: https://learn.microsoft.com/en-us/azure/databricks/sql/release-notes/2021#:~:text=The%20entitlement%20to%20grant%20access%20to%20Databricks%20SQL%20has%20been%20renamed
