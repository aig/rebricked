id: ai-gateway
name: AI Gateway
aliases:
  - Mosaic AI Gateway
category: AI / ML
what:
  note: A centralized governance and monitoring layer for model serving endpoints - permissions, rate limits, payload logging, and safety guardrails for the generative-AI models an organization uses.
  link: https://docs.databricks.com/aws/en/ai-gateway/#:~:text=from%20a%20central%20control%20plane%2C%20so%20you%20can%20manage%20capacity
fact:
  - note: It entered public preview in September 2024 as "Mosaic AI Gateway," a centralized service that streamlines the usage and management of the AI models an organization uses.
    link: https://docs.databricks.com/aws/en/release-notes/product/2024/september#:~:text=streamlines%20the%20usage%20and%20management%20of%20AI%20models%20within%20an%20organization
  - note: Even its June 2025 general-availability announcement still carried the "Mosaic" prefix, reading "Mosaic AI Gateway is now generally available."
    link: https://docs.databricks.com/aws/en/release-notes/product/2025/june#:~:text=Mosaic%20AI%20Gateway%20is%20now%20generally%20available
