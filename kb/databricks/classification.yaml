id: classification
name: Classification
aliases:
  - Text Classification
category: AI / ML
what:
  note: Agent Bricks capability with a no-code UI that sorts documents and unstructured text into categories you define, built on the ai_classify SQL function.
  link: https://docs.databricks.com/aws/en/agents/agent-bricks/classification#:~:text=classify%20your%20documents%20into%20predefined%20categories%20with%20AI
fact:
  - note: The builder previews on just five rows at a time - it "classifies up to 5 documents and rows and displays the results" - so you tune labels on a tiny sample with thumbs-up/down feedback, then scale out via SQL or a Lakeflow pipeline.
    link: https://docs.databricks.com/aws/en/agents/agent-bricks/classification#:~:text=classifies%20up%20to%205%20documents%20and%20rows%20and%20displays%20the%20results
  - note: It leans on the ai_classify SQL function, whose v2 signature reached GA in June 2026.
    link: https://docs.databricks.com/aws/en/release-notes/product/2026/june#:~:text=ai_classify%20function%20is%20now%20generally%20available
status:
  value: active
  link: https://docs.databricks.com/aws/en/agents/agent-bricks/classification#:~:text=You%20can%20use%20Classification%20to%20classify%20your%20documents%20into%20predefined%20categories%20with%20AI.
