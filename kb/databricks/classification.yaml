limitations:
  note: Built on ai_classify, which isn't available on Databricks SQL Classic and can't be used with views. Labels must number between 2 and 500 unique values, with names of 1-100 characters and descriptions of 0-1000 characters, and total context is capped at 128000 tokens.
  link: https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_classify#:~:text=The%20maximum%20total%20context%20size%20is%20128%2C000%20tokens.
  date: '2026-07-23'
