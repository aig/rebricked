limitations:
  note: Read-only and unmodifiable, they must be enabled from a Unity Catalog-enabled workspace before anything appears, and free retention varies per table rather than being one number. Since August 26, 2026 the SQL text in system.query.history reads <REDACTED> by default - only account admins and members of the databricks_pii_access group see the full statement.
  link: https://docs.databricks.com/aws/en/admin/system-tables/query-history#:~:text=The%20statement_text%20field%20returns%20%3CREDACTED%3E%20by%20default
  date: '2026-09-10'
