id: system-tables
name: System tables
aliases:
  - system catalog
  - system.billing
category: Data governance
what:
  note: A Databricks-hosted analytical store of an account's own operational data - billing, access, compute, lineage and more - exposed as read-only Unity Catalog tables in the system catalog.
  link: https://docs.databricks.com/aws/en/admin/system-tables/#:~:text=analytical%20store%20of%20your%20account
fact:
  - note: 'Your own platform becomes a dataset you can join: the billing, audit and lineage data behind the console arrives as ordinary tables you query with SQL.'
    link: https://docs.databricks.com/aws/en/release-notes/product/2023/june#:~:text=easily%2Daccessed%20account%2Dwide%20observability%20data
  - note: They are read-only, so this is the rare Unity Catalog schema where your write privileges mean nothing at all.
    link: https://docs.databricks.com/aws/en/admin/system-tables/#:~:text=read%2Donly
  - note: The platform went generally available before most of its own tables did - the September 2024 GA covered the system tables platform plus exactly two billing tables.
    link: https://docs.databricks.com/aws/en/release-notes/product/2024/september#:~:text=system%20tables%20platform%20is%20now%20generally%20available
