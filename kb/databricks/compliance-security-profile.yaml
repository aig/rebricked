  - type: ga
    date: 2022-08
    link: https://docs.databricks.com/aws/en/release-notes/product/2022/august#:~:text=Add%20security%20controls%20with%20the%20compliance%20security%20profile%20%28GA%29
introducedAt:
  date: 2022-06
  link: https://docs.databricks.com/aws/en/release-notes/product/2022/june#:~:text=Enable%20enhanced%20security%20controls%20with%20a%20security%20profile%20%28Public%20Preview%29
limitations:
  note: Requires the Enterprise pricing tier and the Enhanced Security and Compliance add-on, SSO on the workspace, a workspace storage bucket with no period in its name, outbound port 2443 for FIPS endpoints, and only approved AWS Nitro instance types (Graviton fleet types excluded); enabling it is intended to be permanent, partner-powered AI features are off by default, and only allow-listed preview features are supported.
  link: https://docs.databricks.com/aws/en/security/privacy/enhanced-security-compliance#:~:text=Single%20sign%2Don%20%28SSO%29%20authentication%20is%20configured%20for%20the%20workspace
