# Build databricks.features.json from kb/, validate it, then deploy the static site to Pages
name: Validate and deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Gate every PR into the default branch with the same schema check (validate job only;
  # the deploy job below is guarded to push/dispatch so PRs never publish).
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The schema gate - a malformed entry must never reach production.
  # Same two commands contributors run locally.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Build databricks.features.json from kb/
        # kb/<vendor>/<id>.yaml is the source of truth; the JSON the app fetches is
        # build output and is not tracked, so every job that reads it builds it first.
        run: python3 scripts/build_features.py
      - name: Validate databricks.features.json
        run: python3 scripts/validate.py

  deploy:
    needs: validate
    # Only publish on push to main / manual dispatch - never on a pull_request run.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Build databricks.features.json from kb/
        # The data the app fetches at runtime, assembled from the per-entry YAML in kb/.
        # Not tracked, so this must run before build_entries.py and before the upload.
        run: python3 scripts/build_features.py
      - name: Build entry pages + sitemap
        # Regenerate the crawlable /{vendor}/... pages and sitemap.xml straight from
        # databricks.features.json so they can never drift from the data. No browser needed.
        run: python3 scripts/build_entries.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the site root - repo docs, scripts/ and reference/ stay private to the repo
          path: 'www'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
